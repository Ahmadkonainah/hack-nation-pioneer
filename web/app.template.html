<title>Stackwise: which rental laws apply here?</title>
<!--INLINE:fonts-->
<style>
/* Layout: sticky header with a permanent legal-notice strip; Lookup is a two-column workbench (address list | answer),
   the other tabs are single-column readouts. Palette is cool paper and ink with one teal accent; result colors are semantic. */
/* ---- design tokens: light theme. Result colors (--applies, --superseded ...) are semantic; each has a text color and a tint
   background. The axe contrast check is run on both themes after any change to these values. ---- */
:root {
  --bg: #F3F5F7; --surface: #FFFFFF; --surface2: #E9EDF1; --ink: #14202B; --muted: #566471; --line: #D5DDE4;
  --accent: #0B6A78; --accent-weak: #DCEFF2; --on-accent: #FFFFFF;
  --applies: #18794A; --applies-bg: #DFF3E7;
  --superseded: #6446B0; --superseded-bg: #EAE4F8;
  --unknown: #9A5B00; --unknown-bg: #FFEFD0;
  --not_yet_effective: #1D5BC8; --not_yet_effective-bg: #DFEAFB;
  --pending: #4F5D6B; --pending-bg: #E6EAEE;
  --none: #B7C2CC;
  --flag: #B42318; --flag-bg: #FDE8E6;
  --font-ui: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-law: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
/* ---- dark theme. The same tokens are written twice on purpose: once for people whose system is dark (unless they picked light
   with the button), once for people who picked dark with the button. CSS cannot share one block between a media query and an attribute selector. ---- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D141B; --surface: #151E27; --surface2: #1C2733; --ink: #E6EDF3; --muted: #9DABB8; --line: #2A3846;
    --accent: #56C2D0; --accent-weak: #12343A; --on-accent: #06242A;
    --applies: #5BD08F; --applies-bg: #12301F; --superseded: #B49CF2; --superseded-bg: #271F42;
    --unknown: #F2B24A; --unknown-bg: #3A2A08; --not_yet_effective: #7FAEF5; --not_yet_effective-bg: #14284A;
    --pending: #A9B6C3; --pending-bg: #222E3A; --none: #4A5968; --flag: #FF8A80; --flag-bg: #3D1613;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D141B; --surface: #151E27; --surface2: #1C2733; --ink: #E6EDF3; --muted: #9DABB8; --line: #2A3846;
  --accent: #56C2D0; --accent-weak: #12343A; --on-accent: #06242A;
  --applies: #5BD08F; --applies-bg: #12301F; --superseded: #B49CF2; --superseded-bg: #271F42;
  --unknown: #F2B24A; --unknown-bg: #3A2A08; --not_yet_effective: #7FAEF5; --not_yet_effective-bg: #14284A;
  --pending: #A9B6C3; --pending-bg: #222E3A; --none: #4A5968; --flag: #FF8A80; --flag-bg: #3D1613;
  color-scheme: dark;
}
/* ---- base ---- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--font-mono); font-size: 0.86em; }
.muted { color: var(--muted); }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; }

/* ---- header: brand, tabs, language toggle, theme button, legal notice ---- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brandtext { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; }
.mark { width: 28px; height: 28px; flex: none; }
.brand h1 { font-size: 19px; letter-spacing: -0.01em; margin: 0; line-height: 1.1; }
.brand span { color: var(--muted); font-size: 13px; }
.skip { position: absolute; left: 8px; top: -48px; background: var(--ink); color: var(--bg); padding: 8px 12px; border-radius: 8px; z-index: 50; text-decoration: none; font-weight: 600; }
.skip:focus { top: 8px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.tab .short { display: none; }
@media (max-width: 720px) { .tab .full { display: none; } .tab .short { display: inline; } }
.tab { border: 0; background: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 500; }
.tab:hover { background: var(--surface2); color: var(--ink); }
.tab[aria-current="page"] { background: var(--accent-weak); color: var(--accent); font-weight: 600; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 36px; height: 36px; display: inline-grid; place-items: center; cursor: pointer; color: var(--muted); padding: 0; }
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.icon-btn svg { width: 18px; height: 18px; }
.langs[hidden] { display: none; }
.langs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.langs button { border: 0; background: var(--surface); padding: 0 10px; height: 34px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 13px; }
.langs button[aria-pressed="true"] { background: var(--accent-weak); color: var(--accent); }
/* The legal notice is permanent but calm: a neutral strip with an icon, not an alarm. */
.notice { background: var(--surface2); color: var(--ink); border-top: 1px solid var(--line); font-size: 13px; }
.notice .wrap { padding-block: 7px; display: flex; gap: 4px 14px; align-items: center; }
.notice svg { width: 16px; height: 16px; flex: none; color: var(--accent); }
.notice b { font-weight: 700; }
.notice .linkbtn { white-space: nowrap; margin-left: auto; font-size: 13px; }
.ico { width: 1em; height: 1em; flex: none; vertical-align: -0.12em; }

/* ---- page frame and shared type ---- */
main { padding-block: 20px 56px; }
h1, h2, h3, h4 { line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 22px; }
h3 { font-size: 17px; }
.lede { color: var(--muted); max-width: 70ch; margin: 6px 0 0; }
.section-head { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
.eyebrow { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* ---- lookup layout: address picker (left) and answer (right) ---- */
.bench { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .bench { grid-template-columns: minmax(0, 1fr); } }
.side { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; position: sticky; top: calc(var(--topbar, 112px) + 8px); max-height: calc(100vh - var(--topbar, 112px) - 24px); display: flex; flex-direction: column; gap: 10px; min-height: 0; }
@media (max-width: 900px) { .side { position: static; max-height: none; } }
.search { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.fchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.alist { overflow: auto; margin: 0 -4px; padding: 0 4px; display: flex; flex-direction: column; gap: 2px; min-height: 120px; max-height: 60vh; }
@media (min-width: 901px) { .alist { max-height: none; flex: 1 1 auto; } }
.aitem { text-align: left; border: 1px solid transparent; background: none; border-radius: 8px; padding: 7px 9px; cursor: pointer; display: block; width: 100%; }
.aitem:hover { background: var(--surface2); }
.aitem[aria-current="true"] { background: var(--accent-weak); border-color: var(--accent); }
.aitem .s { font-weight: 600; font-size: 13.5px; overflow-wrap: anywhere; }
.aitem .m { font-size: 12px; color: var(--muted); }

/* ---- answer panel: title, jurisdiction stack, building facts, date controls, summary chips ---- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
/* The address is the answer's h2 (so the topic h3 headings below it are not a jump from h1). line-height and text-wrap are reset to what the plain div had. */
.addr-title { font-size: 26px; font-weight: 700; letter-spacing: -0.015em; overflow-wrap: anywhere; line-height: 1.5; text-wrap: wrap; }
.stack { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; margin-top: 14px; }
.layer { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 12px; min-width: 150px; flex: 1 1 150px; }
.layer .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.layer .v { font-weight: 600; }
.layer .n { font-size: 12.5px; color: var(--muted); }
.arrow { align-self: center; color: var(--muted); }
@media (max-width: 640px) {
  .arrow { display: none; }
  .stack { flex-direction: column; gap: 6px; }
  .layer { flex: none; min-width: 0; display: grid; grid-template-columns: 62px minmax(0, 1fr); column-gap: 8px; align-items: baseline; padding: 7px 10px; }
  .layer .n { grid-column: 2; }
}
.basis { margin-top: 10px; font-size: 13px; color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
.fact { border-top: 2px solid var(--line); padding-top: 6px; min-width: 0; }
.fact .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.fact .v { font-weight: 600; overflow-wrap: anywhere; }
.fact .v.missing { color: var(--unknown); }
.ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.ctrl label { font-weight: 600; font-size: 13px; }
input[type="date"] { padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
select { padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); max-width: 100%; }
.qbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 9px; cursor: pointer; font-size: 12.5px; font-family: var(--font-mono); }
.qbtn:hover { border-color: var(--accent); color: var(--accent); }
.sumbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 6px; }
.sumchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 11px; cursor: pointer; font-weight: 600; font-size: 13.5px; }
.sumchip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.sumchip .num { font-variant-numeric: tabular-nums; }
/* A result with no answers here is greyed by color, not by opacity, so its text keeps readable contrast. */
.sumchip[data-zero] .chip { background: var(--surface2); color: var(--muted); }

/* ---- first-visit guide and legend ---- */
details.guide { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; }
details.guide > summary { cursor: pointer; padding: 11px 16px; font-weight: 600; color: var(--accent); list-style-position: inside; }
details.guide > summary .muted { font-weight: 400; font-size: 13.5px; margin-left: 6px; }
@media (max-width: 720px) { details.guide > summary .muted { display: none; } }
.guide-body h2 { font-size: 16px; }
.guide-body { padding: 0 16px 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 20px; }
@media (max-width: 900px) { .guide-body { grid-template-columns: minmax(0, 1fr); } }
.steps { margin: 8px 0 0; padding: 0; list-style: none; counter-reset: step; display: flex; flex-direction: column; gap: 10px; }
.steps li { counter-increment: step; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: start; }
.steps li::before { content: counter(step); width: 24px; height: 24px; border-radius: 50%; background: var(--accent-weak); color: var(--accent); font-weight: 700; font-size: 13px; display: grid; place-items: center; }
.legend-list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.legend-list { margin-top: 8px; }
.legend-list li { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 4px 12px; align-items: center; font-size: 13.5px; }
.legend-list .chip { justify-self: start; }
@media (max-width: 560px) { .legend-list li { grid-template-columns: minmax(0, 1fr); } }
.guide-note { grid-column: 1 / -1; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; margin: 0; }

/* ---- address picker modes (sample / own building) and the phone picker toggle ---- */
.seg { flex: none; display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 8px 6px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-weak); color: var(--accent); }
.own { display: flex; flex-direction: column; gap: 10px; }
.own label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.own select { width: 100%; }
.own p { margin: 0; font-size: 13px; }
.pick-toggle { display: none; }
.pickbody { display: flex; flex-direction: column; gap: 10px; min-height: 0; flex: 1 1 auto; }
.panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px 16px; flex-wrap: wrap; }
.ph-title { min-width: 0; flex: 1 1 260px; }
.panel-head .tools { margin: 0; gap: 6px; }
.btn.sm { padding: 5px 9px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.btn.sm svg { width: 14px; height: 14px; }
.copied { min-height: 0; font-size: 12.5px; }
.copied:not(:empty) { margin-top: 6px; }
.jump { font-size: 12.5px; }
.qbtn { font-family: var(--font-ui); }
.qbtn[aria-pressed="true"] { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); font-weight: 600; }
@media (max-width: 900px) {
  .pick-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; cursor: pointer; margin-bottom: 12px; }
  .pick-toggle .t { min-width: 0; }
  .pick-toggle .s { font-weight: 600; overflow-wrap: anywhere; }
  .pick-toggle .a { color: var(--accent); font-weight: 600; white-space: nowrap; }
  .side.collapsed { display: none; }
}

/* ---- bottom line and the what-if form ---- */
.bottom { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.bottom .eyebrow { padding: 12px 16px 8px; }
.bl-row { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 4px 16px; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; padding: 10px 16px; cursor: pointer; border-radius: 0; }
.bl-row:hover { background: var(--surface2); }
.bl-cat { font-weight: 600; }
.bl-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.bl-line { display: flex; gap: 4px 10px; align-items: baseline; flex-wrap: wrap; }
.bl-line > span:last-child { overflow-wrap: anywhere; min-width: 0; }
.bl-minor { color: var(--muted); font-size: 13.5px; }
.bl-gap { color: var(--muted); font-size: 13.5px; }
@media (max-width: 640px) { .bl-row { grid-template-columns: minmax(0, 1fr); } }
details.whatif { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
details.whatif > summary { cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--accent); }
details.whatif > summary .muted { font-weight: 400; }
.wi-help { margin: 8px 0 0; font-size: 13px; max-width: 72ch; }
.wi-grid { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; margin-top: 10px; }
.wi-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.wi-grid input[type="text"] { width: 150px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.wi-grid .btn[disabled] { opacity: .5; cursor: default; }
.wi-bad { margin: 8px 0 0; font-size: 13px; color: var(--flag); }
.wi-note { margin-top: 14px; border: 1px solid var(--accent); background: var(--accent-weak); border-radius: 10px; padding: 9px 12px; font-size: 13.5px; }
.pill.changed { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.fact .n.entered { color: var(--accent); font-size: 12px; }
.cat { scroll-margin-top: calc(var(--topbar, 112px) + 12px); }

/* ---- result chips: always icon + word, never color alone ---- */
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 10px 2px 8px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.chip svg { width: 14px; height: 14px; flex: none; }
.r-applies { color: var(--applies); background: var(--applies-bg); }
.r-superseded { color: var(--superseded); background: var(--superseded-bg); }
.r-unknown { color: var(--unknown); background: var(--unknown-bg); }
.r-not_yet_effective { color: var(--not_yet_effective); background: var(--not_yet_effective-bg); }
.r-pending { color: var(--pending); background: var(--pending-bg); }

/* ---- topic sections and rule cards ---- */
.cat { margin-top: 22px; }
.cat h3 { display: flex; align-items: baseline; gap: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.cat h3 small { color: var(--muted); font-weight: 500; font-size: 12.5px; }
.gap { border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; color: var(--muted); font-size: 13.5px; }
.card { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 12px 14px; margin-bottom: 10px; scroll-margin-top: calc(var(--topbar, 112px) + 12px); }
.card.flash { box-shadow: 0 0 0 3px var(--accent); }
.card .row1 { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 12px; color: var(--muted); }
.card h4 { font-size: 16px; margin-top: 8px; }
.kv { display: inline-block; margin-top: 6px; font-family: var(--font-mono); font-size: 12.5px; background: var(--accent-weak); color: var(--accent); border-radius: 6px; padding: 2px 8px; }
.answer { margin: 8px 0 0; max-width: 78ch; }
.flagbox { margin-top: 10px; border: 1px solid var(--flag); background: var(--flag-bg); border-radius: 8px; padding: 8px 10px; font-size: 13.5px; }
.flagbox b { color: var(--flag); }
.linkbtn { border: 0; background: none; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 0; }
details.law { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
details.law summary { cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--accent); }
.dl { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 6px 14px; margin: 10px 0 0; font-size: 13.5px; }
@media (max-width: 560px) { .dl { grid-template-columns: minmax(0, 1fr); gap: 0; } .dl dt { margin-top: 8px; } }
.dl dt { color: var(--muted); font-weight: 600; }
.dl dd { margin: 0; overflow-wrap: anywhere; }
blockquote.q { margin: 0; font-family: var(--font-law); font-size: 15px; line-height: 1.55; border-left: 3px solid var(--line); padding: 2px 0 2px 12px; color: var(--ink); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 600; font-size: 13.5px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { color: var(--on-accent); filter: brightness(1.08); }

/* ---- changes tab: five test cards and the compare-dates table ---- */
.tgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 14px; }
.tcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.tid { font-family: var(--font-mono); font-weight: 500; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 1px 8px; font-size: 12.5px; }
.tnum { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.bars { display: flex; flex-direction: column; gap: 4px; }
.bar-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) 38px; gap: 8px; align-items: center; font-size: 12.5px; }
.bar-track { background: var(--surface2); border-radius: 4px; height: 8px; overflow: hidden; }
.bar-fill { background: var(--accent); height: 100%; }
.num { font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); background: var(--surface2); }
tr:last-child td { border-bottom: 0; }
.addrlinks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.addrlinks .qbtn { font-size: 11.5px; padding: 2px 6px; }
.block { margin-top: 28px; }

/* ---- coverage map: one small scatter per city ---- */
.mapgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 14px; }
.mapcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-width: 0; }
.mapcard svg { width: 100%; height: auto; display: block; background: var(--bg); border-radius: 8px; }
.mapcard svg circle { cursor: pointer; stroke: var(--surface); stroke-width: 1.2; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }

/* ---- rules and method tab: coverage matrix, timeline, rule list, method notes ---- */
.matrix td, .matrix th { text-align: center; }
.matrix td:first-child, .matrix th:first-child { text-align: left; white-space: nowrap; }
.cell0 { color: var(--flag); background: var(--flag-bg); }
.gantt { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.gantt svg { display: block; min-width: 880px; width: 100%; height: auto; }
.rrow summary { cursor: pointer; display: grid; grid-template-columns: 62px minmax(0, 1.1fr) minmax(0, 1fr) 110px; gap: 4px 12px; padding: 9px 10px; align-items: baseline; }
@media (max-width: 720px) { .rrow summary { grid-template-columns: 56px minmax(0, 1fr); } .rrow summary > :nth-child(n+3) { grid-column: 2; } }
.rrow { border-bottom: 1px solid var(--line); }
.rrow[open] { background: var(--surface2); }
.rrow .body { padding: 2px 12px 14px 74px; }
@media (max-width: 720px) { .rrow .body { padding-left: 12px; } }
.twocol { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.note h3 { margin-bottom: 6px; }
.note ul { margin: 6px 0 0; padding-left: 18px; }
.note li { margin: 4px 0; }
/* ---- footer and empty states ---- */
footer { border-top: 1px solid var(--line); padding-block: 18px 40px; color: var(--muted); font-size: 13px; }
footer .fl { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; }
.empty { color: var(--muted); padding: 24px; text-align: center; }
/* ---- phone layout: header is not sticky (it would eat the screen), tabs get their own row ---- */
@media (max-width: 720px) {
  .top { position: static; }
  .brand span { display: none; }
  .bar { gap: 6px 10px; }
  .tabs { order: 3; width: 100%; }
  .tab { padding: 7px 9px; font-size: 14px; }
  .notice { font-size: 12.5px; }
  .notice .wrap { align-items: flex-start; }
  .notice svg { margin-top: 2px; }
  .notice .linkbtn { display: none; }
  main { padding-block-start: 14px; }
  .addr-title { font-size: 22px; }
}
/* ---- print: answer only. Controls, the picker and the guide are hidden; every law disclosure shows its content. ---- */
@media print {
  :root { --bg: #fff; --surface: #fff; --surface2: #f2f2f2; }
  .top { position: static; border: 0; }
  .tabs, .icon-btn, .langs, .side, .pick-toggle, .ctrl, details.whatif, details.guide, .sumbar, .actions, .linkbtn, .notice .linkbtn, .skip { display: none !important; }
  .notice { border: 1px solid #999; }
  .bench { display: block; }
  .panel, .bottom, .card { break-inside: avoid; box-shadow: none; }
  details.law > :not(summary) { display: block; }
  a { color: inherit; text-decoration: none; }
  main { padding: 8px 0; }
}
/* ---- motion: no smooth scrolling or transitions for people who ask for less motion ---- */
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
/* ---- language-dependent pieces (used in both languages; the Spanish view only adds more of them) ---- */
.srcnote { margin: 6px 0 0; font-size: 12px; color: var(--muted); }            /* "automatic translation, not reviewed" line under a Spanish summary */
.answer + .answer { margin-top: 4px; }                                          /* the Spanish result sentence sits right under the summary */
.entag { color: var(--muted); font-size: 12.5px; }                              /* "(en inglés)" label before a whole English paragraph */
.lawnote { margin: 8px 0 0; font-size: 13px; color: var(--muted); }            /* one-line note: the legal text is in English */
@media (min-width: 561px) { html[lang="es"] .dl { grid-template-columns: 190px minmax(0, 1fr); } }  /* Spanish labels are longer */
@media (max-width: 640px) { html[lang="es"] .layer { grid-template-columns: 78px minmax(0, 1fr); } }  /* "CONDADO" needs more room than "County" */

/* A box that scrolls sideways (the wide tables and the timeline on a phone) must be reachable by keyboard, or a keyboard user cannot read the hidden part.
   So when a box really overflows it gets tabindex, a region role and a name (from its data-label); when it fits, none of that, so wide screens get no extra tab stops. */
function markScrollers() {
  for (const el of document.querySelectorAll(".tablewrap[data-label], .gantt[data-label]")) {
    if (el.scrollWidth > el.clientWidth + 1) { el.tabIndex = 0; el.setAttribute("role", "region"); el.setAttribute("aria-label", el.dataset.label); }

/* Facts a person types in. Parsed here, applied by the engine (NE.applyWhatIf), never stored anywhere.
   Returns { year_built?, units?, owner_occupied? } from the raw text in S.wi[address], or null when nothing valid is typed. */
function wiOf(a) {
  const x = S.wi[a.id];
  if (!x) return null;
  const w = {};
  const y = /^\d{4}$/.test((x.year || "").trim()) ? +x.year.trim() : null;
  if (y !== null && y >= 1700 && y <= 2100) w.year_built = y;
  const n = /^\d{1,5}$/.test((x.units || "").trim()) ? +x.units.trim() : null;
  if (n !== null && n > 0) w.units = n;
  if (x.owner === "yes") w.owner_occupied = true;
  if (x.owner === "no") w.owner_occupied = false;
  return Object.keys(w).length ? w : null;

/* The message under the year field when the typed year is not four digits; "" when fine. */

/* The right column. Two layers on purpose: renderAnswer draws the panel (title, facts, date, the what-if FIELDS) and an empty #ansBody;

/* The four fact tiles (year built, units, parcel use, data source), with typed values merged in, plus the Clear button state and the year error. */

/* Everything under the panel: the what-if note, the bottom line, the result filter chips, and the rule cards grouped by topic.

function renderBody() {
  const a = byAddr[S.addr], w = wiOf(a);
  const baseEntries = lookupOne(a, S.date).entries;
  const entries = w ? NE.lookupAddress(addrInput(a), RULES, S.date, w).entries : baseEntries;
  const was = Object.fromEntries(baseEntries.map((e) => [e.team_rule_id, e.result]));
  const counts = resultCounts(entries);

    const gone = baseEntries.filter((e) => !entries.some((x) => x.team_rule_id === e.team_rule_id)).length;
    const bits = [];

    if (w.owner_occupied === false) bits.push(t("no owner lives there"));
    const moves = Object.entries(moved).map(([k, c]) => { const [p, q] = k.split(">"); return t("{c} {from} to {to}", { c, from: resLabel(p).toLowerCase(), to: resLabel(q).toLowerCase() }); });
    const what = n || gone
      ? `${tn(n, "{n} answer changed", "{n} answers changed")}${moves.length ? ` (${moves.join("; ")})` : ""}${gone ? `; ${tn(gone, "{n} rule no longer applies", "{n} rules no longer apply")}` : ""}.`
      : t("No answer changes with these facts.");
    html.push(`<div class="wi-note" role="status"><b>${te("Using your facts:")}</b> ${esc(bits.join(", "))}. ${esc(what)} <button class="linkbtn" data-act="wiclear">${te("Clear")}</button></div>`);

/* The answer first: one block per topic, before the detail cards. Each row lists, per result, up to two rule names and "and N more". Click jumps to the topic. */
function bottomLine(entries) {

/* The one Spanish sentence about a result. Built from fixed templates (not from the English engine text) and the card's own data. Plain text. */
function resultSentence(e, r, by) {

/* Copy the current answer (with typed facts, if any) as JSON. The keys are machine names, so the JSON is the same in both languages. */
function copyJson() {
  const a = byAddr[S.addr];
  const w = wiOf(a);
  const out = w ? NE.lookupAddress(addrInput(a), RULES, S.date, w) : lookupOne(a, S.date);
  const payload = { address_id: a.id, as_of: S.date, ...(a.own ? { place: a.city || a.state } : {}), ...(w ? { facts_entered_by_user: w } : {}), lookups: out.entries.map((e) => ({ team_rule_id: e.team_rule_id, result: e.result, explanation: e.explanation, conflict_flag: e.conflict_flag })) };

/* Clipboard access can be refused (older browsers, embedded frames); say so instead of failing silently. */
function copyText(text, okMsg) {
  const done = (ok) => { const c = $("#copied"); if (c) c.textContent = ok ? okMsg : t("Copy was blocked here. Select the text on the page instead."); };
  try { navigator.clipboard.writeText(text).then(() => done(true), () => done(false)); } catch (e) { done(false); }

/* ---- deep links: the address (or own building), date, typed facts and language live in the URL hash, so an answer can be shared by copying the link. ----
   A hash, not a query string: the browser never sends it to a server, it works when the page is opened from a file, and changing it does not reload the page. */
/* Write S into the hash with replaceState (no new history entry per keystroke). Format: #tab?a=ID&d=DATE&y=YEAR&u=UNITS&o=yes|no&lang=es */
function syncHash() {
  const q = new URLSearchParams();
  if (S.tab === "lookup") {
    if (S.mode === "own") q.set("own", S.ownPlace); else q.set("a", S.addr);
    if (S.date !== DEFAULT_DATE) q.set("d", S.date);
    const x = S.wi[S.addr];
    if (x) { if (x.year) q.set("y", x.year); if (x.units) q.set("u", x.units); if (x.owner) q.set("o", x.owner); }
  }
  if (S.lang === "es") q.set("lang", "es");
  const qs = q.toString();
  const h = "#" + S.tab + (S.tab === "lookup" || qs ? "?" + qs : "");
  try { history.replaceState(null, "", h); } catch (e) { /* sandboxed frame: sharing a link is then not possible, nothing else breaks */ }
}
/* Read the hash once at start-up into S. Every value is checked (known tab, known address, real date, short typed text), so a bad link falls back to the defaults. */
function readHash() {
  const [tab, qs] = (location.hash || "").replace(/^#/, "").split("?");
  if (TABS.some(([k]) => k === tab)) S.tab = tab;
  const q = new URLSearchParams(qs || "");
  const own = q.get("own"), id = q.get("a"), d = q.get("d");
  if (own && ownPlaces().some((x) => x.key === own)) { S.ownPlace = own; S.mode = "own"; syncOwn(); S.addr = OWN_ID; S.wiOpen = true; S.guide = false; }
  else if (id && byAddr[id]) { S.addr = id; S.lastSample = id; S.guide = false; }
  if (d && /^\d{4}-\d{2}-\d{2}$/.test(d) && NE.parseDate(d) !== null) S.date = d;
  const y = (q.get("y") || "").slice(0, 4), u = (q.get("u") || "").slice(0, 5), o = q.get("o");
  if (y || u || o === "yes" || o === "no") S.wi[S.addr] = { year: y, units: u, owner: o === "yes" || o === "no" ? o : "" };
  if (q.get("lang") === "es" && HAS_ES) S.lang = "es";
}

/* How many of the given addresses are in each city, biggest first: [[city, count], ...]. */
function cityBreakdown(ids) {

/* A test's note from changes.json, with the machine word "not_yet_effective" spelled out and the repeated title cut off.
   This is English text written by the pipeline; the Spanish view shows it under the "(in English)" label, not translated. */
function cleanNote(tc) {

    const n = firstIn("Newark, NJ"); if (n) ex.push({ label: "Newark address (no ban)", id: n.id, date: DEFAULT_DATE });

/* Compare every rule's answer at every address on two dates. Returns the rows that differ (rule, result before, result after, which addresses),
   biggest first, plus how many answers were compared and how many stayed the same. A rule missing on one date counts as "not_listed". */
function diffDates(A, B) {
  const ra = allAt(A), rb = allAt(B), map = new Map();
  let same = 0, total = 0;
  for (const a of ADDR) {
    const ea = new Map(ra[a.id].map((e) => [e.team_rule_id, e.result]));
    const eb = new Map(rb[a.id].map((e) => [e.team_rule_id, e.result]));
    for (const id of new Set([...ea.keys(), ...eb.keys()])) {
      const from = ea.get(id) || "not_listed", to = eb.get(id) || "not_listed";
      total++;
      if (from === to) { same++; continue; }
      const k = `${id}|${from}|${to}`;
      if (!map.has(k)) map.set(k, { id, f: from, t: to, addrs: [] });
      map.get(k).addrs.push(a.id);
    }
  }
  return { rows: [...map.values()].sort((x, y) => y.addrs.length - x.addrs.length), same, total };
}

/* The rule whose answers differ most across the sample addresses on a date (most distinct results, then most addresses). Fallback when r-0001 is absent. */
function varied(date) {
  const all = allAt(date);
  let best = null, bestScore = -1;
  for (const r of RULES) {
    const seen = new Set(); let n = 0;
    for (const a of ADDR) { const e = all[a.id].find((x) => x.team_rule_id === r.team_rule_id); if (e) { seen.add(e.result); n++; } }
    const score = seen.size * 1000 + n;
    if (score > bestScore) { bestScore = score; best = r.team_rule_id; }
  }
  return best;
}
/* The coverage map tab: one small scatter per city for the chosen rule and date, each dot colored by its answer. Scale is per city, not shared, and the page says so. */
function renderMap(v) {
  if (!S.mapRule || !byRule[S.mapRule]) S.mapRule = byRule["r-0001"] ? "r-0001" : varied(S.date);
  const r = byRule[S.mapRule];
  const all = allAt(S.date);
  const opts = RULES.slice().sort((x, y) => x.jurisdiction.localeCompare(y.jurisdiction) || x.team_rule_id.localeCompare(y.team_rule_id))
    .map((x) => `<option value="${x.team_rule_id}" ${x.team_rule_id === S.mapRule ? "selected" : ""}>${esc(x.jurisdiction)} · ${esc(titleOf(x))} (${x.team_rule_id})</option>`).join("");
  // A statewide rule is in scope for every address in the state; a city rule only for addresses the geocoder placed in that city.
  const inScope = (a) => r.level === "state" ? a.state === r.jurisdiction : a.city === r.jurisdiction;
  const groups = {};
  let missingGeo = 0;
  for (const a of ADDR) {
    if (!inScope(a)) continue;
    if (a.lat == null) { missingGeo++; continue; }
    (groups[cityOf(a)] = groups[cityOf(a)] || []).push(a);
  }
  const tally = Object.fromEntries(RES_ORDER.concat(["none"]).map((k) => [k, 0]));
  const panels = Object.keys(groups).sort().map((city) => {
    const pts = groups[city];
    // Equirectangular projection around the city's mean latitude, then fit the points into the 320 x 220 box.
    const lat0 = pts.reduce((s, p) => s + p.lat, 0) / pts.length;
    const kx = Math.cos(lat0 * Math.PI / 180);
    const xs = pts.map((p) => p.lon * kx), ys = pts.map((p) => -p.lat);
    const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
    const W = 320, H = 220, pad = 16;
    const span = Math.max(maxx - minx, maxy - miny, 1e-6);
    const sc = Math.min((W - 2 * pad) / span, (H - 2 * pad) / span);
    const ox = (W - sc * (maxx - minx)) / 2, oy = (H - sc * (maxy - miny)) / 2;
    const counts = Object.fromEntries(RES_ORDER.concat(["none"]).map((k) => [k, 0]));
    const dots = pts.map((p, i) => {
      const e = all[p.id].find((x) => x.team_rule_id === r.team_rule_id);
      const k = e ? e.result : "none";
      counts[k]++; tally[k]++;
      return `<circle cx="${(ox + sc * (xs[i] - minx)).toFixed(1)}" cy="${(oy + sc * (ys[i] - miny)).toFixed(1)}" r="4.6" style="fill:var(--${k})" data-act="jump" data-id="${p.id}" data-date="${esc(S.date)}"><title>${esc(p.street)}: ${esc(k === "none" ? t("rule not listed here") : resLabel(k))}</title></circle>`;
    }).join("");
    // The per-panel count line is the text equivalent of the colors: the map never carries meaning by color alone.
    const line = RES_ORDER.concat(["none"]).filter((k) => counts[k]).map((k) => `${counts[k]} ${k === "none" ? t("not listed") : resLabel(k).toLowerCase()}`).join(", ");
    return `<div class="mapcard"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(cityShort(city))}</b><span class="muted" style="font-size:12.5px">${te("{n} addresses", { n: pts.length })}</span></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${te("Addresses in {city} colored by answer", { city })}">${dots}</svg>
      <div class="muted" style="font-size:12.5px;margin-top:6px">${esc(line)}</div></div>`;
  }).join("");
  v.innerHTML = `<div class="section-head"><div class="eyebrow">${te("Coverage map")}</div><h2>${te("Where does one rule apply?")}</h2>
    <p class="lede">${te("Each dot is a sample address, placed by its Census coordinates. Color shows the answer for the rule you pick, on the date you pick. Select a dot to open that address.")}</p></div>
    <div class="ctrl" style="margin-top:0;border-top:0;padding-top:0">
      <label for="mapRule">${te("Rule")}</label><select id="mapRule">${opts}</select>
      <label for="mapDate">${te("As of")}</label><input type="date" id="mapDate" value="${esc(S.date)}">
    </div>
    <div class="legend">${RES_ORDER.map((k) => `<span><i class="dot" style="background:var(--${k})"></i>${esc(resLabel(k))} (${tally[k]})</span>`).join("")}<span><i class="dot" style="background:var(--none)"></i>${te("Rule not listed here ({n})", { n: tally.none })}</span></div>
    <div class="mapgrid">${panels || `<div class="note">${te("No geocoded address is in scope for this rule.")}</div>`}</div>
    <p class="muted" style="font-size:13px;margin-top:10px">${missingGeo ? esc(tn(missingGeo, "{n} address is not shown because the geocoder could not place them.", "{n} addresses are not shown because the geocoder could not place them.")) + " " : ""}${te("Panels are drawn to scale inside each city, not to a shared map.")}</p>`;
}

/* ------------------------------------------------------------------ rules + method */
/* The places that have rules, in display order: each state, then its cities. Used by the own-building picker, the coverage matrix and the rules filter. */
const JURS = () => {
  const order = ["CA", "NJ", "MA"];
  const cities = [...new Set(ADDR.map((a) => a.city).filter(Boolean).concat(RULES.map((r) => r.jurisdiction).filter((j) => /, [A-Z]{2}$/.test(j))))];
  const out = [];
  for (const st of order) { out.push(st); for (const c of cities.filter((c) => c.endsWith(", " + st)).sort()) out.push(c); }
  return out;
};
/* Timeline (SVG) of when each rule takes effect, 2020 to 2028, with a red line at the as-of date. Drawn by hand: no chart library, no request. */
function ganttSvg() {
  const x0 = new Date("2020-01-01T00:00:00Z").getTime(), x1 = new Date("2028-12-31T00:00:00Z").getTime();
  const LBL = 300, W = 900, rowH = 18, top = 26;
  const rules = RULES.slice().sort((a, b) => JURS().indexOf(a.jurisdiction) - JURS().indexOf(b.jurisdiction) || a.team_rule_id.localeCompare(b.team_rule_id));
  const H = top + rules.length * rowH + 10;
  const X = (ms) => LBL + ((Math.min(Math.max(ms, x0), x1) - x0) / (x1 - x0)) * (W - LBL - 14);
  const asOf = new Date(S.date + "T00:00:00Z").getTime();
  let g = "";
  for (let y = 2020; y <= 2028; y++) {
    const x = X(new Date(`${y}-01-01T00:00:00Z`).getTime());
    g += `<line x1="${x}" y1="${top - 6}" x2="${x}" y2="${H - 6}" stroke="var(--line)"/><text x="${x + 3}" y="${top - 10}" font-size="10.5" fill="var(--muted)">${y}</text>`;
  }
  rules.forEach((r, i) => {
    const y = top + i * rowH + rowH / 2;
    const label = `${r.team_rule_id} ${r.jurisdiction.replace(/, [A-Z]{2}$/, "")}: ${titleOf(r)}`;
    g += `<text x="4" y="${y + 3.5}" font-size="10.5" fill="var(--ink)">${esc(label.length > 54 ? label.slice(0, 53) + "…" : label)}</text>`;
    const col = r.status === "in_force" ? "applies" : r.status === "not_yet_effective" ? "not_yet_effective" : r.status === "pending" ? "pending" : "unknown";
    if (r.status === "failed") { g += `<text x="${LBL}" y="${y + 3.5}" font-size="10.5" fill="var(--muted)">${te("failed, never law")}</text>`; return; }
    if (r.status === "pending") { g += `<line x1="${LBL}" y1="${y}" x2="${W - 14}" y2="${y}" stroke="var(--pending)" stroke-dasharray="3 4"/><text x="${LBL + 6}" y="${y - 4}" font-size="9.5" fill="var(--muted)">${te("bill, not enacted")}</text>`; return; }
    if (!r.effective_date) { g += `<line x1="${LBL}" y1="${y}" x2="${W - 14}" y2="${y}" stroke="var(--${col})" stroke-opacity=".45" stroke-width="4"/><text x="${LBL + 6}" y="${y - 5}" font-size="9.5" fill="var(--muted)">${te("in force, start date not stated")}</text>`; return; }
    const ed = NE.parseDate(r.effective_date);
    const ms = ed === null ? x0 : ed;
    g += `<line x1="${X(ms)}" y1="${y}" x2="${W - 14}" y2="${y}" stroke="var(--${col})" stroke-width="4" stroke-opacity=".85"/><circle cx="${X(ms)}" cy="${y}" r="5" fill="var(--${col})"/>`;
  });
  g += `<line x1="${X(asOf)}" y1="${top - 6}" x2="${X(asOf)}" y2="${H - 6}" stroke="var(--flag)" stroke-width="1.5"/><text x="${Math.min(X(asOf) + 4, W - 70)}" y="${H - 1}" font-size="10" fill="var(--flag)">${te("as of {date}", { date: S.date })}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${te("Timeline of when each rule takes effect")}">${g}</svg>`;
}
/* The build's self-check results (from data.js), grouped by section, inside a closed disclosure. "" when the build carried none. The check names are English log text. */
function selfcheckHtml() {
  const sc = (D.meta && D.meta.selfcheck) || {};
  if (!sc.checks || !sc.checks.length) return "";
  const groups = {};
  for (const c of sc.checks) (groups[c.section] = groups[c.section] || []).push(c);
  const sv = { pass: sc.pass, warn: sc.warn, fail: sc.fail };
  const chip = (st) => `<span class="chip r-${st === "PASS" ? "applies" : st === "WARN" ? "unknown" : "superseded"}" style="${st === "FAIL" ? "background:var(--flag-bg);color:var(--flag)" : ""}">${esc(t(st))}</span>`;
  return `<section class="block"><h3>${te("Self-check")}</h3>
    <p class="muted" style="margin:4px 0 10px">${sc.warn === 1 ? te("{pass} checks pass, {warn} warning, {fail} fail. They run on every build: schema, quotes found in sources, one answer per address, and the five change tests.", sv) : te("{pass} checks pass, {warn} warnings, {fail} fail. They run on every build: schema, quotes found in sources, one answer per address, and the five change tests.", sv)}</p>
    <details class="note"><summary style="cursor:pointer;font-weight:600;color:var(--accent)">${te("Show every check")}</summary>
    ${S.lang === "es" ? `<p class="lawnote">${te("The names of the checks are written in English.")}</p>` : ""}
    ${Object.entries(groups).map(([g, items]) => `<h4 style="margin:12px 0 4px"${LE()}>${esc(g.replace(/^\d+\.\s*/, ""))}</h4><ul style="list-style:none;padding:0;margin:0">${items.map((c) => `<li style="display:flex;gap:8px;align-items:baseline;margin:3px 0">${chip(c.status)}<span${LE()}>${esc(c.check)}</span></li>`).join("")}</ul>`).join("")}
    </details></section>`;
}
/* The rules and method tab: coverage matrix (where our sources had no rule), self-check, timeline, the searchable list of all rules, and how the system works. */
function renderRulesTab(v) {
  const jurs = JURS();
  const cnt = (j, c) => RULES.filter((r) => r.jurisdiction === j && r.category === c).length;
  const matrix = `<div class="tablewrap" data-label="${te("What the rule set covers")}"><table class="matrix"><thead><tr><th>${te("Jurisdiction")}</th>${CATS.map(([, l]) => `<th>${esc(t(l))}</th>`).join("")}</tr></thead><tbody>` +
    jurs.map((j) => `<tr><td><b>${esc(j)}</b></td>${CATS.map(([c]) => { const n = cnt(j, c); return `<td class="${n ? "" : "cell0"}">${n || te("none found")}</td>`; }).join("")}</tr>`).join("") + `</tbody></table></div>`;
  const q = (S.rq || "").toLowerCase();
  // In the Spanish view the search also matches the Spanish title and summary, so a person can search in Spanish.
  const hay = (r) => { const x = esRule(r); return `${r.title} ${r.citation} ${r.team_rule_id} ${r.requirement}${x ? ` ${x.title_es || ""} ${x.plain_es || ""}` : ""}`.toLowerCase(); };
  const list = RULES.filter((r) => (!S.rj || r.jurisdiction === S.rj) && (!S.rs || r.status === S.rs) && (!q || hay(r).includes(q)))
    .sort((a, b) => jurs.indexOf(a.jurisdiction) - jurs.indexOf(b.jurisdiction) || a.team_rule_id.localeCompare(b.team_rule_id));
  const statusPill = (s) => `<span class="chip r-${s === "in_force" ? "applies" : s === "not_yet_effective" ? "not_yet_effective" : s === "pending" ? "pending" : "unknown"}">${esc(t(s.replace(/_/g, " ")))}</span>`;
  const es = S.lang === "es";
  const rows = list.map((r) => {
    const x = esRule(r);
    return `<details class="rrow"><summary><span class="mono">${esc(r.team_rule_id)}</span><span><b>${esc(titleOf(r))}</b><div class="muted" style="font-size:12.5px">${esc(r.jurisdiction)} · ${esc(catName(r.category))}</div></span><span class="mono muted">${esc(r.citation)}</span><span>${statusPill(r.status)}</span></summary>
    <div class="body">${es ? `<p class="lawnote">${te("The law's own words, citations and links stay in English, because the English is the legal text.")}</p>` : ""}<dl class="dl">
      ${x && x.plain_es ? `<dt>${te("In plain language")}</dt><dd>${esc(x.plain_es)}${kvOf(r) ? ` <span class="kv">${esc(kvOf(r))}</span>` : ""}${ES_PACK.label ? `<p class="srcnote">${esc(ES_PACK.label)}</p>` : ""}</dd>` : ""}
      <dt>${te("What it requires")}</dt><dd${LE()}>${esc(r.requirement)}</dd>
      <dt>${te("Effective")}</dt><dd>${esc(fmtDate(r.effective_date))}</dd>
      ${r.overrides && r.overrides.length ? `<dt>${te("Yields to")}</dt><dd>${r.overrides.map((o) => esc(byRule[o] ? titleOf(byRule[o]) : o) + ` (${esc(o)})`).join("; ")}</dd>` : ""}
      ${r.conflict_flag ? `<dt>${te("Flag")}</dt><dd style="color:var(--flag)">${r.conflict_note ? EN_TAG() + `<span${LE()}>${esc(r.conflict_note)}</span>` : te("Flagged for human review.")}</dd>` : ""}
      <dt>${te("Exact words")}</dt><dd><blockquote class="q" lang="en">${esc(r.quoted_span)}</blockquote></dd>
      <dt>${te("Source")}</dt><dd><a href="${esc(r.source_url)}" target="_blank" rel="noopener">${esc(r.source_url)}</a></dd>
    </dl></div></details>`;
  }).join("");
  v.innerHTML = `<div class="section-head"><div class="eyebrow">${te("Audit")}</div><h2>${te("Rules and method")}</h2>
    <p class="lede">${te("Everything the lookup says comes from the {n} rules below. Each rule carries its citation, its source link and the exact words it was read from.", { n: RULES.length })}</p></div>
    <section><h3>${te("What the rule set covers")}</h3><p class="muted" style="margin:4px 0 10px">${te("Red cells are topics where our sources had no rule. They are shown, not hidden.")}</p>${matrix}</section>
    ${selfcheckHtml()}
    <section class="block"><h3>${te("When each rule starts")}</h3><p class="muted" style="margin:4px 0 10px">${te("Dates come from the sources. The red line is the date used on the other tabs.")}</p><div class="gantt" data-label="${te("When each rule starts")}">${ganttSvg()}</div></section>
    <section class="block"><h3>${te("All rules")}</h3>
      <div class="ctrl" style="margin-top:8px;border-top:0;padding-top:0">
        <label for="rq">${te("Search")}</label><input class="search" id="rq" type="search" style="max-width:260px" value="${esc(S.rq || "")}" placeholder="${te("Title, citation or text")}">
        <label for="rj">${te("Place")}</label><select id="rj"><option value="">${te("All")}</option>${jurs.map((j) => `<option ${S.rj === j ? "selected" : ""}>${esc(j)}</option>`).join("")}</select>
        <label for="rs">${te("Status")}</label><select id="rs"><option value="">${te("All")}</option>${["in_force", "not_yet_effective", "pending", "failed"].map((s) => `<option value="${s}" ${S.rs === s ? "selected" : ""}>${esc(t(s.replace(/_/g, " ")))}</option>`).join("")}</select>
      </div>
      <div class="tablewrap" id="rlist" data-label="${te("All rules")}" style="margin-top:8px">${rows || `<div class="empty">${te("No rule matches.")}</div>`}</div>
    </section>
    <section class="block"><h3>${te("How it works")}</h3><div class="twocol" style="margin-top:10px">
      <div class="note"><h3>${te("1. Read the law once")}</h3><ul>
        <li>${te("A language model reads each source page and writes one record per rule. The schema is fixed, so every record has a citation, a source link and a quote.")}</li>
        <li>${te("Code checks that every quote appears word for word in the page. A record that fails is thrown out.")}</li>
        <li>${te("Code, not the model, decides whether a rule is in force, not yet effective, pending or failed, from its dates.")}</li></ul></div>
      <div class="note"><h3>${te("2. Answer for any address")}</h3><ul>
        <li>${te("The Census geocoder places the address in a city. Then the lookup stacks state, county and city rules.")}</li>
        <li>${th("Each rule is checked against year built and unit count. A missing fact gives <b>unknown</b>, never a guess.")}</li>
        <li>${th("When a stricter local law governs, the state rule shows as <b>superseded</b> and links to the one that governs.")}</li></ul></div>
      <div class="note"><h3>${te("3. Track change")}</h3><ul>
        <li>${te("The same engine runs in this page for any date, so a change is just two answers side by side.")}</li>
        <li>${te("Where a law may displace another, as with the New Jersey FAIR Act and city bans, the rule is flagged for a person to review. We do not decide it.")}</li></ul></div>
      <div class="note"><h3>${te("Built to be safe to use")}</h3><ul>
        <li>${te("Every screen says this is not legal advice.")}</li>
        <li>${te("Gaps in the sources are shown as gaps.")}</li>
        <li>${te("Public sources and public parcel data only. No personal data, no cookies, no tracking. This page loads nothing from other sites.")}</li>
        <li>${te("Plain-English summaries are written by AI from the source text. The quoted words come from the source and are checked by code.")}</li>
        <li>${te("Adding a city means adding its pages and re-running. No code changes. The whole run costs a few dollars.")}</li></ul></div>
    </div></section>`;
  markScrollers();
}

/* ------------------------------------------------------------------ events */
/* All clicks. The clicked element (or an ancestor) names its action in data-act; that is the whole routing table. */
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "skip") { ev.preventDefault(); $("#view").focus(); }
  else if (act === "tab") { go(el.dataset.tab); $("#view").focus({ preventScroll: true }); }
  else if (act === "lang") setLang(el.dataset.lang);
  else if (act === "guide") { S.guide = true; S.tab = "lookup"; render(); syncHash(); window.scrollTo({ top: 0 }); }
  else if (act === "picker") setPicker(!S.pickerOpen);
  else if (act === "mode") {
    S.mode = el.dataset.mode; S.res = "all";
    if (S.mode === "own") { syncOwn(); S.addr = OWN_ID; S.wiOpen = true; } else S.addr = S.lastSample;
    renderLookup($("#view"));
    if (S.mode === "own" && window.innerWidth > 900) { const y = $("#wi-year"); if (y) y.focus({ preventScroll: true }); }
  }
  else if (act === "pick") { S.addr = el.dataset.id; S.lastSample = S.addr; setPicker(false); renderList(); renderAnswer(); if (window.innerWidth <= 900) $("#answer").scrollIntoView({ behavior: "smooth", block: "start" }); }
  else if (act === "city") { S.city = el.dataset.city; S.shown = 60; renderCityChips(); renderList(); }
  else if (act === "more") { S.shown += 60; renderList(); }
  else if (act === "resf") { S.res = el.dataset.res; renderBody(); }
  else if (act === "wiclear") { delete S.wi[S.addr]; for (const id of ["wi-year", "wi-units"]) { const n = $("#" + id); if (n) n.value = ""; } const o = $("#wi-owner"); if (o) o.value = ""; renderFacts(); renderBody(); }
  else if (act === "gocat") {
    if (S.res !== "all") { S.res = "all"; renderBody(); }
    const target = document.getElementById("cat-" + el.dataset.cat);
    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  else if (act === "setdate") { S.date = el.dataset.date; renderAnswer(); }
  else if (act === "jump") { S.addr = el.dataset.id; S.lastSample = S.addr; S.mode = "sample"; S.date = el.dataset.date || S.date; S.res = "all"; S.city = "all"; S.q = ""; S.guide = false; go("lookup"); }
  else if (act === "card") {
    // Scroll to the card and flash it. If a result filter hides it, clear the filter and look again.
    const card = document.getElementById("card-" + el.dataset.rule);
    if (card) { card.scrollIntoView({ behavior: "smooth", block: "center" }); card.classList.add("flash"); setTimeout(() => card.classList.remove("flash"), 1600); }
    else { S.res = "all"; renderAnswer(); const c2 = document.getElementById("card-" + el.dataset.rule); if (c2) c2.scrollIntoView({ block: "center" }); }
  }
  else if (act === "copyjson") copyJson();
  else if (act === "copylink") { syncHash(); copyText(location.href, t("Link to this answer copied.")); }
  else if (act === "print") window.print();
  else if (act === "cmp") { S.cmpA = el.dataset.a; S.cmpB = el.dataset.b; renderChanges($("#view")); }
  else if (act === "cmprow") { S.open = S.open === el.dataset.key ? null : el.dataset.key; renderChanges($("#view")); }
  else if (act === "theme") {
    const root = document.documentElement;
    root.dataset.theme = isDark() ? "light" : "dark";
    renderChrome();
  }
});
/* Text fields that filter as you type: the address search and the rules search. */
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.id === "q") { S.q = el.value; S.shown = 60; renderList(); }
  // The rules tab is redrawn whole on each keystroke, so the caret position is saved and put back, or typing would jump to the start.
  else if (el.id === "rq") { S.rq = el.value; const pos = el.selectionStart; renderRulesTab($("#view")); const n = $("#rq"); n.focus(); n.setSelectionRange(pos, pos); }
});
/* Date pickers, selects and the what-if fields. The what-if fields use "change" (when the field is left), not "input", so half-typed years such as "19" never flash an error. */
document.addEventListener("change", (ev) => {
  const el = ev.target;
  const ok = (d) => /^\d{4}-\d{2}-\d{2}$/.test(d) && NE.parseDate(d) !== null;
  if (el.id === "asof" && ok(el.value)) { S.date = el.value; renderAnswer(); }
  else if (el.id === "cmpA" && ok(el.value)) { S.cmpA = el.value; renderChanges($("#view")); }
  else if (el.id === "cmpB" && ok(el.value)) { S.cmpB = el.value; renderChanges($("#view")); }
  else if (el.id === "own-place") { S.ownPlace = el.value; syncOwn(); setPicker(false); renderAnswer(); }
  else if (el.id === "mapRule") { S.mapRule = el.value; renderMap($("#view")); }
  else if (el.id === "mapDate" && ok(el.value)) { S.date = el.value; renderMap($("#view")); }
  else if (el.id === "rj") { S.rj = el.value; renderRulesTab($("#view")); }
  else if (el.id === "rs") { S.rs = el.value; renderRulesTab($("#view")); }
  else if (el.id === "wi-year" || el.id === "wi-units" || el.id === "wi-owner") {
    const cur = S.wi[S.addr] || {};
    S.wi[S.addr] = { year: el.id === "wi-year" ? el.value : cur.year, units: el.id === "wi-units" ? el.value : cur.units, owner: el.id === "wi-owner" ? el.value : cur.owner };
    // Only the facts tiles and the answers below are redrawn, never the fields themselves (see renderAnswer).
    renderFacts(); renderBody();
  }
});
/* Remember whether the what-if box and the guide are open, so a redraw keeps them as the person left them. Capture phase: "toggle" does not bubble. */
document.addEventListener("toggle", (ev) => {
  if (!ev.target) return;
  if (ev.target.id === "wiBox") S.wiOpen = ev.target.open;
  else if (ev.target.id === "guide") S.guide = ev.target.open;
}, true);
window.addEventListener("resize", () => { setTopbar(); markScrollers(); });

/* ------------------------------------------------------------------ start */
readHash();      // 1. state from the URL (address, date, facts, tab, language)
applyLang();     // 2. document language and title
renderFoot();    // 3. footer (needs the language)
render();        // 4. the current view
})();
</script>
