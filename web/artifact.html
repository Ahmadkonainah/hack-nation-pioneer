cluding those operated solely for religious purposes; other exemptions are described only as secular and are not specified.","interaction":"The article notes supporters may try again on the 2028 ballot or via compromise legislation; no interaction with other laws is stated.","supporting_sources":[],"cov":{"scope":"undefined","conditions":[],"exemptions":[],"support":"own text","reasoning":"A failed ballot measure with no defined coverage."}},{"team_rule_id":"r-0016","jurisdiction":"MA","level":"state","category":"security_deposits","legal_state":"enacted","status":"in_force","title":"Massachusetts security deposit law","requirement":"A lessor may not require more than first month's rent, last month's rent, a security deposit equal to one month's rent, and the cost of a key and lock at or before the start of a tenancy. The deposit must be held in a separate interest-bearing Massachusetts bank account, accrue 5% annual interest (or the lesser bank rate) after one year, and be returned with itemized deductions within 30 days after the tenancy ends.","key_value":"Security deposit capped at one month's rent; return within 30 days","plain_en":"Landlords can ask for no more than first and last month's rent, a one-month deposit and a key and lock cost, and must return the deposit within 30 days.","citation":"G.L. c. 186 § 15B","effective_date":"2025-08-01","source_doc_id":"D052","source_url":"https://malegislature.gov/Laws/GeneralLaws/PartII/TitleI/Chapter186/Section15B","quoted_span":"(iii) a security deposit equal to the first month's rent provided that such security deposit is deposited as required by subsection (3) and that the tenant is given the statement of condition as required by subsection (2);","retrieved_at":"2026-10-01T22:37Z","confidence":0.82,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Applies to leases and tenancies of residential real property in Massachusetts.","exemptions":"Does not apply to a lease, rental, occupancy or tenancy of 100 days or less for vacation or recreational purposes.","interaction":"Lease provisions that conflict with the section, and tenant waivers of it, are void as against public policy. A fee in lieu of a deposit may be allowed only through regulations of the executive office of housing and livable communities, in consultation with the attorney general.","supporting_sources":[],"cov":{"scope":"universal","conditions":[],"exemptions":[{"label":"Vacation or recreational tenancy of 100 days or less","conditions":[{"fact":"tenancy","op":"is","value":"tenancy of 100 days or less for vacation or recreation","years_before_as_of":0,"text":"lease, rental, occupancy or tenancy of 100 days or less for vacation or recreational purposes"}]}],"support":"own text coverage_text and exemptions_text","reasoning":"Applies to residential leases in Massachusetts except short vacation stays."}},{"team_rule_id":"r-0017","jurisdiction":"MA","level":"state","category":"application_screening_fees","legal_state":"enacted","status":"in_force","title":"Massachusetts broker fee rule","requirement":"A licensed broker or salesperson may contract solely with the prospective tenant or solely with the landlord, not both. Any broker fee may only be paid by the party (lessor or tenant) who originally engaged and contracted with the broker.","key_value":"Fee paid only by the party who hired the broker","plain_en":"A rental broker can work for the tenant or the landlord but not both, and only the party who hired the broker pays the fee.","citation":"G.L. c. 112 § 87DDD1/2","effective_date":"2025-08-01","source_doc_id":"D057","source_url":"https://malegislature.gov/Laws/GeneralLaws/PartI/TitleXVI/Chapter112/Section87DDD%201~2","quoted_span":"Any fee shall only be paid by the party, lessor or tenant who originally engaged and entered into a contract with the licensed broker or salesperson.","retrieved_at":"2026-10-01T22:56Z","confidence":0.85,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Applies to any person engaged in finding rental dwelling accommodations for a fee in Massachusetts; the text states no limits by building age or size.","exemptions":null,"interaction":null,"supporting_sources":[],"cov":{"scope":"universal","conditions":[],"exemptions":[],"support":"own text coverage_text","reasoning":"Applies to anyone finding rentals for a fee in Massachusetts with no building limits."}},{"team_rule_id":"r-0018","jurisdiction":"MA","level":"state","category":"screening_restrictions","legal_state":"enacted","status":"in_force","title":"Massachusetts source-of-income discrimination ban","requirement":"It is an unlawful practice for any person furnishing rental accommodations to discriminate against an individual because the individual receives federal, state or local public assistance, or is a tenant receiving housing subsidies such as rental assistance or rental supplements, or because of any requirement of such programs.","key_value":"No discrimination against public assistance or housing subsidy recipients (including rental assistance)","plain_en":"Landlords cannot discriminate against tenants who receive public assistance or housing subsidies such as rental assistance.","citation":"G.L. c. 151B § 4(10)","effective_date":null,"source_doc_id":"D049","source_url":"https://malegislature.gov/Laws/GeneralLaws/PartI/TitleXXI/Chapter151B/Section4","quoted_span":"For any person furnishing credit, services or rental accommodations to discriminate against any individual who is a recipient of federal, state, or local public assistance, including medical assistance, or who is a tenant receiving federal, state, or local housing subsidies, including rental assistance or rental supplements,","retrieved_at":"2026-10-01T22:37Z","confidence":0.85,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Applies to any person furnishing rental accommodations, with no stated building-based limits in this subsection.","exemptions":null,"interaction":null,"supporting_sources":[],"cov":{"scope":"universal","conditions":[],"exemptions":[],"support":"own text coverage_text","reasoning":"Applies to any person furnishing rental accommodations with no stated limits."}},{"team_rule_id":"r-0019","jurisdiction":"MA","level":"state","category":"algorithmic_rent_setting","legal_state":"pending","status":"pending","title":"H.5222 algorithmic rent fixing bill","requirement":"Pending Massachusetts bill addressing algorithmic rent fixing (pricing algorithms in the rental housing market); its specific requirements are not stated on this page because the bill text is not included.","key_value":null,"plain_en":"A proposed bill on algorithmic rent fixing; its details are not stated and it is not law.","citation":"Mass. H.5222 (194th General Court)","effective_date":null,"source_doc_id":"D045","source_url":"https://malegislature.gov/Bills/194/H5222","quoted_span":"An Act relative to preventing algorithmic rent fixing in the rental housing market","retrieved_at":"2026-10-01T22:36Z","confidence":0.5,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Coverage is not stated because the bill text is not on the page.","exemptions":null,"interaction":null,"supporting_sources":[],"cov":{"scope":"undefined","conditions":[],"exemptions":[],"support":"own text","reasoning":"Pending bill whose text is not provided."}},{"team_rule_id":"r-0020","jurisdiction":"MA","level":"state","category":"algorithmic_rent_setting","legal_state":"pending","status":"pending","title":"S.2983 algorithmic rent setting bill","requirement":"Pending Massachusetts bill that, per its title, would prohibit algorithmic rent setting. The bill text is not on the page, so the specific prohibitions are unknown.","key_value":null,"plain_en":"A proposed bill that would ban algorithmic rent setting; it is not yet law.","citation":"Mass. Senate Bill S.2983 (194th General Court)","effective_date":null,"source_doc_id":"D046","source_url":"https://malegislature.gov/Bills/194/S2983","quoted_span":"An Act prohibiting algorithmic rent setting","retrieved_at":"2026-10-01T22:36Z","confidence":0.5,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Coverage cannot be determined because the bill text is not included on the page.","exemptions":null,"interaction":null,"supporting_sources":[],"cov":{"scope":"undefined","conditions":[],"exemptions":[],"support":"own text","reasoning":"Pending bill whose text is not provided."}},{"team_rule_id":"r-0021","jurisdiction":"Los Angeles, CA","level":"city","category":"rent_increase_limits","legal_state":"enacted","status":"in_force","title":"Los Angeles Rent Stabilization Ordinance rent increases","requirement":"Landlords of RSO units may raise rent only once every 12 months by the allowable percentage published by LAHD. Rent may be reset to market only in listed circumstances, such as the tenant voluntarily moving out or being evicted for cause.","key_value":"Once per 12 months, by the LAHD-published allowable percentage","plain_en":"Landlords of older Los Angeles rent-stabilized units can raise rent only once every 12 months, by the percentage the city publishes.","citation":"Los Angeles Rent Stabilization Ordinance (LAMC ch. XV, art. 1)","effective_date":"2025-07-01","source_doc_id":"D041","source_url":"https://housing.lacity.gov/residents/rso-overview","quoted_span":"Rent may be increased once every 12 months by the allowable rent increase percentage","retrieved_at":"2026-10-01T22:36Z","confidence":0.85,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Rental properties first built on or before October 1, 1978 (and replacement units under LAMC 151.28) of the listed types, such as apartments, duplexes, and two or more single-family units on one parcel.","exemptions":"Rent is not regulated for condominium and townhome tenancies that commenced after December 31, 1995; landlords may apply for a Luxury Exemption if they can establish the monthly rent charged on or before May 31, 1978.","interaction":"Landlords may seek additional increases through LAHD-approved programs (capital improvement, primary renovation, seismic retrofit, rehabilitation, just and reasonable). Properties not covered by the RSO remain subject to the Just Cause Ordinance.","supporting_sources":[{"doc_id":"D042","source_url":"https://housing.lacity.gov/rso-rent-increase-calculator","retrieved_at":"2026-10-01T22:36Z","quoted_span":"Annual rent increases for rental units subject to the City of Los Angeles Rent Stabilization Ordinance (RSO), effective\nJuly 1, 2025, through June 30, 2026\nis\n3%"}],"cov":{"scope":"conditional","conditions":[{"fact":"first_occupancy_date","op":"on_or_before","value":"1978-10-01","years_before_as_of":0,"text":"first built on or before October 1, 1978"}],"exemptions":[{"label":"Condominium or townhome tenancy commenced after 1995-12-31","conditions":[{"fact":"use_type","op":"is","value":"condominium or townhome","years_before_as_of":0,"text":"Condominium/Townhome rent not regulated for tenancies commenced after December 31, 1995"},{"fact":"tenancy","op":"is","value":"tenancy commenced after 1995-12-31","years_before_as_of":0,"text":"tenancies that commenced after December 31, 1995"}]}],"support":"own text coverage_text and exemptions_text","reasoning":"Covers buildings first built on or before 1978-10-01 except post-1995 condo or townhome tenancies."}},{"team_rule_id":"r-0022","jurisdiction":"Los Angeles, CA","level":"city","category":"just_cause_eviction","legal_state":"enacted","status":"in_force","title":"Los Angeles Just Cause for Eviction Ordinance","requirement":"Landlords may not terminate a covered tenancy without just cause. At-fault reasons include nonpayment, uncured lease violations, nuisance, and illegal use. No-fault reasons, such as owner or family move-in, demolition, or removal from the rental market, generally require relocation assistance to the tenant. Landlords may not evict for unpaid rent unless the amount owed exceeds the Fair Market Rent for the unit's bedroom size, and all eviction notices must be filed with LAHD within three business days of service.","key_value":"Relocation assistance for no-fault evictions; no eviction for rent owed below Fair Market Rent","plain_en":"In Los Angeles, landlords of units outside rent stabilization need a legal reason to evict and must pay relocation help for no-fault evictions.","citation":"Los Angeles Just Cause for Eviction Ordinance (JCO)","effective_date":null,"source_doc_id":"D040","source_url":"https://housing.lacity.gov/residents/just-cause-for-eviction-ordinance-jco","quoted_span":"It prohibits terminations of tenancies without just cause and requires relocation assistance for no-fault evictions.","retrieved_at":"2026-10-01T22:36Z","confidence":0.8,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Most residential rental properties in the City of Los Angeles that are not covered by the Rent Stabilization Ordinance (RSO), including buildings newer than October 1, 1978 and single-family dwellings, once the tenant has lived in the unit at least six months or the original lease has expired, whichever comes first.","exemptions":"Exceptions include transient hotels, licensed care facilities, fraternity or sorority houses, an owner's roommate, some cooperatives, some non-profit homeless or short-term substance-abuse treatment facilities, and some HACLA or government-owned properties. Units regulated by the RSO are covered by that ordinance instead.","interaction":"The JCO applies to units not regulated by the RSO and does not regulate rent increases; state law AB 1482 may separately regulate rent amounts in buildings older than 15 years.","supporting_sources":[],"cov":{"scope":"conditional","conditions":[{"fact":"rule_coverage","op":"is_not","value":"r-0021","years_before_as_of":0,"text":"not covered by the Rent Stabilization Ordinance"},{"fact":"tenancy","op":"is","value":"tenant lived there six months or original lease expired","years_before_as_of":0,"text":"lived in the unit at least six months or the original lease has expired"}],"exemptions":[{"label":"Transient hotels","conditions":[{"fact":"use_type","op":"is","value":"transient hotel","years_before_as_of":0,"text":"transient hotels"}]},{"label":"Licensed care facilities","conditions":[{"fact":"use_type","op":"is","value":"licensed care facility","years_before_as_of":0,"text":"licensed care facilities"}]},{"label":"Fraternity or sorority houses","conditions":[{"fact":"use_type","op":"is","value":"fraternity or sorority house","years_before_as_of":0,"text":"fraternity or sorority houses"}]},{"label":"Owner's roommate","conditions":[{"fact":"tenancy","op":"is","value":"owner's roommate","years_before_as_of":0,"text":"an owner's roommate"}]},{"label":"Cooperatives, certain non-profit facilities, HACLA or government-owned","conditions":[{"fact":"status_not_in_data","op":"is","value":"cooperative, certain non-profit facility, or HACLA/government-owned property","years_before_as_of":0,"text":"some cooperatives, non-profit facilities, and HACLA or government-owned properties"}]}],"support":"own text; r-0021 for RSO coverage","reasoning":"Covers rentals not covered by the RSO, once the tenant has met the six-month test, minus listed exemptions."}},{"team_rule_id":"r-0023","jurisdiction":"Los Angeles, CA","level":"city","category":"just_cause_eviction","legal_state":"enacted","status":"in_force","title":"Los Angeles RSO/JCO eviction and relocation assistance","requirement":"RSO tenants may be evicted only for listed at-fault reasons (e.g., nonpayment, nuisance, illegal use) or no-fault reasons (e.g., owner move-in, demolition, government order). No-fault evictions require a declaration filed with LAHD, 30- and 60-day written notices, and payment of tenant relocation assistance.","key_value":"No-fault evictions require relocation assistance and a filed Landlord Declaration of Intent to Evict","plain_en":"Landlords of Los Angeles rent-stabilized units can evict only for listed reasons, and no-fault evictions require filings with the city, notices and relocation payments.","citation":"L.A.M.C. § 151.09; L.A.M.C. §§ 165.03, 165.06","effective_date":"2026-07-01","source_doc_id":"D041","source_url":"https://housing.lacity.gov/residents/rso-overview","quoted_span":"No-fault evictions require the payment of","retrieved_at":"2026-10-01T22:36Z","confidence":0.8,"overrides":["r-0024"],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Rental units subject to the Los Angeles Rent Stabilization Ordinance (generally buildings first built on or before October 1, 1978).","exemptions":null,"interaction":"Notices to terminate a tenancy for RSO units must be filed with LAHD within three business days of service. Properties not covered by the RSO remain subject to the city's Just Cause Ordinance. Demolition for new construction is governed instead by the Resident Protections Ordinance.","supporting_sources":[{"doc_id":"D043","source_url":"https://housing.lacity.gov/wp-content/uploads/2026/08/Relocation-Assistance-Bulletins-A-and-B-Combined.pdf","retrieved_at":"2026-10-01T22:36Z","quoted_span":"All tenant not- at-fault evictions require payment of relocation assistance and the filing of a \nDeclaration of Intent to Evict form with the Los Angeles Housing Department (LAHD)"}],"cov":{"scope":"conditional","conditions":[{"fact":"first_occupancy_date","op":"on_or_before","value":"1978-10-01","years_before_as_of":0,"text":"generally buildings first built on or before October 1, 1978"}],"exemptions":[],"support":"own text coverage_text; r-0021 coverage text","reasoning":"Covers RSO units, i.e. buildings first built on or before 1978-10-01."}},{"team_rule_id":"r-0024","jurisdiction":"Los Angeles, CA","level":"city","category":"just_cause_eviction","legal_state":"enacted","status":"in_force","title":"Los Angeles Resident Protections Ordinance","requirement":"When a Protected Unit is demolished for new construction, the owner must pay relocation under State Housing Crisis Act or City law, whichever is higher, with enhanced standardized payments for lower-income households, plus rights to remain up to 6 months, return, and first refusal.","key_value":"Standardized payment (Chart B): $115,480 extremely low / $96,750 very low / $87,450 low income","plain_en":"When Los Angeles rent-stabilized or lower-income units are torn down for new construction, owners must pay higher relocation and give rights to return.","citation":"Los Angeles Ordinance Nos. 188481 and 188482 (Resident Protections Ordinance)","effective_date":"2025-02-11","source_doc_id":"D043","source_url":"https://housing.lacity.gov/wp-content/uploads/2026/08/Relocation-Assistance-Bulletins-A-and-B-Combined.pdf","quoted_span":"On February 11, 2025, the Los Angeles City Council adopted the RPO which codified and expanded upon \nreplacement requirements and occupant protections of the HCA,","retrieved_at":"2026-10-01T22:36Z","confidence":0.8,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Protected Units (including all RSO units and units recently rent-restricted or occupied by lower-income households) that will be demolished for new construction; enhanced payments apply to lower-income households.","exemptions":null,"interaction":"Codifies and expands the State Housing Crisis Act protections; owner must pay the highest applicable amount under State and City law. Above-low-income households receive RSO/JCO Chart A amounts. Codifies State Housing Crisis Act protections.","supporting_sources":[],"cov":{"scope":"conditional","conditions":[{"fact":"status_not_in_data","op":"is","value":"Protected Unit being demolished for new construction","years_before_as_of":0,"text":"Protected Units that will be demolished for new construction"}],"exemptions":[],"support":"own text coverage_text","reasoning":"Covers only protected units slated for demolition for new construction, a status the parcel data cannot show."}},{"team_rule_id":"r-0025","jurisdiction":"Los Angeles, CA","level":"city","category":"algorithmic_rent_setting","legal_state":"pending","status":"pending","title":"Los Angeles proposed algorithmic rent software report","requirement":"Council is asked to instruct the Los Angeles Housing Department to report on how many ownership and management entities use algorithm-based software to set rents and on the feasibility of banning such software in the City. No ban has been adopted by this motion.","key_value":null,"plain_en":"A pending City Council request for a report on rent-setting software and whether to ban it; no ban has been adopted.","citation":"Los Angeles City Council Motion (Hutt), Sept. 3, 2024","effective_date":null,"source_doc_id":"D039","source_url":"https://cityclerk.lacity.org/onlinedocs/2024/24-1031_misc_9-03-24.pdf","quoted_span":"I THEREFORE MOVE that the City Council instruct the Los Angeles Housing Department to \nreport on the number of ownership and management entities that are using algorithm-based \nsoftware to establish rents and the feasibility of instituting a ban on the use of this software to set \nrents in the City.","retrieved_at":"2026-10-01T22:36Z","confidence":0.5,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"No coverage is defined; the motion only requests a study of algorithm-based rent-setting software use in the City.","exemptions":null,"interaction":"The motion notes that San Francisco approved legislation in July 2024 banning algorithm-based rent-setting tools, but does not state how any Los Angeles measure would interact with other laws.","supporting_sources":[],"cov":{"scope":"undefined","conditions":[],"exemptions":[],"support":"own text","reasoning":"A motion requesting a study; no coverage defined."}},{"team_rule_id":"r-0026","jurisdiction":"San Francisco, CA","level":"city","category":"rent_increase_limits","legal_state":"enacted","status":"in_force","title":"San Francisco annual allowable rent increase","requirement":"For rent-controlled units, the annual allowable rent increase effective March 1, 2026 through February 28, 2027 is 1.6% of the tenant's base rent.","key_value":"1.6% annual allowable increase","plain_en":"Rent-controlled San Francisco units can raise rent by 1.6% of base rent from March 2026 to February 2027.","citation":"S.F. Admin. Code ch. 37","effective_date":"2026-03-01","source_doc_id":"D080","source_url":"https://www.sf.gov/news--annual-rent-increase-3126-22827-announced","quoted_span":"For rent-controlled units, the annual allowable increase amount effective March 1, 2026 through February 28, 2027 is 1.6%.","retrieved_at":"2026-10-01T22:37Z","confidence":0.8,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Applies to rent-controlled units in San Francisco; the page does not define which units qualify.","exemptions":null,"interaction":null,"supporting_sources":[{"doc_id":"D083","source_url":"https://www.sf.gov/reports--current-rates-including-rent-increase-relocation-sec-deposit","retrieved_at":"2026-10-01T22:37Z","quoted_span":"Allowable Rent Increase:\n1.6% for March 1, 2026 – February 28, 2027"}],"cov":{"scope":"conditional","conditions":[{"fact":"first_occupancy_date","op":"on_or_before","value":"1979-06-13","years_before_as_of":0,"text":"units first receiving a Certificate of Occupancy after June 13, 1979 (exempt from rent increase limits, per r-0027)"}],"exemptions":[],"support":"r-0027 coverage text (units first receiving a Certificate of Occupancy after June 13, 1979 are exempt from the Rent Ordinance's rent increase limits); own text applies to rent-controlled units","reasoning":"The rent increase cap covers rent-controlled units, and the sibling record sets the cut-off at first occupancy on or before June 13, 1979."}},{"team_rule_id":"r-0027","jurisdiction":"San Francisco, CA","level":"city","category":"just_cause_eviction","legal_state":"enacted","status":"in_force","title":"San Francisco Rent Ordinance just cause and relocation","requirement":"A landlord may evict a tenant from a unit covered by the Rent Ordinance only for one of 17 listed just cause reasons, which must be the dominant motive for the eviction. Expiration of a rental agreement or a change in ownership is not just cause.","key_value":"17 just cause reasons (Ordinance § 37.9(a))","plain_en":"San Francisco landlords can evict tenants in covered units only for one of 17 listed reasons, and ending a lease or selling the building is not enough.","citation":"S.F. Admin. Code ch. 37","effective_date":"2026-03-01","source_doc_id":"D079","source_url":"https://sf.gov/information/overview-just-cause-evictions","quoted_span":"In order to evict a tenant from a rental unit covered by the Rent Ordinance, a landlord must have a \"just cause\" reason that is the dominant motive for pursuing the eviction.","retrieved_at":"2026-10-01T22:37Z","confidence":0.8,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Rental units covered by the San Francisco Rent Ordinance, including some units exempt from the rent increase limits (such as units first receiving a Certificate of Occupancy after June 13, 1979, Costa-Hawkins-eligible tenancies, and some tenancies regulated by another agency).","exemptions":"The page does not list exemptions from the eviction provisions; it states that some tenancies exempt from the rent increase limits remain subject to just cause eviction rules.","interaction":"Tenancies exempt from the Ordinance's rent increase limits (post-June 13, 1979 construction, Costa-Hawkins-eligible tenancies, some government-regulated rents) are still subject to the just cause eviction provisions. Ellis Act withdrawals are recognized as one just cause reason.","supporting_sources":[{"doc_id":"D082","source_url":"https://www.sf.gov/reports--archive-relocation-rates","retrieved_at":"2026-10-01T22:37Z","quoted_span":"*The amount of relocation payments for temporary capital improvement evictions for less than 20 days is governed by California Civil Code Section 1947.9 and not by Rent Ordinance Section 37.9C."},{"doc_id":"D083","source_url":"https://www.sf.gov/reports--current-rates-including-rent-increase-relocation-sec-deposit","retrieved_at":"2026-10-01T22:37Z","quoted_span":"Relocation Payments for Evictions based on Owner/Relative Move-in OR Demolition/Permanent Removal of Unit from Housing Use OR Temporary Capital Improvement Work* OR Substantial Rehabilitation"}],"cov":{"scope":"universal","conditions":[],"exemptions":[],"support":"own coverage_text (covers units exempt from the rent increase limits as well as covered units)","reasoning":"The record says just cause covers Rent Ordinance units and also units exempt from the rent limits, so it reaches rentals generally."}},{"team_rule_id":"r-0028","jurisdiction":"San Francisco, CA","level":"city","category":"screening_restrictions","legal_state":"enacted","status":"in_force","title":"San Francisco Fair Chance Ordinance","requirement":"San Francisco's Fair Chance Ordinance protects residents with arrest or conviction history in affordable housing decisions. The page gives no further detail on specific limits or procedures.","key_value":null,"plain_en":"San Francisco protects residents with arrest or conviction history in affordable housing decisions.","citation":"San Francisco Fair Chance Ordinance","effective_date":null,"source_doc_id":"D078","source_url":"https://sf-hrc.org/fair-chance-ordinance","quoted_span":"San Francisco's Fair Chance Ordinance protects residents with arrest or conviction history in affordable housing decisions.","retrieved_at":"2026-10-01T22:37Z","confidence":0.5,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Per the page, applies to affordable housing decisions affecting residents with arrest or conviction history; no further coverage details are given.","exemptions":null,"interaction":null,"supporting_sources":[],"cov":{"scope":"conditional","conditions":[{"fact":"status_not_in_data","op":"is","value":"affordable housing","years_before_as_of":0,"text":"applies to affordable housing decisions"}],"exemptions":[],"support":"own text coverage_text","reasoning":"Applies only to affordable housing decisions, a status parcel data cannot show."}},{"team_rule_id":"r-0029","jurisdiction":"San Francisco, CA","level":"city","category":"algorithmic_rent_setting","legal_state":"enacted","status":"in_force","title":"San Francisco ban on algorithmic rent-setting devices","requirement":"It is unlawful to sell or use algorithmic devices, such as software that analyzes nonpublic competitor rental data to recommend what rent to charge for a vacant unit, to set rents or manage occupancy levels for residential units. A tenant or the City Attorney may bring a civil action over a violation.","key_value":"Ban on sale or use of algorithmic rent-setting devices","plain_en":"In San Francisco it is illegal to sell or use software that uses competitors' private data to set rents for residential units.","citation":"S.F. Admin. Code § 37.10C","effective_date":"2024-10-14","source_doc_id":"D081","source_url":"https://www.sf.gov/news/new-law-prohibits-algorithmic-devices-used-set-rents-san-francisco","quoted_span":"The law prohibits the sale or use of such algorithmic devices and allows a tenant or the City Attorney to bring a civil action if they believe an entity is in violation of the law.","retrieved_at":"2026-10-01T22:37Z","confidence":0.9,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Applies to the sale or use of algorithmic devices to set rents or manage occupancy levels for residential units in San Francisco.","exemptions":null,"interaction":null,"supporting_sources":[{"doc_id":"D002","source_url":"https://morganlewis.com/pubs/2026/08/algorithmic-rent-pricing-litigation-expands-under-new-state-and-local-laws","retrieved_at":"2026-10-03","quoted_span":"The ordinance prohibits landlords from using qualifying algorithmic devices that calculate nonpublic competitor information to advise on rent or occupancy."}],"cov":{"scope":"universal","conditions":[],"exemptions":[],"support":"own text coverage_text","reasoning":"Applies to the sale or use of algorithmic devices for residential units in San Francisco with no building test."}},{"team_rule_id":"r-0030","jurisdiction":"San Diego, CA","level":"city","category":"just_cause_eviction","legal_state":"enacted","status":"in_force","title":"San Diego Residential Tenant Protection Ordinance","requirement":"A landlord may not terminate a tenancy without just cause, either at-fault (e.g., nonpayment, material lease breach, nuisance) or no-fault (e.g., owner move-in, withdrawal from market, government order, demolition or substantial remodel). For no-fault terminations the landlord must pay relocation assistance of two months' rent (three months for seniors or disabled tenants) or waive an equal amount of rent, and give 30 or 60 days' written notice.","key_value":"No-fault relocation: 2 months' rent (3 months if tenant is senior or disabled)","plain_en":"San Diego landlords need a legal reason to end most tenancies and must pay two months' rent (three for seniors or disabled tenants) for no-fault evictions.","citation":"San Diego Municipal Code §§ 98.0701-98.0710","effective_date":"2023-06-24","source_doc_id":"D073","source_url":"https://docs.sandiego.gov/municode/municodechapter09/ch09art08division07.pdf","quoted_span":"A landlord shall not terminate a tenancy without just cause. For purposes of this \nDivision, just cause includes at-fault just cause and no-fault just cause.","retrieved_at":"2026-10-01T22:37Z","confidence":0.93,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Covers residential rental tenancies of more than 30 days in San Diego, except housing issued a certificate of occupancy within the previous 15 years and other listed exempt housing types.","exemptions":"Exempt: certificate of occupancy issued within the previous 15 years; owner-occupied single-family homes and owner-occupied duplexes; separately alienable property owned by a non-corporate landlord with written exemption notice; deed-restricted or subsidized affordable housing (not Section 8); hotels, short-term rentals, mobilehomes, institutional housing, dormitories, and shared-facility rentals with a resident landlord.","interaction":"The ordinance implements and is consistent with California Civil Code section 1946.2, and the rights it confers are in addition to existing state and federal rights. Relocation assistance paid under this Division is credited against any other relocation assistance required by federal, state, or other local law.","supporting_sources":[{"doc_id":"D077","source_url":"https://www.lassd.org/resource/city-of-san-diego-tenant-protection-ordinance/","retrieved_at":"2026-10-03","quoted_span":"The purpose of the Ordinance is to require Just Cause for termination of residential tenancies consistent with California Civil Code section 1946.2,"}],"cov":{"scope":"conditional","conditions":[{"fact":"tenancy","op":"is","value":"residential tenancy longer than 30 days","years_before_as_of":0,"text":"residential rental tenancies of more than 30 days"},{"fact":"first_occupancy_date","op":"on_or_before","value":"","years_before_as_of":15,"text":"except housing issued a certificate of occupancy within the previous 15 years"}],"exemptions":[{"label":"Owner-occupied single-family home","conditions":[{"fact":"units","op":"==","value":"1","years_before_as_of":0,"text":"single-family residence occupied by the landlord"},{"fact":"owner_occupied","op":"is","value":"true","years_before_as_of":0,"text":"occupied by the landlord as principal residence"}]},{"label":"Owner-occupied duplex","conditions":[{"fact":"units","op":"==","value":"2","years_before_as_of":0,"text":"two separate dwelling units within a single structure"},{"fact":"owner_occupied","op":"is","value":"true","years_before_as_of":0,"text":"landlord occupies one unit as principal residence"}]},{"label":"Separately alienable property with non-corporate landlord and exemption notice","conditions":[{"fact":"use_type","op":"is","value":"separately alienable home or condominium unit","years_before_as_of":0,"text":"alienable separate from the title to any other dwelling unit"},{"fact":"status_not_in_data","op":"is","value":"owner is not a REIT, corporation or LLC with a corporate member","years_before_as_of":0,"text":"landlord is not a REIT, corporation, LLC with a corporate member"},{"fact":"status_not_in_data","op":"is","value":"owner filed an exemption notice","years_before_as_of":0,"text":"written exemption notice in the lease"}]},{"label":"Deed-restricted or subsidized affordable housing","conditions":[{"fact":"status_not_in_data","op":"is","value":"deed-restricted or subsidized affordable housing","years_before_as_of":0,"text":"housing restricted by deed or subject to a housing subsidy agreement"}]},{"label":"Hotels, short-term rentals, institutional housing, dormitories, shared-facility resident landlord","conditions":[{"fact":"use_type","op":"is","value":"hotel, short-term rental, institutional housing, dormitory or shared-facility rental","years_before_as_of":0,"text":"hotels, short-term rentals, institutional housing, dormitories, shared-facility rentals with a resident landlord"}]},{"label":"Mobilehomes","conditions":[{"fact":"use_type","op":"is","value":"mobile home","years_before_as_of":0,"text":"mobilehomes"}]}],"support":"own text coverage_text, exemptions_text and coverage field","reasoning":"Covers tenancies over 30 days in buildings older than 15 years, minus the listed exemptions."}},{"team_rule_id":"r-0031","jurisdiction":"San Diego, CA","level":"city","category":"algorithmic_rent_setting","legal_state":"enacted","status":"in_force","title":"San Diego ban on algorithmic rent-setting devices","requirement":"It would be unlawful to sell, license or otherwise provide an algorithmic rent-setting device (software using nonpublic competitor data to recommend rents or occupancy levels) to a landlord, and unlawful for a landlord to use one to set rents or occupancy levels. Tenants may sue for injunctive relief, damages or civil penalties of up to $1,000 per violation, plus attorney's fees; each month and each property is a separate violation.","key_value":"Ban on sale/use of algorithmic rent-setting devices; up to $1,000 per violation","plain_en":"In San Diego, landlords cannot use software that uses competitors' private data to set rents, with tenant lawsuits and up to $1,000 per violation.","citation":"San Diego Municipal Code §§ 98.1101–98.1104","effective_date":"2025-06","source_doc_id":"D076","source_url":"https://sandiego.gov/sites/default/files/2025-04/automated-rent-price-fixing-prohibition-ordinance-materials.pdf","quoted_span":"It is unlawful for a landlord to use an algorithmic device to set rental rates\nor occupancy levels for residential rental property.","retrieved_at":"2026-10-01T22:37Z","confidence":0.85,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Applies to any person selling or providing algorithmic devices to landlords and to landlords setting rents or occupancy levels for residential rental property in the City of San Diego.","exemptions":"The definition of 'algorithmic device' excludes software that only publishes reports from aggregated historical nonpublic data more than 90 days old or from public information without recommending future rents, and software used to set rents or income limits under local, state or federal affordable housing program guidelines.","interaction":"Remedies are cumulative with other remedies in the Division or at law, statute or ordinance; the document names no preemption or yielding relationship.","supporting_sources":[{"doc_id":"D002","source_url":"https://morganlewis.com/pubs/2026/08/algorithmic-rent-pricing-litigation-expands-under-new-state-and-local-laws","retrieved_at":"2026-10-03","quoted_span":"San Diego similarly authorizes tenant suits for damages, injunctive relief and penalties of up to $1,000 per violation, with each month and affected rental property potentially constituting a separate violation."},{"doc_id":"D037","source_url":"https://www.morganlewis.com/pubs/2026/08/algorithmic-rent-pricing-litigation-expands-under-new-state-and-local-laws","retrieved_at":"2026-10-03","quoted_span":"San Diego similarly authorizes tenant suits for damages, injunctive relief and penalties of up to $1,000 per violation,"}],"cov":{"scope":"universal","conditions":[],"exemptions":[],"support":"own text coverage_text; the exemptions concern software types, not buildings","reasoning":"Applies to sellers and landlords for residential rental property in San Diego with no building test."}},{"team_rule_id":"r-0032","jurisdiction":"Berkeley, CA","level":"city","category":"rent_increase_limits","legal_state":"enacted","status":"in_force","title":"Berkeley rent stabilization and annual general adjustment","requirement":"Landlords of fully covered units may raise rent each year only by the Annual General Adjustment set by the Rent Board using a CPI-based formula, and Measure BB caps the AGA at 5% even if the formula yields more. Landlords with banked AGAs may still raise rent above 5% to reach the rent ceiling.","key_value":"CPI-based AGA, max 5%","plain_en":"Berkeley landlords of covered older units can raise rent each year only by the Rent Board's inflation-based adjustment, capped at 5%.","citation":"Berkeley Rent Stabilization Ordinance (Measure BB); Berkeley Municipal Code § 13.76.110(A)","effective_date":"2026-01-01","source_doc_id":"D006","source_url":"https://rentboard.berkeleyca.gov/laws-regulations/measure-bb-changes-berkeleys-rent-ordinance","quoted_span":"The maximum AGA is 5%. This means that, if the formula in the Rent Ordinance results in an AGA that is greater than 5%, the AGA approved by the Board for that year can be no more than 5%.","retrieved_at":"2026-10-01T22:35Z","confidence":0.8,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Fully covered units: most units in multifamily properties built before 1980, certain older single-family homes with pre-1996 tenancies, single-family homes with five or more rooms rented individually, and government-subsidized units that are fully covered; rent ceilings apply to these units.","exemptions":"Partially covered units (new construction with certificate of occupancy after 1980, most single-family homes and condominiums, and units whose subsidies are exempt from rent control under federal or state law) are not subject to the rent ceiling.","interaction":"The cap does not prevent landlords with banked AGAs from raising rent above 5% to reach the rent ceiling. Costa-Hawkins removes certain tenancies from the adjustment but no group for it exists.","supporting_sources":[{"doc_id":"D008","source_url":"https://rentboard.berkeleyca.gov/sites/default/files/documents/AGA%20Public%20Notice.pdf","retrieved_at":"2026-10-01T22:35Z","quoted_span":"will allow \neligible landlords to increase the 2025 permanent rent ceilings by 1.0% no earlier than \nJanuary 1, 2026."},{"doc_id":"D009","source_url":"https://rentboard.berkeleyca.gov/sites/default/files/documents/Rent%20Ordinance%20Coverage%20by%20Unit%20Type.pdf","retrieved_at":"2026-10-01T22:35Z","quoted_span":"Most units in multifamily properties built before 1980** Fully Covered Yes Yes Yes Yes"}],"cov":{"scope":"conditional","conditions":[{"fact":"first_occupancy_date","op":"before","value":"1980-01-01","years_before_as_of":0,"text":"most units in multifamily properties built before 1980"},{"fact":"units","op":">=","value":"2","years_before_as_of":0,"text":"multifamily properties"}],"exemptions":[],"support":"own text coverage_text; the partially covered list is a non-coverage list consistent with the conditions","reasoning":"Fully covered units are mainly multifamily buildings built before 1980."}},{"team_rule_id":"r-0033","jurisdiction":"Berkeley, CA","level":"city","category":"just_cause_eviction","legal_state":"enacted","status":"in_force","title":"Berkeley relocation assistance for owner move-in and Ellis Act evictions","requirement":"Owners must pay tenants relocation assistance when evicting for an owner move-in or to withdraw a unit from the rental market under the Ellis Act. The payment amounts are indexed to inflation and adjusted each year by the Rent Board.","key_value":"Standard payment $19,413; additional payment for qualifying households $6,471 (effective 2026-01-01; 1.5% CPI adjustment)","plain_en":"Berkeley owners must pay tenants relocation money when evicting for owner move-in or to take a unit off the rental market; amounts update each year.","citation":"Berkeley Rent Stabilization and Good Cause for Eviction Ordinance; Berkeley Ellis Implementation Ordinance","effective_date":"2026-01-01","source_doc_id":"D004","source_url":"https://rentboard.berkeleyca.gov/elected-rent-board/news/2026-adjustments-relocation-assistance-payments","quoted_span":"The Rent Stabilization and Good Cause for Eviction Ordinance requires owners to pay tenants relocation assistance in the event of an owner move-in eviction.","retrieved_at":"2026-10-01T22:35Z","confidence":0.8,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Tenants evicted for an owner move-in or for removal of the property from the rental market under the Ellis Act; the page does not state further coverage tests.","exemptions":null,"interaction":"The Ellis Implementation Ordinance requires the same relocation payments as the Rent Stabilization and Good Cause for Eviction Ordinance; both index the amounts to inflation. Ellis ordinance requires the same relocation payments as the Rent Stabilization Ordinance.","supporting_sources":[],"cov":{"scope":"conditional","conditions":[{"fact":"tenancy","op":"is","value":"evicted for owner move-in or Ellis Act withdrawal","years_before_as_of":0,"text":"Tenants evicted for an owner move-in or for removal under the Ellis Act"}],"exemptions":[],"support":"own text coverage_text","reasoning":"Covers only tenants evicted for owner move-in or Ellis Act withdrawal, a tenancy-level test."}},{"team_rule_id":"r-0034","jurisdiction":"Berkeley, CA","level":"city","category":"just_cause_eviction","legal_state":"enacted","status":"in_force","title":"Berkeley just cause for eviction","requirement":"Tenants in fully or partially covered units cannot be evicted without just cause. Measure BB bars eviction for rental debt under one month of Fair Market Rent or for refusing to sign a new fixed-term lease, requires lease-breach evictions to show substantial actual harm and unreasonable tenant behavior, and requires notices to be filed with the Rent Board within three business days.","key_value":"Nonpayment eviction only if debt >= one month's Fair Market Rent","plain_en":"Berkeley tenants in covered units can be evicted only for just cause, and owners cannot evict over small rental debts or for refusing a new fixed-term lease.","citation":"Berkeley Rent Stabilization Ordinance (as amended by Measure BB)","effective_date":null,"source_doc_id":"D006","source_url":"https://rentboard.berkeleyca.gov/laws-regulations/measure-bb-changes-berkeleys-rent-ordinance","quoted_span":"In Berkeley, tenants in units that are fully or partially covered by the Rent Ordinance cannot be evicted unless there is \"just cause” (previously called “good cause”).","retrieved_at":"2026-10-01T22:35Z","confidence":0.8,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Units that are fully or partially covered by the Rent Ordinance, including government-owned or -subsidized units now required to register.","exemptions":"Units exempt from the Rent Ordinance, such as shared kitchen/bath units where the landlord lived on the property before the tenant, are not covered.","interaction":null,"supporting_sources":[{"doc_id":"D009","source_url":"https://rentboard.berkeleyca.gov/sites/default/files/documents/Rent%20Ordinance%20Coverage%20by%20Unit%20Type.pdf","retrieved_at":"2026-10-01T22:35Z","quoted_span":"New construction: units that were built and received a Certificate of \nOccupancy after June 1980** \nPartially Covered Yes No Yes Yes"}],"cov":{"scope":"conditional","conditions":[{"fact":"first_occupancy_date","op":"before","value":"1980-01-01","years_before_as_of":0,"text":"fully covered units: most multifamily properties built before 1980"}],"exemptions":[],"support":"own coverage_text; r-0032 coverage text (fully covered units are older multifamily buildings; partially covered units are new construction after 1980, single-family homes and condominiums)","reasoning":"The rule covers fully and partially covered Rent Ordinance units, which together span older buildings and newer ones, so no building test limits it."}},{"team_rule_id":"r-0035","jurisdiction":"Berkeley, CA","level":"city","category":"security_deposits","legal_state":"enacted","status":"in_force","title":"Berkeley security deposit interest requirement","requirement":"For tenancies in units fully or partially covered by the Berkeley Rent Ordinance, landlords must pay tenants interest on the security deposit at the end of each year, and a prorated amount if the tenant moves out before year end.","key_value":"Annual interest on deposit, prorated on move-out","plain_en":"Berkeley landlords of covered units must pay tenants interest on security deposits each year, prorated if the tenant moves out early.","citation":"Berkeley Rent Stabilization Ordinance","effective_date":null,"source_doc_id":"D007","source_url":"https://rentboard.berkeleyca.gov/rights-responsibilities/security-deposits","quoted_span":"landlords must pay tenants interest on their security deposit at the end of each year and a prorated amount if the tenant moves out before the end of the year.","retrieved_at":"2026-10-01T22:35Z","confidence":0.8,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Applies to tenancies in units fully or partially covered by Berkeley's Rent Ordinance.","exemptions":null,"interaction":"Operates alongside the California state security deposit rules described on the same page. Operates alongside state deposit rules.","supporting_sources":[],"cov":{"scope":"conditional","conditions":[{"fact":"status_not_in_data","op":"is","value":"fully or partially covered by Berkeley Rent Ordinance","years_before_as_of":0,"text":"units fully or partially covered by Berkeley's Rent Ordinance"}],"exemptions":[],"support":"own text coverage_text","reasoning":"Covers units fully or partially covered by the Rent Ordinance, which is not fully testable from parcel data."}},{"team_rule_id":"r-0036","jurisdiction":"Berkeley, CA","level":"city","category":"application_screening_fees","legal_state":"enacted","status":"in_force","title":"Berkeley screening fee disclosure ordinance","requirement":"Owners charging a fee for a credit report or application processing must provide a clear tenant screening fee rights statement and the state maximum fee cap before receiving the fee. Owners may not charge existing tenants a non-refundable fee for renewing a tenancy or for adding, replacing, or removing a roommate.","key_value":"Disclosure of Cal. Civ. Code 1950.6(b) fee cap; no non-refundable renewal or roommate fees","plain_en":"Berkeley landlords must disclose tenant screening fee rights and the state fee cap, and cannot charge non-refundable renewal or roommate-change fees.","citation":"Berkeley Municipal Code ch. 13.78","effective_date":null,"source_doc_id":"D005","source_url":"https://rentboard.berkeleyca.gov/laws-regulations/city-berkeley-ordinances-affecting-rental-properties/tenant-screening-and","quoted_span":"An owner of residential rental property (or the owner’s agent) cannot charge a non-refundable fee to any existing tenant for the purpose of renewing a tenancy, in whole or in part,","retrieved_at":"2026-10-01T22:35Z","confidence":0.8,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Applies to all residential rental agreements in Berkeley regardless of contrary lease language.","exemptions":null,"interaction":"Incorporates the state screening fee cap under Cal. Civ. Code 1950.6(b); lease provisions violating the chapter are unenforceable. Incorporates the state fee cap; both apply, so it does not yield to the state law.","supporting_sources":[],"cov":{"scope":"universal","conditions":[],"exemptions":[],"support":"own text coverage_text","reasoning":"Applies to all residential rental agreements in Berkeley."}},{"team_rule_id":"r-0037","jurisdiction":"Berkeley, CA","level":"city","category":"screening_restrictions","legal_state":"enacted","status":"in_force","title":"Berkeley Fair Chance Access to Housing Ordinance","requirement":"Rental housing providers may not ask about or use criminal history in advertising, applications, tenant selection, or tenancy decisions, and must give written notice and an opportunity to respond before taking any action based on criminal history. Violations carry administrative fines of $1,000 to $10,000 per violation plus civil damages.","key_value":"Criminal history inquiries and use prohibited; fines $1,000-$10,000 per violation","plain_en":"Berkeley landlords cannot ask about or use criminal history in choosing or managing tenants, and must give written notice and a chance to respond first.","citation":"Berkeley Municipal Code ch. 13.106","effective_date":null,"source_doc_id":"D003","source_url":"https://rentboard.berkeleyca.gov/Fair_Chance","quoted_span":"The Fair Chance Access to Housing Ordinance prohibits rental housing providers in Berkeley from asking about and using criminal history and/or criminal background checks in their rental housing advertising, applications, tenant selection process, or decision-making.","retrieved_at":"2026-10-01T22:35Z","confidence":0.85,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Applies to rental housing providers in Berkeley with respect to current and prospective tenants, unless an exemption applies.","exemptions":"Exempt: lifetime sex offenders; limited exemptions for public housing/Section 8 properties; owner-occupied 1-3 unit properties where an owner lives in one unit; units under an owner move-back rental agreement (BMC 13.76.130 A.9); existing tenants subletting or adding/replacing roommates.","interaction":null,"supporting_sources":[],"cov":{"scope":"universal","conditions":[],"exemptions":[{"label":"Owner-occupied 1-3 unit property","conditions":[{"fact":"units","op":"<=","value":"3","years_before_as_of":0,"text":"between 1-3 units"},{"fact":"owner_occupied","op":"is","value":"true","years_before_as_of":0,"text":"an owner of record resides in one of the units"}]},{"label":"Lifetime sex offenders","conditions":[{"fact":"tenancy","op":"is","value":"lifetime sex offender","years_before_as_of":0,"text":"Lifetime sex offenders"}]},{"label":"Public housing or Section 8 (limited)","conditions":[{"fact":"status_not_in_data","op":"is","value":"public housing or Section 8 property","years_before_as_of":0,"text":"public housing/Section 8 properties"}]},{"label":"Owner move-back rental agreement","conditions":[{"fact":"tenancy","op":"is","value":"owner move-back rental agreement","years_before_as_of":0,"text":"units under a rental agreement allowing owners to move back"}]},{"label":"Existing tenant sublet or roommate change","conditions":[{"fact":"tenancy","op":"is","value":"existing tenant sublet or roommate change","years_before_as_of":0,"text":"existing tenants subletting or adding/replacing roommates"}]}],"support":"own text coverage_text and exemptions_text","reasoning":"Applies to rental housing providers in Berkeley, minus the listed exemptions."}},{"team_rule_id":"r-0038","jurisdiction":"Berkeley, CA","level":"city","category":"algorithmic_rent_setting","legal_state":"enacted","status":"in_force","title":"Berkeley ban on coordinated rent-pricing algorithms","requirement":"It is unlawful to sell, license, or provide to Berkeley landlords, or for a landlord to use, a coordinated pricing algorithm that uses non-public competitor data to set or recommend rents or occupancy levels for residential units. Each month and each unit constitutes a separate violation, with civil penalties up to $1,000 per violation plus attorney's fees.","key_value":"Ban on coordinated pricing algorithms; civil penalties up to $1,000 per violation","plain_en":"In Berkeley, landlords cannot use pricing software that relies on competitors' private data to set rents, with fines up to $1,000 per violation.","citation":"Berkeley Municipal Code ch. 13.63","effective_date":"2026-01","source_doc_id":"D001","source_url":"https://berkeleyca.gov/sites/default/files/documents/2025-12-02%20Item%2001%20Ordinance%207992.pdf","quoted_span":"It shall be unlawful for a landlord to use a coordinated pricing algorithm described \nin subsection A when setting rents or occupancy levels for residential dwelling units in \nthe City of Berkeley.","retrieved_at":"2026-10-01T22:44Z","confidence":0.85,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"All landlords of residential dwelling units in the City of Berkeley, and vendors who sell or license coordinated pricing algorithms to them.","exemptions":"The definition of coordinated pricing algorithm excludes aggregated anonymous rental data reports, products used to set affordable housing rent or income limits, and products used for market research for project financing, appraisals, or software research, testing, and training.","interaction":null,"supporting_sources":[{"doc_id":"D002","source_url":"https://morganlewis.com/pubs/2026/08/algorithmic-rent-pricing-litigation-expands-under-new-state-and-local-laws","retrieved_at":"2026-10-03","quoted_span":"Prohibits coordinated pricing algorithms; recurring unit/month violations and private remedies, previously at issue in RealPage, Inc. v. City of Berkeley et al., (N.D. Cal.) (voluntarily dismissed with prejudice Jan. 14, 2026)."},{"doc_id":"D037","source_url":"https://www.morganlewis.com/pubs/2026/08/algorithmic-rent-pricing-litigation-expands-under-new-state-and-local-laws","retrieved_at":"2026-10-03","quoted_span":"Prohibits coordinated pricing algorithms; recurring unit/month violations and private remedies,"}],"cov":{"scope":"universal","conditions":[],"exemptions":[],"support":"own text coverage_text; exclusions concern software types, not buildings","reasoning":"Applies to all landlords of residential units in Berkeley and the vendors selling to them."}},{"team_rule_id":"r-0039","jurisdiction":"Santa Ana, CA","level":"city","category":"rent_increase_limits","legal_state":"enacted","status":"in_force","title":"Santa Ana rent stabilization annual cap","requirement":"Residential rent increases are limited to the lower of 3% per year or 80% of the 12-month percent change in the CPI; if the CPI is negative, no increase is permitted. Owners may petition for a higher increase by showing it is needed for a fair and reasonable return.","key_value":"lower of 3% or 80% of CPI change per year; no increase if CPI negative","plain_en":"In Santa Ana, rent in older buildings can go up each year by the lower of 3% or 80% of inflation.","citation":"Santa Ana Rent Stabilization Ordinance","effective_date":"2021-11-19","source_doc_id":"D085","source_url":"https://santa-ana.gov/santa-ana-city-council-adopts-rent-stabilization-and-just-cause-eviction-ordinances-effective-nov-19","quoted_span":"Increase in residential rents are limited to the lower of 3% per year, or 80% of the percent change in the Consumer Price Index over the most recent 12-month period.","retrieved_at":"2026-10-01T22:37Z","confidence":0.9,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Residential rental buildings in Santa Ana constructed on or before February 1, 1995, plus mobile home spaces offered for rent on or before January 1, 1990.","exemptions":"Residential buildings constructed after February 1, 1995 and mobile home spaces offered for rent after January 1, 1990 are not subject to the cap.","interaction":null,"supporting_sources":[{"doc_id":"D084","source_url":"https://santa-ana.gov/departments/rent-stabilization","retrieved_at":"2026-10-01T22:37Z","quoted_span":"The increase cannot be more than 3% of your current rent or 80% of the Consumer Price Index (CPI) change, whichever is less."}],"cov":{"scope":"conditional","conditions":[{"fact":"first_occupancy_date","op":"on_or_before","value":"1995-02-01","years_before_as_of":0,"text":"residential rental buildings constructed on or before February 1, 1995"}],"exemptions":[],"support":"own text coverage_text and coverage field; mobile home spaces are not tested by building facts","reasoning":"Covers residential buildings built on or before 1995-02-01."}},{"team_rule_id":"r-0040","jurisdiction":"Santa Ana, CA","level":"city","category":"just_cause_eviction","legal_state":"enacted","status":"in_force","title":"Santa Ana just cause eviction","requirement":"After 30 days of tenancy, an owner may not terminate a tenancy without just cause stated in a written notice, and must first give notice and an opportunity to cure for at-fault causes. For no-fault terminations the owner must provide 3 months of relocation assistance or waive rent for the final 3 months.","key_value":"3 months relocation assistance or 3 months rent waiver for no-fault termination","plain_en":"In Santa Ana, after 30 days of tenancy, landlords need a stated just cause to end a tenancy and must give three months of relocation help for no-fault ends.","citation":"Santa Ana Just Cause Eviction Ordinance","effective_date":"2021-11-19","source_doc_id":"D085","source_url":"https://santa-ana.gov/santa-ana-city-council-adopts-rent-stabilization-and-just-cause-eviction-ordinances-effective-nov-19","quoted_span":"After 30 days, an owner shall not terminate a tenancy without just cause, which shall be stated in a written notice.","retrieved_at":"2026-10-01T22:37Z","confidence":0.9,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Residential rental properties in Santa Ana, except housing produced in the last 15 years and the other excluded property types.","exemptions":"Housing produced in the last 15 years; deed-restricted affordable housing; hotel and transient occupancy; hospital and care facilities; dormitories; and other shared living quarters.","interaction":null,"supporting_sources":[{"doc_id":"D084","source_url":"https://santa-ana.gov/departments/rent-stabilization","retrieved_at":"2026-10-01T22:37Z","quoted_span":"Your landlord must have a valid reason to evict you. This could be for not paying rent, breaking the lease, or if the landlord wants to move into the property themselves."}],"cov":{"scope":"universal","conditions":[],"exemptions":[{"label":"Housing produced in the last 15 years","conditions":[{"fact":"first_occupancy_date","op":"after","value":"","years_before_as_of":15,"text":"housing produced in the last 15 years"}]},{"label":"Deed-restricted affordable housing","conditions":[{"fact":"status_not_in_data","op":"is","value":"deed-restricted affordable housing","years_before_as_of":0,"text":"deed-restricted affordable housing"}]},{"label":"Hotel and transient occupancy","conditions":[{"fact":"use_type","op":"is","value":"hotel","years_before_as_of":0,"text":"hotel and transient occupancy"}]},{"label":"Hospital and care facilities","conditions":[{"fact":"use_type","op":"is","value":"hospital or care facility","years_before_as_of":0,"text":"hospital and care facilities"}]},{"label":"Dormitories and shared living quarters","conditions":[{"fact":"use_type","op":"is","value":"dormitory or shared living quarters","years_before_as_of":0,"text":"dormitories; and other shared living quarters"}]}],"support":"own text coverage_text and exemptions_text","reasoning":"Covers residential rentals in Santa Ana except the listed exempt types."}},{"team_rule_id":"r-0041","jurisdiction":"Santa Ana, CA","level":"city","category":"algorithmic_rent_setting","legal_state":"enacted","status":"in_force","title":"Santa Ana ban on algorithmic rent-setting","requirement":"Ordinance NS-3090 prohibits specified anticompetitive automated rent price-fixing, with private tenant claims and penalties up to $1,000 per violation and per month.","key_value":"Up to $1,000 per violation per month","plain_en":"Santa Ana bans anticompetitive automated rent price-fixing, with tenant lawsuits and penalties up to $1,000 per violation per month.","citation":"Santa Ana Ordinance No. NS-3090","effective_date":"2026-04-02","source_doc_id":"D002","source_url":"https://morganlewis.com/pubs/2026/08/algorithmic-rent-pricing-litigation-expands-under-new-state-and-local-laws","quoted_span":"Ordinance NS-3090 prohibits specified anticompetitive automated rent price-fixing; private tenant claims and up to $1,000 per violation and per month.","retrieved_at":"2026-10-03","confidence":0.75,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"The document does not state coverage limits; the ordinance applies to landlords using prohibited automated rent-setting in Santa Ana.","exemptions":null,"interaction":null,"supporting_sources":[{"doc_id":"D087","source_url":"https://www.publicceo.com/2026/02/santa-ana-city-council-continues-to-strengthen-tenant-protections-by-banning-anticompetitive-rent-setting-software/","retrieved_at":"2026-10-03","quoted_span":"prohibits the sale, licensing, provision and use of certain algorithmic rent-setting software for residential rental properties."},{"doc_id":"D086","source_url":"https://www.ocbj.com/real-estate/santa-ana-bans-landlords-from-using-ai-apartment-rent-pricing-software/","retrieved_at":"2026-10-03","quoted_span":"“The purpose and intent of this [ordinance] is to protect the residents of Santa Ana from artificially inflated rental rates and unfair rent increases by prohibiting the sale, licensing and use of Algorithmic Devices,”"}],"cov":{"scope":"universal","conditions":[],"exemptions":[],"support":"own text coverage_text","reasoning":"Applies to landlords using prohibited automated rent-setting in Santa Ana with no building test."}},{"team_rule_id":"r-0042","jurisdiction":"Jersey City, NJ","level":"city","category":"rent_increase_limits","legal_state":"enacted","status":"in_force","title":"Jersey City Rent Control Ordinance","requirement":"The city administers and enforces a rent control ordinance that regulates rent increases, with landlord applications for capital improvement, vacancy and hardship increases and tenant petitions for illegal rent. Properties with 1-4 units are exempt from rent control.","key_value":null,"plain_en":"Jersey City regulates rent increases in buildings with five or more units; buildings with one to four units are exempt.","citation":"Jersey City Municipal Code ch. 260","effective_date":null,"source_doc_id":"D036","source_url":"https://www.jerseycitynj.gov/landlordtenant","quoted_span":"The Office of Landlord Tenant Relations administers and enforces the\nRent Control Ordinance, Chapter 260\nof the Jersey City Municipal Code","retrieved_at":"2026-10-01T22:36Z","confidence":0.7,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Applies to rental properties in Jersey City with five or more units; all 1-4 unit properties are exempt, and other exemptions may be requested if criteria in the ordinance are met.","exemptions":"All 1-4 unit properties are exempt; the ordinance provides other permitted exemptions that an owner may request from the Office, but the page does not list them.","interaction":null,"supporting_sources":[],"cov":{"scope":"conditional","conditions":[{"fact":"units","op":">=","value":"5","years_before_as_of":0,"text":"rental properties in Jersey City with five or more units"}],"exemptions":[],"support":"own text coverage_text and exemptions_text; 1-4 unit properties are exempt","reasoning":"Covers properties with five or more units."}},{"team_rule_id":"r-0043","jurisdiction":"Jersey City, NJ","level":"city","category":"algorithmic_rent_setting","legal_state":"enacted","status":"in_force","title":"Jersey City ban on algorithmic rent coordination","requirement":"Jersey City prohibits a landlord's use of algorithmic rent coordination services, with public and private enforcement and fines up to $2,000 per day.","key_value":"Fines up to $2,000 per day","plain_en":"Jersey City bans landlords from using algorithmic rent coordination services, with fines up to $2,000 per day.","citation":"Jersey City Code § 218-12","effective_date":"2025-06","source_doc_id":"D002","source_url":"https://morganlewis.com/pubs/2026/08/algorithmic-rent-pricing-litigation-expands-under-new-state-and-local-laws","quoted_span":"Prohibits a landlord’s use of algorithmic rent coordination services; includes public and private enforcement; fines up to $2,000 per day.","retrieved_at":"2026-10-03","confidence":0.75,"overrides":[],"_conflicts_with":[],"conflict_flag":true,"conflict_note":"Possible conflict with P.L. 2026, c.43 (C.56:9-20 to 56:9-26) (r-0013); needs human review.","coverage_conditions":"The document does not state coverage limits; the ban applies to landlords using algorithmic rent coordination services in Jersey City.","exemptions":null,"interaction":null,"supporting_sources":[{"doc_id":"D035","source_url":"https://hudsoncountyview.com/jersey-city-council-approves-realpage-ban-and-increasing-benefits-for-laborers/","retrieved_at":"2026-10-03","quoted_span":"The Jersey City Council unanimously approved (9-0) a measure banning rent-setting algorithms such as RealPage,"}],"cov":{"scope":"universal","conditions":[],"exemptions":[],"support":"own text coverage_text","reasoning":"Applies to landlords using algorithmic rent coordination services in Jersey City with no building test."}},{"team_rule_id":"r-0044","jurisdiction":"Hoboken, NJ","level":"city","category":"rent_increase_limits","legal_state":"enacted","status":"in_force","title":"Hoboken rent control","requirement":"Rents in covered dwellings are controlled at the base rent received on October 1, 1985. At lease expiration or termination of a periodic tenancy, a landlord may not raise rent by more than the lesser of 5% or the CPI change. Only one cost-of-living increase is permitted in any twelve-month period, increases require 30 days' written notice, and increases beyond those allowed are void and refundable. Separate board-approved surcharges (taxes, water/sewer, capital improvements) and hardship increases are also available.","key_value":"Lesser of 5% or CPI change; one increase per 12 months","plain_en":"Hoboken rent control caps increases at the lesser of 5% or inflation, one increase per 12 months, with 30 days' written notice.","citation":"Hoboken City Code ch. 155","effective_date":"2023-02-01","source_doc_id":"D032","source_url":"https://ecode360.com/15252438","quoted_span":"no landlord may request or receive a percentage increase in rent which is greater than 5% or the percentage difference between the consumer price index three months prior to the expiration or termination of the lease and three months prior to the commencement of the lease term, whichever is less.","retrieved_at":"2026-10-03","confidence":0.9,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"All dwelling units (buildings or structures rented or offered for rent to one or more tenants) in Hoboken, other than the listed exemptions.","exemptions":"Exempt: motels/hotels; first rental of newly constructed dwellings; industrial and commercial property; school-controlled student housing; government-owned housing; buildings vacant since 1/1/1984 (first rental only); multiple dwellings built after 6/25/1987 for a limited period under N.J.S.A. 2A:42-84.1; units under preempting government-agency rent regulation during that period.","interaction":"Exemption for post-1987 multiple dwellings applies in accordance with N.J.S.A. 2A:42-84.1 et seq. The chapter is preempted while a governmental agency's rent regulation superseding the City's authority is in effect.","supporting_sources":[{"doc_id":"D032","source_url":"https://ecode360.com/15252438","retrieved_at":"2026-10-03","quoted_span":"said rental shall be limited to an increase of 25% over the last rental paid by the tenant who voluntarily vacated the rental unit, exclusive of any capital improvement surcharge that is a component of said last rental."},{"doc_id":"D033","source_url":"https://ecode360.com/15252470","retrieved_at":"2026-10-03","quoted_span":"no landlord may request or receive a percentage increase in rent which is greater than 5% or the percentage difference between the consumer price index three months prior to the expiration or termination of the lease and three months prior to the commencement of the lease term, whichever is less."}],"cov":{"scope":"universal","conditions":[],"exemptions":[{"label":"Motels and hotels","conditions":[{"fact":"use_type","op":"is","value":"motel or hotel","years_before_as_of":0,"text":"Motels and hotels"}]},{"label":"Newly constructed dwellings on first rental","conditions":[{"fact":"status_not_in_data","op":"is","value":"newly constructed dwelling on first rental","years_before_as_of":0,"text":"newly constructed dwellings rented for the first time"}]},{"label":"Industrial or commercial property","conditions":[{"fact":"use_type","op":"is","value":"industrial or commercial","years_before_as_of":0,"text":"industrial and commercial property"}]},{"label":"School-controlled student housing","conditions":[{"fact":"use_type","op":"is","value":"student housing owned or controlled by a school","years_before_as_of":0,"text":"housing provided for students by a school that owns or controls it"}]},{"label":"Government-owned housing","conditions":[{"fact":"status_not_in_data","op":"is","value":"government-owned housing","years_before_as_of":0,"text":"housing owned and operated by government agencies"}]},{"label":"Building vacant since 1984 (first rental only)","conditions":[{"fact":"status_not_in_data","op":"is","value":"building vacant since January 1, 1984, first rental only","years_before_as_of":0,"text":"building completely vacant on or before and since January 1, 1984"}]},{"label":"Multiple dwellings built after June 25, 1987","conditions":[{"fact":"first_occupancy_date","op":"after","value":"1987-06-25","years_before_as_of":0,"text":"multiple dwellings constructed after June 25, 1987"},{"fact":"units","op":">=","value":"3","years_before_as_of":0,"text":"multiple dwellings"}]},{"label":"Housing under preempting government rent regulation","conditions":[{"fact":"status_not_in_data","op":"is","value":"preempting government agency rent regulation","years_before_as_of":0,"text":"landlord contract with a governmental agency that regulates rent"}]}],"support":"own text coverage_text and exemptions_text; the post-1987 exemption is limited in time and the 3+ units for 'multiple dwelling' is an assumption from the term","reasoning":"Covers all Hoboken dwelling units other than the listed exemptions."}},{"team_rule_id":"r-0045","jurisdiction":"Hoboken, NJ","level":"city","category":"rent_increase_limits","legal_state":"enacted","status":"in_force","title":"Hoboken large rent increase disclosures","requirement":"Residential landlords seeking to raise rent by more than 10% year over year on renewal must give the tenant an itemization of costs, a statement on whether a rent algorithm was used, notice of the right to take legal action, and Division of Housing contact information. Failure to disclose is punishable by a fine of up to $1,000 per incident.","key_value":"Disclosures required for increases >10%; fine up to $1,000 per incident","plain_en":"Hoboken landlords raising rent more than 10% on a renewal must give an itemized cost list, say whether a rent algorithm was used, and give tenant rights information.","citation":"Hoboken City Code § 158-1 (Ord. No. B-750)","effective_date":null,"source_doc_id":"D034","source_url":"https://ecode360.com/46833413","quoted_span":"All residential landlords seeking to increase rent by more than 10% upon a renewal of a lease with a current tenant year over year shall be required to make the following disclosures","retrieved_at":"2026-10-03","confidence":0.8,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":"The ordinance is a disclosure requirement, not a cap on rent increases; categorized under rent_increase_limits as the closest in-scope category.","coverage_conditions":"All residential landlords in Hoboken who raise rent by more than 10% year over year on renewal of a lease with a current tenant.","exemptions":null,"interaction":null,"supporting_sources":[],"cov":{"scope":"conditional","conditions":[{"fact":"tenancy","op":"is","value":"rent increase over 10% on renewal with a current tenant","years_before_as_of":0,"text":"raise rent by more than 10% upon a renewal of a lease with a current tenant"}],"exemptions":[],"support":"own text coverage_text","reasoning":"Applies only to renewal increases over 10%, a tenancy-level test."}},{"team_rule_id":"r-0046","jurisdiction":"Hoboken, NJ","level":"city","category":"algorithmic_rent_setting","legal_state":"enacted","status":"in_force","title":"Hoboken prohibition on algorithmic rent fixing","requirement":"Landlords of residential units in Hoboken may not use software, algorithms or data-sharing platforms to collect and analyze nonpublic competitor information in order to coordinate, recommend or implement rents, lease terms or occupancy levels among competing lessors. Violations are enforced in Municipal Court by the Division of Housing or an aggrieved private citizen, with penalties of up to a $2,000 fine and/or up to 90 days community service, or penalties under N.J.S.A. 40:49-5.","key_value":"Ban on algorithmic pricing using nonpublic competitor data; fine up to $2,000 or up to 90 days community service","plain_en":"Hoboken landlords cannot use software that analyzes competitors' private data to coordinate rents; violations can bring up to $2,000 in fines or community service.","citation":"Hoboken City Code § 158-2 (Ord. No. B-781)","effective_date":"2025-07","source_doc_id":"D034","source_url":"https://ecode360.com/46833413","quoted_span":"Landlords who rent any residential dwelling unit (defined as any primary residence excluding medical/long-term care or detention facilities) in the City of Hoboken are prohibited from price fixing using algorithmic pricing.","retrieved_at":"2026-10-03","confidence":0.9,"overrides":[],"_conflicts_with":[],"conflict_flag":true,"conflict_note":"Possible conflict with P.L. 2026, c.43 (C.56:9-20 to 56:9-26) (r-0013); needs human review.","coverage_conditions":"All landlords renting a residential dwelling unit (any primary residence) in Hoboken.","exemptions":"Medical/long-term care facilities and detention facilities are excluded from the definition of residential dwelling unit.","interaction":"Penalties may be imposed as prescribed under N.J.S.A. 40:49-5.","supporting_sources":[{"doc_id":"D002","source_url":"https://morganlewis.com/pubs/2026/08/algorithmic-rent-pricing-litigation-expands-under-new-state-and-local-laws","retrieved_at":"2026-10-03","quoted_span":"Prohibits landlords from using software, algorithms or data-sharing platforms to coordinate or recommend rents, lease terms, or occupancy."}],"cov":{"scope":"universal","conditions":[],"exemptions":[{"label":"Medical, long-term care or detention facilities","conditions":[{"fact":"use_type","op":"is","value":"medical, long-term care or detention facility","years_before_as_of":0,"text":"excluding medical/long-term care or detention facilities"}]}],"support":"own text coverage_text and exemptions_text","reasoning":"Applies to all landlords of residential units in Hoboken except care and detention facilities."}},{"team_rule_id":"r-0047","jurisdiction":"Newark, NJ","level":"city","category":"rent_increase_limits","legal_state":"enacted","status":"in_force","title":"Newark Rent Control Ordinance","requirement":"At lease expiration or termination of a periodic tenancy, a landlord may not request or receive an increase greater than the CPI percentage change (CPI-U NY-NJ-Long Island, from 15 months prior to 3 months prior to the month of the proposed increase), and in no case more than 4%. Increases are barred if the dwelling is not in substantial compliance or the landlord has not registered, and require 30 days' written notice to the tenant and the Rent Regulation Officer.","key_value":"CPI-U change, max 4%","plain_en":"Newark rent increases at lease renewal are limited to the inflation change and never more than 4%, with 30 days' written notice.","citation":"Newark Rev. Gen. Ords. ch. 19:2","effective_date":"1985-09-04","source_doc_id":"D070","source_url":"https://ecode360.com/36623772","quoted_span":"no landlord may request or receive an increase greater than the percentage increase in the Consumer Pr
