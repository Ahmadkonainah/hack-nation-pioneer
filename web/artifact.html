/* ------------------------------------------------------------------ map */
/* The rule whose answers differ most across the sample addresses on a date (most distinct results, then most addresses). Fallback when r-0001 is absent. */
function varied(date) {
  const all = allAt(date);
  let best = null, bestScore = -1;
  for (const r of RULES) {
    const seen = new Set(); let n = 0;
    for (const a of ADDR) { const e = all[a.id].find((x) => x.team_rule_id === r.team_rule_id); if (e) { seen.add(e.result); n++; } }
    const score = seen.size * 1000 + n;
    if (score > bestScore) { bestScore = score; best = r.team_rule_id; }
  }
  return best;
}
/* The coverage map tab: one small scatter per city for the chosen rule and date, each dot colored by its answer. Scale is per city, not shared, and the page says so. */
function renderMap(v) {
  if (!S.mapRule || !byRule[S.mapRule]) S.mapRule = byRule["r-0001"] ? "r-0001" : varied(S.date);
  const r = byRule[S.mapRule];
  const all = allAt(S.date);
  const opts = RULES.slice().sort((x, y) => x.jurisdiction.localeCompare(y.jurisdiction) || x.team_rule_id.localeCompare(y.team_rule_id))
    .map((x) => `<option value="${x.team_rule_id}" ${x.team_rule_id === S.mapRule ? "selected" : ""}>${esc(x.jurisdiction)} · ${esc(titleOf(x))} (${x.team_rule_id})</option>`).join("");
  // A statewide rule is in scope for every address in the state; a city rule only for addresses the geocoder placed in that city.
  const inScope = (a) => r.level === "state" ? a.state === r.jurisdiction : a.city === r.jurisdiction;
  const groups = {};
  let missingGeo = 0;
  for (const a of ADDR) {
    if (!inScope(a)) continue;
    if (a.lat == null) { missingGeo++; continue; }
    (groups[cityOf(a)] = groups[cityOf(a)] || []).push(a);
  }
  const tally = Object.fromEntries(RES_ORDER.concat(["none"]).map((k) => [k, 0]));
  const panels = Object.keys(groups).sort().map((city) => {
    const pts = groups[city];
    // Equirectangular projection around the city's mean latitude, then fit the points into the 320 x 220 box.
    const lat0 = pts.reduce((s, p) => s + p.lat, 0) / pts.length;
    const kx = Math.cos(lat0 * Math.PI / 180);
    const xs = pts.map((p) => p.lon * kx), ys = pts.map((p) => -p.lat);
    const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
    const W = 320, H = 220, pad = 16;
    const span = Math.max(maxx - minx, maxy - miny, 1e-6);
    const sc = Math.min((W - 2 * pad) / span, (H - 2 * pad) / span);
    const ox = (W - sc * (maxx - minx)) / 2, oy = (H - sc * (maxy - miny)) / 2;
    const counts = Object.fromEntries(RES_ORDER.concat(["none"]).map((k) => [k, 0]));
    const dots = pts.map((p, i) => {
      const e = all[p.id].find((x) => x.team_rule_id === r.team_rule_id);
      const k = e ? e.result : "none";
      counts[k]++; tally[k]++;
      return `<circle cx="${(ox + sc * (xs[i] - minx)).toFixed(1)}" cy="${(oy + sc * (ys[i] - miny)).toFixed(1)}" r="4.6" style="fill:var(--${k})" data-act="jump" data-id="${p.id}" data-date="${esc(S.date)}"><title>${esc(p.street)}: ${esc(k === "none" ? t("rule not listed here") : resLabel(k))}</title></circle>`;
    }).join("");
    // The per-panel count line is the text equivalent of the colors: the map never carries meaning by color alone.
    const line = RES_ORDER.concat(["none"]).filter((k) => counts[k]).map((k) => `${counts[k]} ${k === "none" ? t("not listed") : resLabel(k).toLowerCase()}`).join(", ");
    return `<div class="mapcard"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(cityShort(city))}</b><span class="muted" style="font-size:12.5px">${te("{n} addresses", { n: pts.length })}</span></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${te("Addresses in {city} colored by answer", { city })}">${dots}</svg>
      <div class="muted" style="font-size:12.5px;margin-top:6px">${esc(line)}</div></div>`;
  }).join("");
  v.innerHTML = `<div class="section-head"><div class="eyebrow">${te("Coverage map")}</div><h2>${te("Where does one rule apply?")}</h2>
    <p class="lede">${te("Each dot is a sample address, placed by its Census coordinates. Color shows the answer for the rule you pick, on the date you pick. Select a dot to open that address.")}</p></div>
    <div class="ctrl" style="margin-top:0;border-top:0;padding-top:0">
      <label for="mapRule">${te("Rule")}</label><select id="mapRule">${opts}</select>
      <label for="mapDate">${te("As of")}</label><input type="date" id="mapDate" value="${esc(S.date)}">
    </div>
    <div class="legend">${RES_ORDER.map((k) => `<span><i class="dot" style="background:var(--${k})"></i>${esc(resLabel(k))} (${tally[k]})</span>`).join("")}<span><i class="dot" style="background:var(--none)"></i>${te("Rule not listed here ({n})", { n: tally.none })}</span></div>
    <div class="mapgrid">${panels || `<div class="note">${te("No geocoded address is in scope for this rule.")}</div>`}</div>
    <p class="muted" style="font-size:13px;margin-top:10px">${missingGeo ? esc(tn(missingGeo, "{n} address is not shown because the geocoder could not place them.", "{n} addresses are not shown because the geocoder could not place them.")) + " " : ""}${te("Panels are drawn to scale inside each city, not to a shared map.")}</p>`;
}

/* ------------------------------------------------------------------ rules + method */
/* The places that have rules, in display order: each state, then its cities. Used by the own-building picker, the coverage matrix and the rules filter. */
const JURS = () => {
  const order = ["CA", "NJ", "MA"];
  const cities = [...new Set(ADDR.map((a) => a.city).filter(Boolean).concat(RULES.map((r) => r.jurisdiction).filter((j) => /, [A-Z]{2}$/.test(j))))];
  const out = [];
  for (const st of order) { out.push(st); for (const c of cities.filter((c) => c.endsWith(", " + st)).sort()) out.push(c); }
  return out;
};
/* Timeline (SVG) of when each rule takes effect, 2020 to 2028, with a red line at the as-of date. Drawn by hand: no chart library, no request. */
function ganttSvg() {
  const x0 = new Date("2020-01-01T00:00:00Z").getTime(), x1 = new Date("2028-12-31T00:00:00Z").getTime();
  const LBL = 300, W = 900, rowH = 18, top = 26;
  const rules = RULES.slice().sort((a, b) => JURS().indexOf(a.jurisdiction) - JURS().indexOf(b.jurisdiction) || a.team_rule_id.localeCompare(b.team_rule_id));
  const H = top + rules.length * rowH + 10;
  const X = (ms) => LBL + ((Math.min(Math.max(ms, x0), x1) - x0) / (x1 - x0)) * (W - LBL - 14);
  const asOf = new Date(S.date + "T00:00:00Z").getTime();
  let g = "";
  for (let y = 2020; y <= 2028; y++) {
    const x = X(new Date(`${y}-01-01T00:00:00Z`).getTime());
    g += `<line x1="${x}" y1="${top - 6}" x2="${x}" y2="${H - 6}" stroke="var(--line)"/><text x="${x + 3}" y="${top - 10}" font-size="10.5" fill="var(--muted)">${y}</text>`;
  }
  rules.forEach((r, i) => {
    const y = top + i * rowH + rowH / 2;
    const label = `${r.team_rule_id} ${r.jurisdiction.replace(/, [A-Z]{2}$/, "")}: ${titleOf(r)}`;
    g += `<text x="4" y="${y + 3.5}" font-size="10.5" fill="var(--ink)">${esc(label.length > 54 ? label.slice(0, 53) + "…" : label)}</text>`;
    const col = r.status === "in_force" ? "applies" : r.status === "not_yet_effective" ? "not_yet_effective" : r.status === "pending" ? "pending" : "unknown";
    if (r.status === "failed") { g += `<text x="${LBL}" y="${y + 3.5}" font-size="10.5" fill="var(--muted)">${te("failed, never law")}</text>`; return; }
    if (r.status === "pending") { g += `<line x1="${LBL}" y1="${y}" x2="${W - 14}" y2="${y}" stroke="var(--pending)" stroke-dasharray="3 4"/><text x="${LBL + 6}" y="${y - 4}" font-size="9.5" fill="var(--muted)">${te("bill, not enacted")}</text>`; return; }
    if (!r.effective_date) { g += `<line x1="${LBL}" y1="${y}" x2="${W - 14}" y2="${y}" stroke="var(--${col})" stroke-opacity=".45" stroke-width="4"/><text x="${LBL + 6}" y="${y - 5}" font-size="9.5" fill="var(--muted)">${te("in force, start date not stated")}</text>`; return; }
    const ed = NE.parseDate(r.effective_date);
    const ms = ed === null ? x0 : ed;
    g += `<line x1="${X(ms)}" y1="${y}" x2="${W - 14}" y2="${y}" stroke="var(--${col})" stroke-width="4" stroke-opacity=".85"/><circle cx="${X(ms)}" cy="${y}" r="5" fill="var(--${col})"/>`;
  });
  g += `<line x1="${X(asOf)}" y1="${top - 6}" x2="${X(asOf)}" y2="${H - 6}" stroke="var(--flag)" stroke-width="1.5"/><text x="${Math.min(X(asOf) + 4, W - 70)}" y="${H - 1}" font-size="10" fill="var(--flag)">${te("as of {date}", { date: S.date })}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${te("Timeline of when each rule takes effect")}">${g}</svg>`;
}
/* The build's self-check results (from data.js), grouped by section, inside a closed disclosure. "" when the build carried none. The check names are English log text. */
function selfcheckHtml() {
  const sc = (D.meta && D.meta.selfcheck) || {};
  if (!sc.checks || !sc.checks.length) return "";
  const groups = {};
  for (const c of sc.checks) (groups[c.section] = groups[c.section] || []).push(c);
  const sv = { pass: sc.pass, warn: sc.warn, fail: sc.fail };
  const chip = (st) => `<span class="chip r-${st === "PASS" ? "applies" : st === "WARN" ? "unknown" : "superseded"}" style="${st === "FAIL" ? "background:var(--flag-bg);color:var(--flag)" : ""}">${esc(t(st))}</span>`;
  return `<section class="block"><h3>${te("Self-check")}</h3>
    <p class="muted" style="margin:4px 0 10px">${sc.warn === 1 ? te("{pass} checks pass, {warn} warning, {fail} fail. They run on every build: schema, quotes found in sources, one answer per address, and the five change tests.", sv) : te("{pass} checks pass, {warn} warnings, {fail} fail. They run on every build: schema, quotes found in sources, one answer per address, and the five change tests.", sv)}</p>
    <details class="note"><summary style="cursor:pointer;font-weight:600;color:var(--accent)">${te("Show every check")}</summary>
    ${S.lang === "es" ? `<p class="lawnote">${te("The names of the checks are written in English.")}</p>` : ""}
    ${Object.entries(groups).map(([g, items]) => `<h4 style="margin:12px 0 4px"${LE()}>${esc(g.replace(/^\d+\.\s*/, ""))}</h4><ul style="list-style:none;padding:0;margin:0">${items.map((c) => `<li style="display:flex;gap:8px;align-items:baseline;margin:3px 0">${chip(c.status)}<span${LE()}>${esc(c.check)}</span></li>`).join("")}</ul>`).join("")}
    </details></section>`;
}
/* The rules and method tab: coverage matrix (where our sources had no rule), self-check, timeline, the searchable list of all rules, and how the system works. */
function renderRulesTab(v) {
  const jurs = JURS();
  const cnt = (j, c) => RULES.filter((r) => r.jurisdiction === j && r.category === c).length;
  const matrix = `<div class="tablewrap" data-label="${te("What the rule set covers")}"><table class="matrix"><thead><tr><th>${te("Jurisdiction")}</th>${CATS.map(([, l]) => `<th>${esc(t(l))}</th>`).join("")}</tr></thead><tbody>` +
    jurs.map((j) => `<tr><td><b>${esc(j)}</b></td>${CATS.map(([c]) => { const n = cnt(j, c); return `<td class="${n ? "" : "cell0"}">${n || te("none found")}</td>`; }).join("")}</tr>`).join("") + `</tbody></table></div>`;
  const q = (S.rq || "").toLowerCase();
  // In the Spanish view the search also matches the Spanish title and summary, so a person can search in Spanish.
  const hay = (r) => { const x = esRule(r); return `${r.title} ${r.citation} ${r.team_rule_id} ${r.requirement}${x ? ` ${x.title_es || ""} ${x.plain_es || ""}` : ""}`.toLowerCase(); };
  const list = RULES.filter((r) => (!S.rj || r.jurisdiction === S.rj) && (!S.rs || r.status === S.rs) && (!q || hay(r).includes(q)))
    .sort((a, b) => jurs.indexOf(a.jurisdiction) - jurs.indexOf(b.jurisdiction) || a.team_rule_id.localeCompare(b.team_rule_id));
  const statusPill = (s) => `<span class="chip r-${s === "in_force" ? "applies" : s === "not_yet_effective" ? "not_yet_effective" : s === "pending" ? "pending" : "unknown"}">${esc(t(s.replace(/_/g, " ")))}</span>`;
  const es = S.lang === "es";
  const rows = list.map((r) => {
    const x = esRule(r);
    return `<details class="rrow"><summary><span class="mono">${esc(r.team_rule_id)}</span><span><b>${esc(titleOf(r))}</b><div class="muted" style="font-size:12.5px">${esc(r.jurisdiction)} · ${esc(catName(r.category))}</div></span><span class="mono muted">${esc(r.citation)}</span><span>${statusPill(r.status)}</span></summary>
    <div class="body">${es ? `<p class="lawnote">${te("The law's own words, citations and links stay in English, because the English is the legal text.")}</p>` : ""}<dl class="dl">
      ${x && x.plain_es ? `<dt>${te("In plain language")}</dt><dd>${esc(x.plain_es)}${kvOf(r) ? ` <span class="kv">${esc(kvOf(r))}</span>` : ""}${ES_PACK.label ? `<p class="srcnote">${esc(ES_PACK.label)}</p>` : ""}</dd>` : ""}
      <dt>${te("What it requires")}</dt><dd${LE()}>${esc(r.requirement)}</dd>
      <dt>${te("Effective")}</dt><dd>${esc(fmtDate(r.effective_date))}</dd>
      ${r.overrides && r.overrides.length ? `<dt>${te("Yields to")}</dt><dd>${r.overrides.map((o) => esc(byRule[o] ? titleOf(byRule[o]) : o) + ` (${esc(o)})`).join("; ")}</dd>` : ""}
      ${r.conflict_flag ? `<dt>${te("Flag")}</dt><dd style="color:var(--flag)">${r.conflict_note ? EN_TAG() + `<span${LE()}>${esc(r.conflict_note)}</span>` : te("Flagged for human review.")}</dd>` : ""}
      <dt>${te("Exact words")}</dt><dd><blockquote class="q" lang="en">${esc(r.quoted_span)}</blockquote></dd>
      <dt>${te("Source")}</dt><dd><a href="${esc(r.source_url)}" target="_blank" rel="noopener">${esc(r.source_url)}</a></dd>
    </dl></div></details>`;
  }).join("");
  v.innerHTML = `<div class="section-head"><div class="eyebrow">${te("Audit")}</div><h2>${te("Rules and method")}</h2>
    <p class="lede">${te("Everything the lookup says comes from the {n} rules below. Each rule carries its citation, its source link and the exact words it was read from.", { n: RULES.length })}</p></div>
    <section><h3>${te("What the rule set covers")}</h3><p class="muted" style="margin:4px 0 10px">${te("Red cells are topics where our sources had no rule. They are shown, not hidden.")}</p>${matrix}</section>
    ${selfcheckHtml()}
    <section class="block"><h3>${te("When each rule starts")}</h3><p class="muted" style="margin:4px 0 10px">${te("Dates come from the sources. The red line is the date used on the other tabs.")}</p><div class="gantt" data-label="${te("When each rule starts")}">${ganttSvg()}</div></section>
    <section class="block"><h3>${te("All rules")}</h3>
      <div class="ctrl" style="margin-top:8px;border-top:0;padding-top:0">
        <label for="rq">${te("Search")}</label><input class="search" id="rq" type="search" style="max-width:260px" value="${esc(S.rq || "")}" placeholder="${te("Title, citation or text")}">
        <label for="rj">${te("Place")}</label><select id="rj"><option value="">${te("All")}</option>${jurs.map((j) => `<option ${S.rj === j ? "selected" : ""}>${esc(j)}</option>`).join("")}</select>
        <label for="rs">${te("Status")}</label><select id="rs"><option value="">${te("All")}</option>${["in_force", "not_yet_effective", "pending", "failed"].map((s) => `<option value="${s}" ${S.rs === s ? "selected" : ""}>${esc(t(s.replace(/_/g, " ")))}</option>`).join("")}</select>
      </div>
      <div class="tablewrap" id="rlist" data-label="${te("All rules")}" style="margin-top:8px">${rows || `<div class="empty">${te("No rule matches.")}</div>`}</div>
    </section>
    <section class="block"><h3>${te("How it works")}</h3><div class="twocol" style="margin-top:10px">
      <div class="note"><h3>${te("1. Read the law once")}</h3><ul>
        <li>${te("A language model reads each source page and writes one record per rule. The schema is fixed, so every record has a citation, a source link and a quote.")}</li>
        <li>${te("Code checks that every quote appears word for word in the page. A record that fails is thrown out.")}</li>
        <li>${te("Code, not the model, decides whether a rule is in force, not yet effective, pending or failed, from its dates.")}</li></ul></div>
      <div class="note"><h3>${te("2. Answer for any address")}</h3><ul>
        <li>${te("The Census geocoder places the address in a city. Then the lookup stacks state, county and city rules.")}</li>
        <li>${th("Each rule is checked against year built and unit count. A missing fact gives <b>unknown</b>, never a guess.")}</li>
        <li>${th("When a stricter local law governs, the state rule shows as <b>superseded</b> and links to the one that governs.")}</li></ul></div>
      <div class="note"><h3>${te("3. Track change")}</h3><ul>
        <li>${te("The same engine runs in this page for any date, so a change is just two answers side by side.")}</li>
        <li>${te("Where a law may displace another, as with the New Jersey FAIR Act and city bans, the rule is flagged for a person to review. We do not decide it.")}</li></ul></div>
      <div class="note"><h3>${te("Built to be safe to use")}</h3><ul>
        <li>${te("Every screen says this is not legal advice.")}</li>
        <li>${te("Gaps in the sources are shown as gaps.")}</li>
        <li>${te("Public sources and public parcel data only. No personal data, no cookies, no tracking. This page loads nothing from other sites.")}</li>
        <li>${te("Plain-English summaries are written by AI from the source text. The quoted words come from the source and are checked by code.")}</li>
        <li>${te("Adding a city means adding its pages and re-running. No code changes. The whole run costs a few dollars.")}</li></ul></div>
    </div></section>`;
  markScrollers();
}

/* ------------------------------------------------------------------ events */
/* All clicks. The clicked element (or an ancestor) names its action in data-act; that is the whole routing table. */
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "skip") { ev.preventDefault(); $("#view").focus(); }
  else if (act === "tab") { go(el.dataset.tab); $("#view").focus({ preventScroll: true }); }
  else if (act === "lang") setLang(el.dataset.lang);
  else if (act === "guide") { S.guide = true; S.tab = "lookup"; render(); syncHash(); window.scrollTo({ top: 0 }); }
  else if (act === "picker") setPicker(!S.pickerOpen);
  else if (act === "mode") {
    S.mode = el.dataset.mode; S.res = "all";
    if (S.mode === "own") { syncOwn(); S.addr = OWN_ID; S.wiOpen = true; } else S.addr = S.lastSample;
    renderLookup($("#view"));
    if (S.mode === "own" && window.innerWidth > 900) { const y = $("#wi-year"); if (y) y.focus({ preventScroll: true }); }
  }
  else if (act === "pick") { S.addr = el.dataset.id; S.lastSample = S.addr; setPicker(false); renderList(); renderAnswer(); if (window.innerWidth <= 900) $("#answer").scrollIntoView({ behavior: "smooth", block: "start" }); }
  else if (act === "city") { S.city = el.dataset.city; S.shown = 60; renderCityChips(); renderList(); }
  else if (act === "more") { S.shown += 60; renderList(); }
  else if (act === "resf") { S.res = el.dataset.res; renderBody(); }
  else if (act === "wiclear") { delete S.wi[S.addr]; for (const id of ["wi-year", "wi-units"]) { const n = $("#" + id); if (n) n.value = ""; } const o = $("#wi-owner"); if (o) o.value = ""; renderFacts(); renderBody(); }
  else if (act === "gocat") {
    if (S.res !== "all") { S.res = "all"; renderBody(); }
    const target = document.getElementById("cat-" + el.dataset.cat);
    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  else if (act === "setdate") { S.date = el.dataset.date; renderAnswer(); }
  else if (act === "play") { if (S.playing) pausePlay(); else startPlay(); }
  else if (act === "evprev") stepChange(-1);
  else if (act === "evnext") stepChange(1);
  else if (act === "jump") { S.addr = el.dataset.id; S.lastSample = S.addr; S.mode = "sample"; S.date = el.dataset.date || S.date; S.res = "all"; S.city = "all"; S.q = ""; S.guide = false; go("lookup"); }
  else if (act === "card") {
    // Scroll to the card and flash it. If a result filter hides it, clear the filter and look again.
    const card = document.getElementById("card-" + el.dataset.rule);
    if (card) { card.scrollIntoView({ behavior: "smooth", block: "center" }); card.classList.add("flash"); setTimeout(() => card.classList.remove("flash"), 1600); }
    else { S.res = "all"; renderAnswer(); const c2 = document.getElementById("card-" + el.dataset.rule); if (c2) c2.scrollIntoView({ block: "center" }); }
  }
  else if (act === "copyjson") copyJson();
  else if (act === "copylink") { syncHash(); copyText(location.href, t("Link to this answer copied.")); }
  else if (act === "print") window.print();
  else if (act === "cmp") { S.cmpA = el.dataset.a; S.cmpB = el.dataset.b; renderChanges($("#view")); }
  else if (act === "cmprow") { S.open = S.open === el.dataset.key ? null : el.dataset.key; renderChanges($("#view")); }
  else if (act === "theme") {
    const root = document.documentElement;
    root.dataset.theme = isDark() ? "light" : "dark";
    renderChrome();
  }
});
/* Text fields that filter as you type: the address search and the rules search. */
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.id === "q") { S.q = el.value; S.shown = 60; renderList(); }
  else if (el.id === "scrub") { stopPlay(); scrubTo(isoOfDay(Number(el.value))); }
  // The rules tab is redrawn whole on each keystroke, so the caret position is saved and put back, or typing would jump to the start.
  else if (el.id === "rq") { S.rq = el.value; const pos = el.selectionStart; renderRulesTab($("#view")); const n = $("#rq"); n.focus(); n.setSelectionRange(pos, pos); }
});
/* Date pickers, selects and the what-if fields. The what-if fields use "change" (when the field is left), not "input", so half-typed years such as "19" never flash an error. */
document.addEventListener("change", (ev) => {
  const el = ev.target;
  const ok = (d) => /^\d{4}-\d{2}-\d{2}$/.test(d) && NE.parseDate(d) !== null;
  if (el.id === "asof" && ok(el.value)) { S.date = el.value; renderAnswer(); }
  else if (el.id === "scrub") setAnswerDate(isoOfDay(Number(el.value)));
  else if (el.id === "cmpA" && ok(el.value)) { S.cmpA = el.value; renderChanges($("#view")); }
  else if (el.id === "cmpB" && ok(el.value)) { S.cmpB = el.value; renderChanges($("#view")); }
  else if (el.id === "own-place") { S.ownPlace = el.value; syncOwn(); setPicker(false); renderAnswer(); }
  else if (el.id === "mapRule") { S.mapRule = el.value; renderMap($("#view")); }
  else if (el.id === "mapDate" && ok(el.value)) { S.date = el.value; renderMap($("#view")); }
  else if (el.id === "rj") { S.rj = el.value; renderRulesTab($("#view")); }
  else if (el.id === "rs") { S.rs = el.value; renderRulesTab($("#view")); }
  else if (el.id === "wi-year" || el.id === "wi-units" || el.id === "wi-owner") {
    const cur = S.wi[S.addr] || {};
    S.wi[S.addr] = { year: el.id === "wi-year" ? el.value : cur.year, units: el.id === "wi-units" ? el.value : cur.units, owner: el.id === "wi-owner" ? el.value : cur.owner };
    // Only the facts tiles and the answers below are redrawn, never the fields themselves (see renderAnswer).
    renderFacts(); renderBody();
  }
});
/* Remember whether the what-if box and the guide are open, so a redraw keeps them as the person left them. Capture phase: "toggle" does not bubble. */
document.addEventListener("toggle", (ev) => {
  if (!ev.target) return;
  if (ev.target.id === "wiBox") S.wiOpen = ev.target.open;
  else if (ev.target.id === "guide") S.guide = ev.target.open;
}, true);
window.addEventListener("resize", () => { setTopbar(); markScrollers(); });

/* ------------------------------------------------------------------ start */
readHash();      // 1. state from the URL (address, date, facts, tab, language)
applyLang();     // 2. document language and title
renderFoot();    // 3. footer (needs the language)
render();        // 4. the current view
})();
</script>
