ice Index (CPI) from the CPI 15 months prior to the month of the proposed rent increase to the CPI three months prior to the month of the proposed rent increase. In no case shall the allowable rent increase exceed 4%.","retrieved_at":"2026-10-03","confidence":0.85,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"All multiple dwellings, as defined in the chapter (any building or structure containing one or more apartments rented or offered to one or more tenants), are subject to rent control.","exemptions":"Exempt dwellings include public housing, hotel/motel space rented day-to-day to transients, commercial space, newly constructed multiple dwellings and vacant dwellings (per \\u00a7\\u00a7 19:2-18.1 and 18.2, not in this part), certain rehabilitated units receiving Section 8 or Rental Rehabilitation subsidies, and units under a preemptive governmental agency rent-regulation contract.","interaction":"The base increase may be supplemented by Board-approved tax surcharges, major new improvement surcharges and hardship increases, all conditioned on substantial compliance and registration; an owner-occupied definition (four units or less with the owner residing in one) appears in the chapter, though its effect is not stated in this part.","supporting_sources":[{"doc_id":"D070","source_url":"https://ecode360.com/36623772","retrieved_at":"2026-10-03","quoted_span":"No landlord shall after the effective date of this chapter charge any rents in excess of what he/she was receiving from the effective date of this chapter except for increases authorized by this chapter."},{"doc_id":"D070","source_url":"https://ecode360.com/36623772","retrieved_at":"2026-10-03","quoted_span":"the Rent Control Board shall not grant increases exceeding 25% in any one year for any tenant."}],"cov":{"scope":"universal","conditions":[],"exemptions":[{"label":"Public housing","conditions":[{"fact":"status_not_in_data","op":"is","value":"public housing","years_before_as_of":0,"text":"public housing"}]},{"label":"Hotel or motel space rented to transients","conditions":[{"fact":"use_type","op":"is","value":"hotel or motel","years_before_as_of":0,"text":"hotel/motel space rented day-to-day to transients"}]},{"label":"Commercial space","conditions":[{"fact":"use_type","op":"is","value":"commercial","years_before_as_of":0,"text":"commercial space"}]},{"label":"Certain subsidized rehabilitated units or preempting agency contract","conditions":[{"fact":"status_not_in_data","op":"is","value":"Section 8 or rehabilitation subsidy, or preempting government rent regulation","years_before_as_of":0,"text":"rehabilitated units receiving Section 8 or Rental Rehabilitation subsidies, and units under a preemptive governmental agency contract"}]}],"support":"own text coverage_text and exemptions_text; newly constructed and vacant dwellings are cited to other sections and not tested","reasoning":"Covers all multiple dwellings in Newark with the stated exemptions."}},{"team_rule_id":"r-0048","jurisdiction":"Newark, NJ","level":"city","category":"rent_increase_limits","legal_state":"enacted","status":"in_force","title":"Newark HOME-assisted unit maximum rents","requirement":"Rents for HOME-assisted units in Newark's Neighborhood Rehabilitation Program may not exceed the lesser of HUD fair market rent or the rent affordable to a family at 65% of area median income (30% of adjusted income), minus utility allowances where the tenant pays utilities. Owners must give tenants at least 30 days' prior written notice of any rent increase, and leases must be for at least one year unless mutually agreed otherwise.","key_value":"Lesser of HUD fair market rent or 30% of adjusted income at 65% of area median income; 30 days' written notice of increase","plain_en":"Newark rents for HOME-assisted units cannot exceed set HUD-based limits, and owners must give 30 days' written notice of increases.","citation":"Newark Municipal Code § 2:10-1.2(b)(5)","effective_date":null,"source_doc_id":"D071","source_url":"https://ecode360.com/36637822","quoted_span":"Any increase in rents for HOME assisted units is subject to the provisions of outstanding leases, and in any event, the owner must provide tenants of those units not less than 30 days prior written notice before implementing any increase in rents.","retrieved_at":"2026-10-03","confidence":0.7,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Applies only to rental units assisted with HOME funds through the City's Neighborhood Rehabilitation Program (owner-occupied structures of one to three dwelling units), for the applicable affordability period (5, 10 or 15 years depending on funds awarded).","exemptions":"Mixed use or nonresidential buildings are not eligible for the program.","interaction":"HOME rent limits are set by HUD and recalculated periodically; any rent increase remains subject to the terms of outstanding leases, and tax-credit units follow IRC section 42 rent rules.","supporting_sources":[],"cov":{"scope":"conditional","conditions":[{"fact":"status_not_in_data","op":"is","value":"HOME-assisted unit in Neighborhood Rehabilitation Program","years_before_as_of":0,"text":"rental units assisted with HOME funds through the Neighborhood Rehabilitation Program"},{"fact":"units","op":"<=","value":"3","years_before_as_of":0,"text":"owner-occupied structures of one to three dwelling units"},{"fact":"owner_occupied","op":"is","value":"true","years_before_as_of":0,"text":"owner-occupied structures"}],"exemptions":[],"support":"own text coverage_text and coverage field","reasoning":"Covers only HOME-assisted units in owner-occupied structures of one to three units."}},{"team_rule_id":"r-0049","jurisdiction":"Newark, NJ","level":"city","category":"rent_increase_limits","legal_state":"enacted","status":"in_force","title":"Newark unconscionable rent increase ordinance","requirement":"Newark defines an 'unconscionable rent' increase for residential rental properties as one that is exceedingly harsh or unreasonable, exceeds the increase in the landlord's expenses, and is not comparable to rents at similar properties. For properties under a redevelopment or financial agreement, rent above the approved pro-forma is per se unconscionable.","key_value":"Rent above approved pro-forma is per se unconscionable","plain_en":"Newark defines an unconscionable rent increase as unreasonably harsh, above the landlord's cost increase, and out of line with similar rents.","citation":"Newark Municipal Code § 2:10-11.1","effective_date":null,"source_doc_id":"D071","source_url":"https://ecode360.com/36637822","quoted_span":"Shall mean any rental increase for residential properties including but not limited to market and unsubsidized units, whose rental increases are exceedingly harsh or unreasonable that exceed the increase in the landlord’s expenses; and is not comparable to rents charged at similar properties.","retrieved_at":"2026-10-03","confidence":0.55,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Residential rental properties in Newark, including market-rate and unsubsidized units, other than statutorily exempt or HUD-controlled units.","exemptions":"Does not apply to units statutorily exempt from rent control under N.J.S.A. 2A:42-84.1 to 84.6 or units controlled and governed by HUD.","interaction":"The definition carves out units exempt from rent control under N.J.S.A. 2A:42-84.1-84.6 and HUD-controlled units; the operative prohibition and remedies are not in this part of the document.","supporting_sources":[],"cov":{"scope":"universal","conditions":[],"exemptions":[{"label":"Units exempt from rent control or governed by HUD","conditions":[{"fact":"status_not_in_data","op":"is","value":"exempt from rent control under N.J.S.A. 2A:42-84.1-84.6 or HUD-controlled","years_before_as_of":0,"text":"statutorily exempt from Rent Control or controlled and governed by HUD"}]}],"support":"own text coverage_text and exemptions_text","reasoning":"Applies to residential rentals in Newark except statutorily exempt or HUD-controlled units."}},{"team_rule_id":"r-0050","jurisdiction":"Newark, NJ","level":"city","category":"just_cause_eviction","legal_state":"enacted","status":"in_force","title":"Newark retaliatory eviction prohibition","requirement":"A landlord may not bring an action to recover possession of a dwelling unit as a reprisal for the tenant's efforts to secure or enforce any right under the rent control chapter.","key_value":null,"plain_en":"Newark landlords cannot try to evict a tenant as payback for the tenant using rights under the rent control law.","citation":"Newark Rev. Gen. Ords. § 19:2-14","effective_date":null,"source_doc_id":"D070","source_url":"https://ecode360.com/36623772","quoted_span":"No landlord shall bring any action to recover possession of a dwelling unit as a reprisal for the tenant's efforts to secure or enforce any right under this chapter.","retrieved_at":"2026-10-03","confidence":0.7,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Applies to dwelling units subject to the Newark rent control chapter; no further coverage tests are stated in this part.","exemptions":null,"interaction":"The ordinance elsewhere references the state Anti-Eviction Act (N.J.S.A. 2A:18-61.1 et seq.) and the Senior Citizens and Disabled Protected Tenancy Act (N.J.S.A. 2A:18-61.22) in connection with unlawful entry and condominium conversion protections.","supporting_sources":[],"cov":{"scope":"conditional","conditions":[{"fact":"rule_coverage","op":"is","value":"r-0047","years_before_as_of":0,"text":"dwelling units subject to the Newark rent control chapter"}],"exemptions":[],"support":"own text coverage_text; r-0047 covers dwellings under Newark rent control","reasoning":"Applies to dwelling units subject to the Newark rent control chapter."}},{"team_rule_id":"r-0051","jurisdiction":"Newark, NJ","level":"city","category":"screening_restrictions","legal_state":"enacted","status":"in_force","title":"Newark Ban the Box rental screening","requirement":"Landlords and brokers may inquire into criminal history only after a formal application and written notice and consent, may look back only 8 years for indictable convictions and 5 years for disorderly persons/ordinance convictions (certain serious offenses at any time), may not use non-pending arrests, expunged/sealed records or juvenile adjudications, must weigh rehabilitation factors, and must give written reasons and the results within 10 business days of an adverse decision.","key_value":"Lookback: 8 years (indictable), 5 years (disorderly persons/ordinance); after formal application only","plain_en":"Newark landlords may check criminal history only after a formal application and consent, with limited look-back periods, and must give written reasons if denying.","citation":"Newark Municipal Code §§ 2:31-2 to 2:31-9","effective_date":null,"source_doc_id":"D072","source_url":"https://ecode360.com/36642000","quoted_span":"Inquiry into and consideration of any applicant's criminal history shall take place only after the applicant has submitted a formal application.","retrieved_at":"2026-10-03","confidence":0.9,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Applies to rentals, leases and subleases of real property in Newark by landlords and real estate brokers, except certain owner-occupied small dwellings.","exemptions":"Does not apply to a single apartment in an owner-occupied two-family dwelling or a room rental in an owner-occupied one-family dwelling; also does not apply where federal or state law requires or permits criminal-history consideration (limited to those offenses and periods) or to property in government programs encouraging housing for people with criminal histories.","interaction":"Prohibitions do not apply where federal or state law, regulation or rule requires or permits consideration of criminal history, limited to the offenses and time periods that law allows.","supporting_sources":[],"cov":{"scope":"universal","conditions":[],"exemptions":[{"label":"Apartment in an owner-occupied two-family dwelling","conditions":[{"fact":"units","op":"==","value":"2","years_before_as_of":0,"text":"a single apartment in a two family dwelling"},{"fact":"owner_occupied","op":"is","value":"true","years_before_as_of":0,"text":"the other unit occupied by the owner"}]},{"label":"Room rental in an owner-occupied one-family dwelling","conditions":[{"fact":"units","op":"==","value":"1","years_before_as_of":0,"text":"a room rental in a one-family dwelling"},{"fact":"owner_occupied","op":"is","value":"true","years_before_as_of":0,"text":"owner-occupied one-family dwelling"}]},{"label":"Government programs housing people with criminal histories","conditions":[{"fact":"status_not_in_data","op":"is","value":"government program housing for people with criminal histories","years_before_as_of":0,"text":"property in government programs encouraging housing for people with criminal histories"}]}],"support":"own text coverage_text, exemptions_text and coverage field","reasoning":"Applies to rentals in Newark except small owner-occupied cases and special programs."}},{"team_rule_id":"r-0052","jurisdiction":"Boston, MA","level":"city","category":"rent_increase_limits","legal_state":"failed","status":"failed","title":"H.3744 Boston rent stabilization home-rule petition","requirement":"Bill title indicates a petition for a special law authorizing the city of Boston to implement rent stabilization and tenant eviction protections; the bill text and specific limits are not on the page.","key_value":null,"plain_en":"A proposed bill that would have let Boston adopt rent stabilization and eviction protections; it was sent to study and never became law.","citation":"Mass. H.3744 (193rd General Court, 2023-2024)","effective_date":null,"source_doc_id":"D011","source_url":"https://malegislature.gov/Bills/193/H3744","quoted_span":"An Act petition for a special law authorizing the city of Boston to implement rent stabilization and tenant eviction protections","retrieved_at":"2026-10-01T22:35Z","confidence":0.55,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Coverage cannot be determined because the bill text is not included on the page.","exemptions":null,"interaction":"The bill would have been a special law authorizing Boston to adopt local rent stabilization; the page notes local approval was received but the bill was sent to a study order (H5035) and was not enacted.","supporting_sources":[],"cov":{"scope":"undefined","conditions":[],"exemptions":[],"support":"own text","reasoning":"A failed bill with no stated coverage."}},{"team_rule_id":"r-0053","jurisdiction":"Boston, MA","level":"city","category":"just_cause_eviction","legal_state":"enacted","status":"in_force","title":"Boston Housing Stability Notification Act","requirement":"A landlord or foreclosing owner ending a tenancy must deliver a Notice of Tenants' Rights and Resources to the tenant at the same time as the Notice to Quit or non-renewal notice, and send a copy of that notice with a Certificate of Compliance/Service to the City's Office of Housing Stability. Violations draw a warning, then $300 per day, but do not halt the eviction process.","key_value":"Notice of Tenants' Rights and Resources delivered with Notice to Quit; copy to Office of Housing Stability","plain_en":"Boston landlords ending a tenancy must give the tenant a rights and resources notice with the eviction notice and send a copy to the city.","citation":"Boston City Ordinances § 10-11.7","effective_date":"2020-11-06","source_doc_id":"D014","source_url":"https://www.boston.gov/sites/default/files/file/2020/11/Housing%20Stability%20Notification%20Act%20Tenant%20FAQs.pdf","quoted_span":"The HSNA becomes effective on November 6, 2020.","retrieved_at":"2026-10-01T22:35Z","confidence":0.7,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"All landlords and foreclosing owners intending to end a tenancy or post-foreclosure occupancy of a unit in the City of Boston.","exemptions":"Only residences in hospitals, skilled nursing or health facilities, and non-profit short-term substance abuse treatment facilities are exempt.","interaction":"The requirements cannot be waived by lease or contract; violation does not halt the eviction process.","supporting_sources":[{"doc_id":"D013","source_url":"https://www.boston.gov/housing-stability-notification-act","retrieved_at":"2026-10-01T22:35Z","quoted_span":"The Housing Stability Notification Act requires\nALL LANDLORDS\nplanning to end a tenancy agreement to provide the tenant with a Notice of Tenants’ Rights and Resources."}],"cov":{"scope":"universal","conditions":[],"exemptions":[{"label":"Hospital, skilled nursing or health facility residences","conditions":[{"fact":"use_type","op":"is","value":"hospital, skilled nursing or health facility","years_before_as_of":0,"text":"residences in any hospital, skilled nursing facility or health facility"}]},{"label":"Non-profit short-term substance abuse treatment facility","conditions":[{"fact":"use_type","op":"is","value":"short-term substance abuse treatment facility","years_before_as_of":0,"text":"non-profit facility providing short-term substance abuse treatment"}]}],"support":"own text coverage_text and exemptions_text","reasoning":"Applies to all Boston landlords ending a tenancy except the listed facilities."}},{"team_rule_id":"r-0054","jurisdiction":"Boston, MA","level":"city","category":"screening_restrictions","legal_state":"enacted","status":"in_force","title":"Boston Fair Chance Tenant Selection Policy","requirement":"Covered housing providers may not impose blanket denials based on arrests or convictions and must not consider non-conviction arrests, judicially relieved convictions, juvenile records, or convictions more than 5 years old (subject to exceptions for direct relationship/unreasonable risk of harm). They also may not use applicants' credit scores to approve or deny applications.","key_value":"No blanket bans; no consideration of arrests without conviction, sealed/expunged or juvenile records, or convictions over 5 years old; no credit score use","plain_en":"Boston housing providers with city funding or income-restricted units cannot impose blanket criminal bans, use old or non-conviction records, or use credit scores to deny applicants.","citation":"Boston Fair Chance Tenant Selection Policy (DND, Feb. 2017)","effective_date":null,"source_doc_id":"D010","source_url":"https://drive.google.com/file/d/1j4U3fDtmnYuwcUWhx5BMUcXc1bnKT8Ku/view?usp=sharing","quoted_span":"will not impose a blanket policy that denies \nhousing to anyone with arrests and or convictions. Housing providers will consider applicants on \na case-by-case basis.","retrieved_at":"2026-10-01T22:44Z","confidence":0.8,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Housing providers receiving DND funding and/or land, or with income-restricted units created under the BPDA Inclusionary Development Policy (also applied to the Office of Fair Housing and Equity Affirmative Marketing Program).","exemptions":"Criminal-history limits do not apply where there is a direct relationship between a conviction and the housing sought and/or unreasonable risk of substantial harm to others, or to current criminal behavior.","interaction":"Where federal or state law imposes a criminal history requirement that conflicts with this guidance, the federal or state law preempts the policy. Federal or state criminal-history requirements preempt the policy, but no corresponding groups exist.","supporting_sources":[],"cov":{"scope":"conditional","conditions":[{"fac /* ==========================================================================================================
   STACKWISE front end
   One page, one script. It answers: for this building, on this date, which rental-housing rules apply, which
   have been displaced by a stricter local rule, which have not started yet, which are only bills, and what
   the data cannot say.

   ARCHITECTURE
   - Data. window.NAV_DATA (data.js) holds the rules, the 500 sample addresses and the five change tests.
     window.NavEngine (engine.js) is the answer engine, a port of src/engine.py. It runs in this tab for any
     date, so nothing is pre-computed for one date only.
   - State. One object, S (see "state" below). What is on screen is a function of S and the data.
   - Rendering. Plain functions that build an HTML string and assign it to a fixed container:
       render() -> renderChrome (header) + one of renderLookup / renderChanges / renderMap / renderRulesTab.
       renderLookup -> renderPicker, renderAnswer -> renderFacts, renderBody (bottomLine, cardHtml).
     Small updates call the smallest function that is enough (for example renderBody, not renderLookup).
   - Events. Event delegation: one click, input, change and toggle listener on document at the bottom. A
     clickable element carries data-act="..." and the listener dispatches on it. Re-rendering never has to
     re-attach listeners.
   - Language. English is the source text in the code. t(the English string) returns the Spanish text when the
     Spanish view is on and the dictionary (window.NAV_ES) has it, else the English. The Spanish view exists
     only when data.js carries translations (NAV_DATA.i18n.es); without them the page is English only.
   - Safety. Every string that comes from the data goes through esc() before it enters HTML. Dictionary
     strings are trusted text; the values substituted into them are escaped.

   WHY ONE FILE
   The page must open from a double-click, work offline and cannot break because a sibling file is missing.
   build_site.py inlines engine.js, data.js and the fonts into this template. A strict Content-Security-Policy
   (see build_site.py) blocks every outside request.

   WHY NO BROWSER STORAGE
   Facts a person types (year built, units) describe a building and are private. They live in memory only (S.wi),
   so closing the tab erases them. The same goes for the language choice. The one thing that can travel is the
   address, date, typed facts and language in the URL hash, and only when the person copies the link.

   PRIVACY PROMISES (checked by tests/test_web_and_repo.py)
   No cookies, no analytics, no accounts, no network requests of any kind, no outside fonts or scripts, and
   every outside link opens with rel="noopener".
   ========================================================================================================== */

const BASIS = {
  census_geocoder: "Placed in its city by the U.S. Census geocoder",
  city_dataset: "City taken from the parcel dataset. The geocoder could not match this address",
  chosen_by_you: "Place chosen by you. No address is looked up or sent anywhere",
  unresolved: "Could not be placed in a city. City rules are unknown",
};

/* ------------------------------------------------------------------ small helpers */
/* Escape a value for HTML text or a quoted attribute. Used on EVERY string that comes from data or from the person. */
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
/* Shorthand for querySelector: the first element matching a CSS selector, in the whole page or inside el. */
const $ = (s, el) => (el || document).querySelector(s);

/* ------------------------------------------------------------------ language (ES / EN) */
/* The Spanish view exists only when data.js carries translations: NAV_DATA.i18n.es = { label, model, rules: { <rule id>: { title_es, key_value_es, plain_es } } }.
   With none (or an empty rules map) there is no toggle and nothing below changes the page. */
const ES = window.NAV_ES || {};
const ES_PACK = (D.i18n && D.i18n.es) || {};
const ES_RULES = ES_PACK.rules || {};
const HAS_ES = Object.keys(ES_RULES).length > 0;
/* True when object o has its own key k (so a dictionary lookup never finds an inherited name such as "constructor"). */
const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
/* Replace {name} placeholders in a string with vars[name], passing each value through enc (String for text, esc for HTML). */
function fill(str, vars, enc) {
  if (!vars) return str;
  return str.replace(/\{(\w+)\}/g, (m, k) => (hasOwn(vars, k) ? enc(vars[k] == null ? "" : vars[k]) : m));
}
/* The text for an English source string: the dictionary entry in the Spanish view, else the English itself. */
const pick = (s) => { s = String(s == null ? "" : s); return S.lang === "es" && hasOwn(ES, s) ? ES[s] : s; };
/* t: plain text (vars inserted as they are). Use it for attributes that are escaped afterwards, textContent and comparisons. */
const t = (s, vars) => fill(pick(s), vars, String);
/* te: text made safe for HTML (the whole result is escaped, vars included). The usual choice inside a template literal. */
const te = (s, vars) => esc(t(s, vars));
/* th: for the few dictionary strings that carry trusted markup such as <b>. The markup is kept, the vars are escaped. */
const th = (s, vars) => fill(pick(s), vars, esc);
/* tn: plain text with a plural. one and many are two separate source strings (word order and endings differ by language); {n} is the count. */
const tn = (n, one, many, vars) => t(n === 1 ? one : many, Object.assign({ n }, vars));
/* A whole English paragraph shown in the Spanish view gets this muted label in front; lang="en" marks English text for screen readers. */
const EN_TAG = () => (S.lang === "es" ? `<span class="entag">${te("(in English)")}</span> ` : "");
/* The attribute for a block of English text inside the Spanish page (" lang=\"en\""), or nothing in the English view. */
const LE = () => (S.lang === "es" ? ' lang="en"' : "");
/* A number with the thousands separator of the current language. */
const num = (n) => n.toLocaleString(S.lang === "es" ? "es-US" : "en-US");
/* A rule's Spanish text { title_es, key_value_es, plain_es }: only in the Spanish view, and only when that rule was translated; else null. */
const esRule = (r) => (S.lang === "es" && ES_RULES[r.team_rule_id]) || null;
/* The title to show for a rule: the Spanish one when there is one, else the English title. */
const titleOf = (r) => { const x = esRule(r); return (x && x.title_es) || r.title; };
/* The key value ("5% + CPI, max 10%") to show for a rule: Spanish when there is one, else English (or null). */
const kvOf = (r) => { const x = esRule(r); return (x && x.key_value_es) || r.key_value; };
/* A state's name from its two-letter code ("NJ" -> "New Jersey" / "Nueva Jersey"). An unknown code is shown as it is. */
const stName = (c) => t(STATE_NAME[c] || c);
/* A topic's display name from its key ("security_deposits" -> "Security deposits" / "Depósitos de seguridad"). */
const catName = (ck) => t(CAT_LABEL[ck]);
/* "Los Angeles County" -> "Condado de Los Angeles" in the Spanish view. Any other value is shown as it is. */
const countyName = (c) => { const m = /^(.+) County$/.exec(c); return m ? t("{name} County", { name: m[1] }) : c; };

/* The chip word for a result key ("applies" -> "Applies" / "Se aplica"); "not_listed" is the compare table's extra value. */
const resLabel = (k) => (k === "not_listed" ? t("Not listed") : t(RES[k].label));
/* The one-line meaning of a result key, in the current language. */
const resHelp = (k) => t(RES[k].help);
/* The colored label for a result: icon + word, so meaning never depends on color alone. */
const chipHtml = (k) => `<span class="chip r-${k}" title="${esc(resHelp(k))}">${ic(k)}${esc(resLabel(k))}</span>`;

/* Dates come as "YYYY", "YYYY-MM" or "YYYY-MM-DD". Spanish uses its own month names; full = long month, for use inside a sentence. */
const fmtDate = (iso, full) => {
  if (!iso) return t("date not stated");
  const m = /^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?$/.exec(iso);
  if (!m) return iso;
  const d = new Date(Date.UTC(+m[1], m[2] ? +m[2] - 1 : 0, m[3] ? +m[3] : 1));
  const es = S.lang === "es";
  const o = { timeZone: "UTC", year: "numeric" };
  if (m[2]) o.month = es && full ? "long" : "short";
  if (m[3]) o.day = "numeric";
  return d.toLocaleDateString(es ? "es-US" : "en-GB", o);
};
/* What the engine reads about an address. facts may carry what-if values. */
const addrInput = (a) => ({ address_id: a.id, state: a.state, facts: a.facts, city: a.city, basis: a.basis, unverified: a.unverified });
/* cityOf: the grouping KEY for an address's city ("Not placed" when neither the geocoder nor the parcel data named one). It stays in English
   so filters and counts match in both languages. cityShort: the label shown to people (state suffix removed, "Not placed" translated). */
const cityOf = (a) => a.city || "Not placed";
const cityShort = (c) => (c === "Not placed" ? t("Not placed") : c.replace(/, [A-Z]{2}$/, ""));
const CITIES = [...new Set(ADDR.map(cityOf))].sort();

/* Icons are inline SVG (no icon font, no request). One 16-unit grid, one stroke width, so they read as a family. */
const ICONS = {
  applies: '<circle cx="8" cy="8" r="6.2"/><path d="M5.2 8.3l2 2 3.6-4"/>',
  superseded: '<path d="M4 3v5a2 2 0 0 0 2 2h6"/><path d="M9.5 7.5L12 10l-2.5 2.5"/>',
  unknown: '<circle cx="8" cy="8" r="6.2"/><path d="M6.3 6.4a1.8 1.8 0 1 1 2.6 1.6c-.6.3-.9.7-.9 1.3"/><path d="M8 11.4v.1"/>',
  not_yet_effective: '<circle cx="8" cy="8" r="6.2"/><path d="M8 4.6V8l2.2 1.4"/>',
  pending: '<path d="M4.5 2.5h5l2.5 2.5v8.5h-7.5z"/><path d="M9.5 2.5V5H12"/><path d="M6.3 8.5h3.4M6.3 10.8h3.4"/>',
  info: '<circle cx="8" cy="8" r="6.2"/><path d="M8 7.4V11"/><path d="M8 5.1v.1"/>',
  moon: '<path d="M13 9.3A5.2 5.2 0 0 1 6.7 3 5.3 5.3 0 1 0 13 9.3z"/>',
  sun: '<circle cx="8" cy="8" r="2.6"/><path d="M8 1.6v1.6M8 12.8v1.6M1.6 8h1.6M12.8 8h1.6M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M3.5 12.5l1.1-1.1M11.4 4.6l1.1-1.1"/>',
  print: '<path d="M4.5 6V2.5h7V6"/><path d="M4.5 11.5h-2V6h11v5.5h-2"/><path d="M4.5 9.5h7v4h-7z"/>',
  link: '<path d="M7 9a2.5 2.5 0 0 0 3.5 0l2-2a2.5 2.5 0 0 0-3.5-3.5l-.7.7"/><path d="M9 7a2.5 2.5 0 0 0-3.5 0l-2 2A2.5 2.5 0 0 0 7 12.5l.7-.7"/>',
  code: '<path d="M6 4.5L2.5 8 6 11.5M10 4.5L13.5 8 10 11.5"/>',
  play: '<path d="M5 3.2v9.6L12.6 8z"/>',
  pause: '<path d="M5.2 3.5v9M10.8 3.5v9"/>',
};
/* An icon as an inline SVG string. cls "" means "no class" (the size then comes from the parent's CSS). aria-hidden: the words next to it carry the meaning. */
const ic = (k, cls) => `<svg class="${cls || "ico"}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${ICONS[k]}</svg>`;

/* ------------------------------------------------------------------ state */
const OWN_ID = "YOURS";                      // the pseudo-address used for "Your own building"
/* S is the whole UI state. Nothing is saved anywhere; a reload starts from the URL hash (see readHash). */
const S = {
  tab: "lookup", addr: (byAddr.A0001 || ADDR[0]).id, date: DEFAULT_DATE, q: "", city: "all", res: "all", shown: 60,
  cmpA: "2025-12-31", cmpB: "2026-01-02", open: null, mapRule: null, wi: {}, wiOpen: false,
  mode: "sample",                             // "sample" (500 parcels) or "own" (a building the person describes)
  lastSample: (byAddr.A0001 || ADDR[0]).id, ownPlace: "city:Los Angeles, CA", guide: false, pickerOpen: false,
  lang: "en",                                 // "en" or "es"; "es" only when HAS_ES
  rq: "", rj: "", rs: "",                     // rules tab: search text, place filter, status filter
};
/* wi = what-if facts typed by the person, per address: { [address id]: { year, units, owner } } (raw text; parsed by wiOf). */

/* ---- "Your own building": a pseudo-address with no parcel facts, so everything the engine knows comes from the person. ---- */
/* The places a person can pick for their own building: each state (statewide rules only) and each city that has rules. */
function ownPlaces() {
  const out = [];
  for (const j of JURS()) {
    if (!/, [A-Z]{2}$/.test(j)) out.push({ key: "state:" + j, label: t("Elsewhere in {state} (statewide rules only)", { state: stName(j) }), state: j, city: null, group: stName(j) });
    else out.push({ key: "city:" + j, label: j.replace(/, [A-Z]{2}$/, ""), state: j.slice(-2), city: j, group: stName(j.slice(-2)) });
  }
  return out;
}
/* Build (or rebuild) the pseudo-address for the chosen place. Its facts are empty, so unit and year tests are unknown until the person types them. */
function syncOwn() {
  const pl = ownPlaces().find((x) => x.key === S.ownPlace) || ownPlaces()[0];
  byAddr[OWN_ID] = {
    id: OWN_ID, street: "Your building", postal_city: pl.city ? pl.city.replace(/, [A-Z]{2}$/, "") : STATE_NAME[pl.state], zip: "", state: pl.state,
    county: null, matched_address: null, lat: null, lon: null, city: pl.city, basis: "chosen_by_you", unverified: null,
    facts: { year_built: null, units_lo: null, units_hi: null, units_basis: "no unit count entered yet", year_basis: "no year built entered yet", use_code: "", use_description: "" },
    dataset: "Entered by you", retrieved_at: "", geocoded: false, note: null, own: true,
  };
  return byAddr[OWN_ID];
}
/* Answers for all 500 addresses on one date, cached by date. Used by the footer, the map and the compare table (not by the lookup, which runs one address). */
const cache = new Map();
/* The engine's entries for every sample address on one date, as { [address id]: entries[] }. Computed once per date, then reused. */
function allAt(date) {
  if (!cache.has(date)) {
    const m = {};
    for (const a of ADDR) m[a.id] = NE.lookupAddress(addrInput(a), RULES, date).entries;
    cache.set(date, m);
  }
  return cache.get(date);
}
/* The engine's answer for one address on one date: { entries: [...] } (no what-if facts). */
const lookupOne = (a, date) => NE.lookupAddress(addrInput(a), RULES, date);

/* ------------------------------------------------------------------ shell */
/* [key, full label, short label]. The short label replaces the full one on phones (CSS .tab .short). */
const TABS = [["lookup", "Lookup", "Lookup"], ["changes", "What changed", "Changes"], ["map", "Coverage map", "Map"], ["rules", "Rules and method", "Rules"]];
/* True when the dark theme is showing: the person's button choice wins, else the system setting. */
const isDark = () => document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && window.matchMedia("(prefers-color-scheme: dark)").matches);
/* Bold the first sentence of a notice. Works for both languages because both put the headline in the first sentence. */
function boldFirst(text) {
  const i = text.indexOf(". ");
  return i < 0 ? esc(text) : `<b>${esc(text.slice(0, i + 1))}</b> ${esc(text.slice(i + 2))}`;
}
/* The EN | ES toggle in the header. Built once (so keyboard focus stays on it when the language changes), then only its pressed state is updated.
   The button names are the languages' own names ("English", "Español"), so they are not translated. Hidden when there are no translations. */
function renderLangs() {
  const box = $("#langs");
  box.hidden = !HAS_ES;
  if (!HAS_ES) return;
  box.setAttribute("aria-label", t("Language"));
  if (!box.firstElementChild) {
    box.innerHTML = [["en", "EN", "English"], ["es", "ES", "Español"]]
      .map(([k, short, name]) => `<button type="button" data-act="lang" data-lang="${k}" lang="${k}" aria-label="${name}" aria-pressed="false">${short}</button>`).join("");
  }
  for (const b of box.querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.lang === S.lang));
}
/* Header pieces that change with state or language: skip link, tagline, tabs, language toggle, theme icon, the permanent legal notice. */
function renderChrome() {
  $("#skip").textContent = t("Skip to the content");
  $("#tagline").textContent = t("Which rental laws apply here, on this date?");
  $("#tabs").setAttribute("aria-label", t("Sections"));
  $("#tabs").innerHTML = TABS.map(([k, l, sh]) => `<button class="tab" data-act="tab" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ""}><span class="full">${esc(t(l))}</span><span class="short">${esc(t(sh))}</span></button>`).join("");
  renderLangs();
  const tb = $("#themeBtn"), dark = isDark();
  tb.innerHTML = ic(dark ? "sun" : "moon", "");
  const lab = dark ? t("Switch to light mode") : t("Switch to dark mode");
  tb.setAttribute("aria-label", lab); tb.title = lab;
  $("#notice").innerHTML = `${ic("info", "")}<span>${boldFirst(t("Not legal advice. Public sources only, not reviewed by a lawyer. Plain-English summaries are written by AI."))}</span>
    <button class="linkbtn" data-act="guide">${te("How to read an answer")}</button>`;
}
/* Footer: totals (rules, source documents, addresses, answers on the default date), the standing disclaimer and the links. */
function renderFoot() {
  const answers = Object.values(allAt(DEFAULT_DATE)).reduce((n, e) => n + e.length, 0);
  const docs = new Set(); for (const r of RULES) { docs.add(r.source_doc_id); for (const s of r.supporting_sources || []) docs.add(s.doc_id); }
  $("#foot").innerHTML = `<div>${te("{rules} rules from {docs} source documents. {addrs} sample addresses. {answers} answers as of {date}.", { rules: RULES.length, docs: docs.size, addrs: ADDR.length, answers: num(answers), date: fmtDate(DEFAULT_DATE) })}</div>
  <div style="margin-top:6px">${te("Not legal advice. Rules were read from public web pages and statutes on the dates shown on each rule. Parcel facts come from public assessor datasets. Check the source before you rely on any answer.")}</div>
  <div class="fl"><span>${te("Data built {date}", { date: ((D.meta && D.meta.generated_at) || "").slice(0, 10) })}</span>
    <a href="https://github.com/Ahmadkonainah/hack-nation-pioneer" target="_blank" rel="noopener">${te("Source code")}</a>
    <a href="https://github.com/Ahmadkonainah/hack-nation-pioneer/issues" target="_blank" rel="noopener">${te("Report a mistake or a missing rule")}</a>
    <span>${te("No cookies. No tracking. Nothing you type leaves this page.")}</span></div>`;
}
/* The sticky header's height goes into a CSS variable so "scroll into view" and the sticky picker leave room for it. 0 when the header is not sticky (phones). */
function setTopbar() {
  const top = $("#top");
  const h = getComputedStyle(top).position === "sticky" ? top.getBoundingClientRect().height : 0;
  document.documentElement.style.setProperty("--topbar", Math.ceil(h) + "px");
}
/* A box that scrolls sideways (the wide tables and the timeline on a phone) must be reachable by keyboard, or a keyboard user cannot read the hidden part.
   So when a box really overflows it gets tabindex, a region role and a name (from its data-label); when it fits, none of that, so wide screens get no extra tab stops. */
function markScrollers() {
  for (const el of document.querySelectorAll(".tablewrap[data-label], .gantt[data-label]")) {
    if (el.scrollWidth > el.clientWidth + 1) { el.tabIndex = 0; el.setAttribute("role", "region"); el.setAttribute("aria-label", el.dataset.label); }
    else { el.removeAttribute("tabindex"); el.removeAttribute("role"); el.removeAttribute("aria-label"); }
  }
}
/* Draw the whole current view from S. */
function render() {
  renderChrome();
  const v = $("#view");
  if (S.tab === "lookup") renderLookup(v);
  else if (S.tab === "changes") renderChanges(v);
  else if (S.tab === "map") renderMap(v);
  else renderRulesTab(v);
  setTopbar();
}
/* Switch tab, redraw, put the tab in the URL, and (unless told not to) scroll to the top. */
function go(tab, scrollTop) {
  stopPlay();
  S.tab = tab;
  render();
  syncHash();
  if (scrollTop !== false) window.scrollTo({ top: 0 });
}
/* Apply the language to the page itself: the document language (for screen readers, hyphenation and the browser) and the tab title. */
function applyLang() {
  document.documentElement.lang = S.lang;
  document.title = t("Stackwise: which rental laws apply here?");
}
/* Copy typed-in fact fields into S.wi. The change event normally does this, but a language switch can arrive first
   (some browsers do not move focus when a button is clicked), and the typed text must survive the redraw. */
function flushWi() {
  const y = $("#wi-year"), u = $("#wi-units"), o = $("#wi-owner");
  if (!y || !u || !o) return;
  if (y.value || u.value || o.value || S.wi[S.addr]) S.wi[S.addr] = { year: y.value, units: u.value, owner: o.value };
}
/* Change language and redraw the current view. Address, date, typed facts, tab and filters all live in S, so none is lost. */
function setLang(l) {
  if (!HAS_ES || (l !== "en" && l !== "es") || l === S.lang) return;
  flushWi();
  S.lang = l;
  applyLang();
  const y = window.scrollY;
  renderFoot();
  render();
  syncHash();
  window.scrollTo(0, y);
  $("#live").textContent = t("Language: English.");
  const b = $('#langs button[data-lang="' + l + '"]');
  if (b) b.focus({ preventScroll: true });
}

/* ------------------------------------------------------------------ lookup */
/* The guide opens on the first visit and can be closed; it holds the three steps and what each result label means. */
function guideHtml() {
  return `<details class="guide" id="guide" ${S.guide ? "open" : ""}><summary>${te("How to read an answer")} <span class="muted">${te("Pick a building, choose a date, read the bottom line. Five labels explain every result.")}</span></summary><div class="guide-body">
    <div><h2>${te("Three steps")}</h2><ol class="steps">
      <li>${te("Pick a sample address, or describe your own building.")}</li>
      <li>${te("Choose the date. Every answer is worked out for that day.")}</li>
      <li>${te("Read the bottom line. Open any rule to see the exact words of the law and its source.")}</li></ol></div>
    <div><h2>${te("What the labels mean")}</h2><ul class="legend-list">${RES_ORDER.map((k) => `<li>${chipHtml(k)}<span>${esc(resHelp(k))}</span></li>`).join("")}</ul></div>
    <p class="guide-note"><b>${te("Unknown is an answer, not an error.")}</b> ${te("When the data cannot say, we say so instead of guessing. Every rule links to its source.")}</p>

}
/* The lookup tab: guide, phone picker button, then the two columns (picker | answer). Redrawn when the mode or language changes. */
function renderLookup(v) {

    <button class="pick-toggle" data-act="picker" aria-expanded="${S.pickerOpen}" aria-controls="side"><span class="t"><span class="s">${te("Choose another address or describe your own building")}</span></span><span class="a" aria-hidden="true">${S.pickerOpen ? te("Close") : te("Open")}</span></button>
    <div class="bench">

        </div>
        <div class="pickbody" id="pickBody"></div>

      <section id="answer"></section></div>`;

/* Left column: the 500 sample addresses, or the one-field form for a building the person describes. */
function renderPicker() {
  const b = $("#pickBody");
  if (S.mode === "own") {
    const groups = {};
    for (const x of ownPlaces()) (groups[x.group] = groups[x.group] || []).push(x);
    b.innerHTML = `<div class="own"><p class="muted">${te("Describe a building that is not in the sample. Pick where it is, then type what you know in the box called \"Describe your building\".")}</p>
      <label>${te("Where is the building?")}<select id="own-place">${Object.entries(groups).map(([g, xs]) => `<optgroup label="${esc(g)}">${xs.map((x) => `<option value="${esc(x.key)}" ${x.key === S.ownPlace ? "selected" : ""}>${esc(x.label)}</option>`).join("")}</optgroup>`).join("")}</select></label>
      <p class="muted">${te("Only these places have rules in this prototype. Nothing is looked up, and nothing you type is sent anywhere.")}</p></div>`;
  } else {
    b.innerHTML = `<div><div class="eyebrow">${te("Sample addresses")}</div>
      <input class="search" id="q" type="search" placeholder="${te("Search street, city, zip or ID")}" autocomplete="off" aria-label="${te("Search the sample addresses")}" value="${esc(S.q)}"></div>
      <div class="chips" id="cityChips"></div><div class="alist" id="alist"></div>`;

}
/* Open or close the address picker on phones (it is collapsed by default there). aria-expanded carries the state for assistive
   technology. The visible Open/Close word on the toggle is drawn by renderLookup, so it updates on the next redraw. */
function setPicker(open) {
  S.pickerOpen = open;
  const side = $("#side"), tg = $(".pick-toggle");
  if (side) side.classList.toggle("collapsed", !open);
  if (tg) tg.setAttribute("aria-expanded", String(open));
}
/* City filter chips, one per city with its address count, plus "All". */
function renderCityChips() {
  const counts = {};
  for (const a of ADDR) counts[cityOf(a)] = (counts[cityOf(a)] || 0) + 1;
  const items = [["all", t("All {n}", { n: ADDR.length })]].concat(CITIES.map((c) => [c, `${cityShort(c)} ${counts[c]}`]));
  $("#cityChips").innerHTML = items.map(([k, l]) => `<button class="fchip" data-act="city" data-city="${esc(k)}" aria-pressed="${S.city === k}">${esc(l)}</button>`).join("");
}
/* The sample addresses that match the city chip and the search box (street, postal city, zip or ID). */
function filteredAddrs() {
  const q = S.q.trim().toLowerCase();
  return ADDR.filter((a) => (S.city === "all" || cityOf(a) === S.city) &&
    (!q || `${a.street} ${a.postal_city} ${a.zip} ${a.id}`.toLowerCase().includes(q)));
}
/* The address list, 60 at a time (S.shown) so the page stays light. Redrawn on every keystroke in the search box. */
function renderList() {
  const list = filteredAddrs();
  const part = list.slice(0, S.shown);
  const el = $("#alist");

/* How many entries have each result: { applies: n, superseded: n, ... }. */
function resultCounts(entries) {

}
/* Facts a person types in. Parsed here, applied by the engine (NE.applyWhatIf), never stored anywhere.

function wiOf(a) {
  const x = S.wi[a.id];
  if (!x) return null;
  const w = {};
  const y = /^\d{4}$/.test((x.year || "").trim()) ? +x.year.trim() : null;
  if (y !== null && y >= 1700 && y <= 2100) w.year_built = y;

  if (n !== null && n > 0) w.units = n;

const unitsText = (f) => (f.units_lo == null ? null : f.units_lo === f.units_hi ? `${f.units_lo}` : f.units_hi == null ? t("{lo} or more", { lo: f.units_lo }) : t("{lo} to {hi}", { lo: f.units_lo, hi: f.units_hi }));

const orJoin = (xs) => (xs.length === 2 ? t("{a} or {b}", { a: xs[0], b: xs[1] }) : xs.join(""));

const badYearMsg = (x) => (x.year && !/^\d{4}$/.test(x.year.trim()) ? t("Year built needs four digits, for example 1975.") : "");

/* ------------------------------------------------------------------ time scrubber */
/* A slider over 2024 to 2027. Dragging it, pressing Play or stepping to the next change moves the answer date; the same engine

const DAY_MS = 86400000;
const SC_START = NE.parseDate("2024-01-01"), SC_END = NE.parseDate("2028-01-01");
const SC_DAYS = Math.round((SC_END - SC_START) / DAY_MS);
const SC_SPEED = 150;                           // days per second while playing: the whole range in about 10 seconds
const dayIndex = (iso) => { const ms = NE.parseDate(iso); return ms === null ? 0 : Math.min(SC_DAYS, Math.max(0, Math.round((ms - SC_START) / DAY_MS))); };

let playHandle = 0, playReduced = false;
/* The answers for an address on a date, with any typed-in facts applied (the same rule renderBody uses). */
function entriesAt(a, iso) { const w = wiOf(a); return (w ? NE.lookupAddress(addrInput(a), RULES, iso, w) : lookupOne(a, iso)).entries; }

function changeDays(a) {

    if (ms === null || ms < SC_START || ms > SC_END) continue;
    const day = Math.round((ms - SC_START) / DAY_MS);
    if (!by.has(day)) by.set(day, []);

/* The cheap parts of a date change: the date itself, the slider, the date box, the quick buttons. No answers are redrawn here. */
function paintDate(iso) {

  const wh = $("#scrubWhen"); if (wh) wh.textContent = fmtDate(iso);

/* While dragging or playing: redraw the answers only when some answer actually changed on the way. */
function scrubTo(iso) {

/* A finished move (slider released, step button): redraw everything, announce it and write the URL. */
function setAnswerDate(iso) { paintDate(iso); renderBody(false); }
/* One line under the slider: the next day a rule for this address starts after the chosen date. */
function renderScrubHint() {
  const el = $("#scrubNext"); if (!el) return;
  const next = changeDays(byAddr[S.addr]).find((c) => c.day > dayIndex(S.date));
  el.textContent = next
    ? t("Next change: {date}. {what}", { date: fmtDate(isoOfDay(next.day), true), what: next.titles.length === 1 ? next.titles[0] : tn(next.titles.length, "{n} rule starts", "{n} rules start") })

}
function stepChange(dir) {
  stopPlay();

}
/* Stop playing and put the Play button back. Does not redraw the answers (pausePlay does). */
function stopPlay() {
  if (playHandle) { if (playReduced) clearInterval(playHandle); else cancelAnimationFrame(playHandle); }
  playHandle = 0; S.playing = false;

}
function pausePlay() { stopPlay(); renderBody(false); }
/* Play: sweep forward from the chosen date at SC_SPEED days a second. With "reduce motion" on, no sweep: jump from change to change every 1.6 s. */
function startPlay() {
  stopPlay();
  S.playing = true;
  const b = $("#playBtn"); b.setAttribute("aria-pressed", "true"); b.innerHTML = `${ic("pause")} ${te("Pause")}`;
  playReduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let day = dayIndex(S.date);
  if (day >= SC_DAYS - 1) { day = 0; scrubTo(isoOfDay(0)); }
  if (playReduced) {
    playHandle = setInterval(() => {
      const next = changeDays(byAddr[S.addr]).find((c) => c.day > dayIndex(S.date));
      if (!next) { pausePlay(); return; }
      scrubTo(isoOfDay(next.day));

  };

}
/* The right column. Two layers on purpose: renderAnswer draws the panel (title, facts, date, the what-if FIELDS) and an empty #ansBody;

/* Everything under the panel: the what-if note, the bottom line, the result filter chips, and the rule cards grouped by topic.

    RES_ORDER.map((k) => `<button class="sumchip" data-act="resf" data-res="${k}" aria-pressed="${S.res === k}" ${counts[k] ? "" : 'data-zero="1"'}>${chipHtml(k)}<span class="num">${counts[k]}</span></button>`).join("") +
    `</div>`);

    list: RES_ORDER.filter((k) => counts[k]).map((k) => t(RES_COUNT[k], { n: counts[k] })).join(", "),

/* The answer first: one block per topic, before the detail cards. Each row lists, per result, up to two rule names and "and N more". Click jumps to the topic. */

/* The one Spanish sentence about a result. Built from fixed templates (not from the English engine text) and the card's own data. Plain text. */
function resultSentence(e, r, by) {
  if (e.result === "applies") return t("According to the available data, this rule applies to this building.");
  if (e.result === "superseded") return by ? t("A stricter local rule governs here: {title}.", { title: titleOf(by) }) : t("A stricter local rule governs here.");
  if (e.result === "not_yet_effective") return r.effective_date ? t("It is not in force yet. It takes effect on {date}.", { date: fmtDate(r.effective_date, true) }) : t("It is not in force yet. Its start date is not stated.");
  if (e.result === "pending") return t("It is a bill. It is not law yet.");
  return t("Cannot be determined: building data is missing (for example, the year built). Type it above to resolve it.");
}
/* Main text of a card in the Spanish view: the plain-language summary (if this rule has one), the one result sentence, and the

function spanishSummary(e, r, by) {

  h += `<p class="answer">${esc(resultSentence(e, r, by))}</p>`;

  if (!(x && x.plain_es) && r.plain_en) h += `<p class="answer muted">${EN_TAG()}<span lang="en">${esc(r.plain_en)}</span></p>`;
  return h;
}
/* One rule card: result chip and facts line, title, key value, the answer text, flags, and the "show the law" disclosure with the exact words and source.

/* Copy the current answer (with typed facts, if any) as JSON. The keys are machine names, so the JSON is the same in both languages. */
function copyJson() {
  const a = byAddr[S.addr];
  const w = wiOf(a);
  const out = w ? NE.lookupAddress(addrInput(a), RULES, S.date, w) : lookupOne(a, S.date);
  const payload = { address_id: a.id, as_of: S.date, ...(a.own ? { place: a.city || a.state } : {}), ...(w ? { facts_entered_by_user: w } : {}), lookups: out.entries.map((e) => ({ team_rule_id: e.team_rule_id, result: e.result, explanation: e.explanation, conflict_flag: e.conflict_flag })) };
  const text = JSON.stringify(payload, null, 2);

}
/* Clipboard access can be refused (older browsers, embedded frames); say so instead of failing silently. */
function copyText(text, okMsg) {
  const done = (ok) => { const c = $("#copied"); if (c) c.textContent = ok ? okMsg : t("Copy was blocked here. Select the text on the page instead."); };
  try { navigator.clipboard.writeText(text).then(() => done(true), () => done(false)); } catch (e) { done(false); }
}
/* ---- deep links: the address (or own building), date, typed facts and language live in the URL hash, so an answer can be shared by copying the link. ----
   A hash, not a query string: the browser never sends it to a server, it works when the page is opened from a file, and changing it does not reload the page. */
/* Write S into the hash with replaceState (no new history entry per keystroke). Format: #tab?a=ID&d=DATE&y=YEAR&u=UNITS&o=yes|no&lang=es */
function syncHash() {
  const q = new URLSearchParams();
  if (S.tab === "lookup") {
    if (S.mode === "own") q.set("own", S.ownPlace); else q.set("a", S.addr);
    if (S.date !== DEFAULT_DATE) q.set("d", S.date);
    const x = S.wi[S.addr];
    if (x) { if (x.year) q.set("y", x.year); if (x.units) q.set("u", x.units); if (x.owner) q.set("o", x.owner); }
  }
  if (S.lang === "es") q.set("lang", "es");
  const qs = q.toString();
  const h = "#" + S.tab + (S.tab === "lookup" || qs ? "?" + qs : "");
  try { history.replaceState(null, "", h); } catch (e) { /* sandboxed frame: sharing a link is then not possible, nothing else breaks */ }
}
/* Read the hash once at start-up into S. Every value is checked (known tab, known address, real date, short typed text), so a bad link falls back to the defaults. */
function readHash() {
  const [tab, qs] = (location.hash || "").replace(/^#/, "").split("?");
  if (TABS.some(([k]) => k === tab)) S.tab = tab;
  const q = new URLSearchParams(qs || "");
  const own = q.get("own"), id = q.get("a"), d = q.get("d");
  if (own && ownPlaces().some((x) => x.key === own)) { S.ownPlace = own; S.mode = "own"; syncOwn(); S.addr = OWN_ID; S.wiOpen = true; S.guide = false; }
  else if (id && byAddr[id]) { S.addr = id; S.lastSample = id; S.guide = false; }
  if (d && /^\d{4}-\d{2}-\d{2}$/.test(d) && NE.parseDate(d) !== null) S.date = d;
  const y = (q.get("y") || "").slice(0, 4), u = (q.get("u") || "").slice(0, 5), o = q.get("o");
  if (y || u || o === "yes" || o === "no") S.wi[S.addr] = { year: y, units: u, owner: o === "yes" || o === "no" ? o : "" };
  if (q.get("lang") === "es" && HAS_ES) S.lang = "es";
}

/* How many of the given addresses are in each city, biggest first: [[city, count], ...]. */
function cityBreakdown(ids) {
  const c = {};
  for (const id of ids) { const k = cityOf(byAddr[id]); c[k] = (c[k] || 0) + 1; }
  return Object.entries(c).sort((x, y) => y[1] - x[1]);
}
/* A test's note from changes.json, with the machine word "not_yet_effective" spelled out and the repeated title cut off.
   This is English text written by the pipeline; the Spanish view shows it under the "(in English)" label, not translated. */
function cleanNote(tc) {
  let n = String(tc.notes || "").replace(/not_yet_effective/g, "not yet effective");
  const ti = String(tc.title || "");
  if (ti && n.startsWith(ti)) n = n.slice(ti.length).replace(/^[.:]\s*/, "");
  return n;
}
/* The example buttons on a test card: each opens one address on one date. label is a source string with {placeholders} filled from vars at draw time. */
function testExamples(tc) {

    return [{ label: "Before {date}", vars: { date: tc.dates.before }, id, date: tc.dates.before }, { label: "After {date}", vars: { date: tc.dates.after }, id, date: tc.dates.after }];
  }
  if (tc.type === "boundary") {
    const ex = [];
    for (const rid of tc.team_rule_ids) { const r = byRule[rid]; const a = r && firstIn(r.jurisdiction); if (a) ex.push({ label: "{city} address", vars: { city: r.jurisdiction.replace(/, [A-Z]{2}$/, "") }, id: a.id, date: DEFAULT_DATE }); }
    const n = firstIn("Newark, NJ"); if (n) ex.push({ label: "Newark address (no ban)", id: n.id, date: DEFAULT_DATE });
    return ex;
  }
  if (tc.type === "pending") return ids.length ? [{ label: "A Massachusetts address", id: ids[0], date: DEFAULT_DATE }] : [];
  const b = firstIn("Boston, MA");
  return b ? [{ label: "A Boston address", id: b.id, date: DEFAULT_DATE }] : [];
}
/* Compare every rule's answer at every address on two dates. Returns the rows that differ (rule, result before, result after, which addresses),
   biggest first, plus how many answers were compared and how many stayed the same. A rule missing on one date counts as "not_listed". */
function diffDates(A, B) {
  const ra = allAt(A), rb = allAt(B), map = new Map();
  let same = 0, total = 0;
  for (const a of ADDR) {
    const ea = new Map(ra[a.id].map((e) => [e.team_rule_id, e.result]));
    const eb = new Map(rb[a.id].map((e) => [e.team_rule_id, e.result]));
    for (const id of new Set([...ea.keys(), ...eb.keys()])) {
      const from = ea.get(id) || "not_listed", to = eb.get(id) || "not_listed";
      total++;
      if (from === to) { same++; continue; }
      const k = `${id}|${from}|${to}`;
      if (!map.has(k)) map.set(k, { id, f: from, t: to, addrs: [] });
      map.get(k).addrs.push(a.id);
    }
  }
  return { rows: [...map.values()].sort((x, y) => y.addrs.length - x.addrs.length), same, total };
}
