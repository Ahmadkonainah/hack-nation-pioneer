<style>
/* Layout: sticky header with a permanent legal-notice strip; Lookup is a two-column workbench (address list | answer),
   the other tabs are single-column readouts. Palette is cool paper and ink with one teal accent; result colors are semantic. */
/* ---- design tokens: light theme. Result colors (--applies, --superseded ...) are semantic; each has a text color and a tint
   background. The axe contrast check is run on both themes after any change to these values. ---- */
:root {
  --bg: #F3F5F7; --surface: #FFFFFF; --surface2: #E9EDF1; --ink: #14202B; --muted: #566471; --line: #D5DDE4;
  --accent: #0B6A78; --accent-weak: #DCEFF2; --on-accent: #FFFFFF;
  --applies: #18794A; --applies-bg: #DFF3E7;
  --superseded: #6446B0; --superseded-bg: #EAE4F8;
  --unknown: #9A5B00; --unknown-bg: #FFEFD0;
  --not_yet_effective: #1D5BC8; --not_yet_effective-bg: #DFEAFB;
  --pending: #4F5D6B; --pending-bg: #E6EAEE;
  --none: #B7C2CC;
  --flag: #B42318; --flag-bg: #FDE8E6;
  --font-ui: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-law: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
/* ---- dark theme. The same tokens are written twice on purpose: once for people whose system is dark (unless they picked light
   with the button), once for people who picked dark with the button. CSS cannot share one block between a media query and an attribute selector. ---- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D141B; --surface: #151E27; --surface2: #1C2733; --ink: #E6EDF3; --muted: #9DABB8; --line: #2A3846;
    --accent: #56C2D0; --accent-weak: #12343A; --on-accent: #06242A;
    --applies: #5BD08F; --applies-bg: #12301F; --superseded: #B49CF2; --superseded-bg: #271F42;
    --unknown: #F2B24A; --unknown-bg: #3A2A08; --not_yet_effective: #7FAEF5; --not_yet_effective-bg: #14284A;
    --pending: #A9B6C3; --pending-bg: #222E3A; --none: #4A5968; --flag: #FF8A80; --flag-bg: #3D1613;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D141B; --surface: #151E27; --surface2: #1C2733; --ink: #E6EDF3; --muted: #9DABB8; --line: #2A3846;
  --accent: #56C2D0; --accent-weak: #12343A; --on-accent: #06242A;
  --applies: #5BD08F; --applies-bg: #12301F; --superseded: #B49CF2; --superseded-bg: #271F42;
  --unknown: #F2B24A; --unknown-bg: #3A2A08; --not_yet_effective: #7FAEF5; --not_yet_effective-bg: #14284A;
  --pending: #A9B6C3; --pending-bg: #222E3A; --none: #4A5968; --flag: #FF8A80; --flag-bg: #3D1613;
  color-scheme: dark;
}
/* ---- base ---- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--font-mono); font-size: 0.86em; }
.muted { color: var(--muted); }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; }

/* ---- header: brand, tabs, language toggle, theme button, legal notice ---- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brandtext { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; }
.mark { width: 28px; height: 28px; flex: none; }
.brand h1 { font-size: 19px; letter-spacing: -0.01em; margin: 0; line-height: 1.1; }
.brand span { color: var(--muted); font-size: 13px; }
.skip { position: absolute; left: 8px; top: -48px; background: var(--ink); color: var(--bg); padding: 8px 12px; border-radius: 8px; z-index: 50; text-decoration: none; font-weight: 600; }
.skip:focus { top: 8px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.tab .short { display: none; }
@media (max-width: 720px) { .tab .full { display: none; } .tab .short { display: inline; } }
.tab { border: 0; background: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 500; }
.tab:hover { background: var(--surface2); color: var(--ink); }
.tab[aria-current="page"] { background: var(--accent-weak); color: var(--accent); font-weight: 600; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 36px; height: 36px; display: inline-grid; place-items: center; cursor: pointer; color: var(--muted); padding: 0; }
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.icon-btn svg { width: 18px; height: 18px; }
.langs[hidden] { display: none; }
.langs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.langs button { border: 0; background: var(--surface); padding: 0 10px; height: 34px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 13px; }
.langs button[aria-pressed="true"] { background: var(--accent-weak); color: var(--accent); }
/* The legal notice is permanent but calm: a neutral strip with an icon, not an alarm. */
.notice { background: var(--surface2); color: var(--ink); border-top: 1px solid var(--line); font-size: 13px; }
.notice .wrap { padding-block: 7px; display: flex; gap: 4px 14px; align-items: center; }
.notice svg { width: 16px; height: 16px; flex: none; color: var(--accent); }
.notice b { font-weight: 700; }
.notice .linkbtn { white-space: nowrap; margin-left: auto; font-size: 13px; }
.ico { width: 1em; height: 1em; flex: none; vertical-align: -0.12em; }

/* ---- page frame and shared type ---- */
main { padding-block: 20px 56px; }
h1, h2, h3, h4 { line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 22px; }
h3 { font-size: 17px; }
.lede { color: var(--muted); max-width: 70ch; margin: 6px 0 0; }
.section-head { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
.eyebrow { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* ---- lookup layout: address picker (left) and answer (right) ---- */
.bench { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .bench { grid-template-columns: minmax(0, 1fr); } }
.side { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; position: sticky; top: calc(var(--topbar, 112px) + 8px); max-height: calc(100vh - var(--topbar, 112px) - 24px); display: flex; flex-direction: column; gap: 10px; min-height: 0; }
@media (max-width: 900px) { .side { position: static; max-height: none; } }
.search { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.fchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.alist { overflow: auto; margin: 0 -4px; padding: 0 4px; display: flex; flex-direction: column; gap: 2px; min-height: 120px; max-height: 60vh; }
@media (min-width: 901px) { .alist { max-height: none; flex: 1 1 auto; } }
.aitem { text-align: left; border: 1px solid transparent; background: none; border-radius: 8px; padding: 7px 9px; cursor: pointer; display: block; width: 100%; }
.aitem:hover { background: var(--surface2); }
.aitem[aria-current="true"] { background: var(--accent-weak); border-color: var(--accent); }
.aitem .s { font-weight: 600; font-size: 13.5px; overflow-wrap: anywhere; }
.aitem .m { font-size: 12px; color: var(--muted); }

/* ---- answer panel: title, jurisdiction stack, building facts, date controls, summary chips ---- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
/* The address is the answer's h2 (so the topic h3 headings below it are not a jump from h1). line-height and text-wrap are reset to what the plain div had. */
.addr-title { font-size: 26px; font-weight: 700; letter-spacing: -0.015em; overflow-wrap: anywhere; line-height: 1.5; text-wrap: wrap; }
.stack { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; margin-top: 14px; }
.layer { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 12px; min-width: 150px; flex: 1 1 150px; }
.layer .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.layer .v { font-weight: 600; }
.layer .n { font-size: 12.5px; color: var(--muted); }
.arrow { align-self: center; color: var(--muted); }
@media (max-width: 640px) {
  .arrow { display: none; }
  .stack { flex-direction: column; gap: 6px; }
  .layer { flex: none; min-width: 0; display: grid; grid-template-columns: 62px minmax(0, 1fr); column-gap: 8px; align-items: baseline; padding: 7px 10px; }
  .layer .n { grid-column: 2; }
}
.basis { margin-top: 10px; font-size: 13px; color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
.fact { border-top: 2px solid var(--line); padding-top: 6px; min-width: 0; }

<script>
/**
 * Rental Housing Law Navigator - lookup engine (the browser-side JavaScript twin of src/engine.py).
 * Not legal advice.
 *
 * WHAT IT DOES
 *   Given one address (its state, legal city and building facts), a bundle of rules and an "as of" date, it decides
 *   for every rule that could reach that address whether the rule applies there on that date, and writes the
 *   plain-English explanation the app shows. It is pure: no network, no clock, no storage, no DOM. The same inputs
 *   always give the same answer. Facts a person types into "what if I know more" are used in memory only.
 *
 * SAME ANSWERS AS PYTHON (important)
 *   This file must produce exactly the same answers as src/engine.py (and src/dates.py for the date helpers):
 *   the same result, the same explanation text down to the punctuation, the same conflict flag, the same confidence.
 *   src/parity_test.py runs both engines on every sample address for 14 dates (7,000 comparisons) and on 8 sets of
 *   what-if facts (4,000 comparisons) and fails on any difference. If you change logic or wording here, make the
 *   identical change in engine.py, then run the parity test.
 *
 * THREE-VALUED LOGIC
 *   Every test gives true (met), false (not met) or null (unknown: a fact needed to decide is missing).
 *   null is never turned into a yes or a no. It travels through AND / OR / NOT (tAnd, tOr, tNot) so a missing fact
 *   ends up as "unknown" in the result, with a sentence naming the missing fact. It is only overridden when another
 *   test already settles the answer (a false inside an AND, a true inside an OR). Unknown beats a guess.
 *
 * RESULT VALUES (one per rule per address), in RESULT_ORDER
 *   applies            in force on the as-of date and the building is covered
 *   superseded         would apply, but a stricter rule that applies here displaces it (the answer points to that rule)
 *   not_yet_effective  enacted, but its effective date is after the as-of date
 *   pending            only a bill so far; not law
 *   unknown            cannot be decided from the data (missing year built, unit count, owner-occupancy, special
 *                      status, an unverified city, or a displacing rule that is itself uncertain)
 *   A rule that definitely does not cover the building, or that failed (struck down, defeated), gets no entry at all.
 *
 * FACTS AND RULES (shapes the functions expect; the bundle is built by src/build_web.py from the Python side)
 *   facts: {year_built, units_lo, units_hi, units_basis, use_code, use_description, owner_occupied?}
 *          units_hi null means "no upper bound" (for example "five or more units"). Missing values are null.
 *   rule:  {team_rule_id, jurisdiction, level, legal_state, effective_date, overrides, cov, ...}
 *          cov = {scope, conditions: [...], exemptions: [{label, conditions: [...]}]}
 */
(function (root) {
  "use strict";
  /* The project's default "today". It is fixed, not read from the system clock, so answers are repeatable and match
     the shipped lookups.json. Same value as QUERY_DATE in src/dates.py. */
  const QUERY_DATE = "2026-10-01";
  /* The five possible results, in the order the app lists them. */
  const RESULT_ORDER = ["applies", "superseded", "not_yet_effective", "pending", "unknown"];

  /**
   * Read "YYYY", "YYYY-MM" or "YYYY-MM-DD" as a date. A partial date means the first day of that period.
   * @param {string|null|undefined} s date text from a rule or from the as-of box
   * @returns {number|null} UTC-midnight timestamp in milliseconds, or null if it is not a real date
   */
  function parseDate(s) {
    const m = /^(\d{4})(?:-(\d{2})(?:-(\d{2}))?)?$/.exec(String(s || "").trim());
    if (!m) return null;
    const y = +m[1], mo = +(m[2] || 1), d = +(m[3] || 1);
    // Dates are kept as UTC-midnight numbers, so "before" and "after" are plain number comparisons with no time-zone
    // or daylight-saving shift. (Same order as comparing ISO "YYYY-MM-DD" text, which iso() produces for display.)
    const t = Date.UTC(y, mo - 1, d), dt = new Date(t);
    // Date.UTC quietly rolls 2026-02-31 over to March 3. Reading the parts back catches that, so an impossible date
    // is unknown (null), never a guess. Python gets the same result from date() raising ValueError.
    if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) return null;
    return t;
  }
  /**
   * Move a date back by n whole years, for rolling tests such as "first occupied at least 15 years before the as-of date".
   * @param {number} t UTC-midnight timestamp
   * @param {number} n years to go back
   * @returns {number} UTC-midnight timestamp; 29 February becomes 28 February when the earlier year has no 29th
   */
  function minusYears(t, n) {
    const dt = new Date(t), y = dt.getUTCFullYear() - n, m = dt.getUTCMonth(), d = dt.getUTCDate();
    let r = Date.UTC(y, m, d);
    // If the month changed, the day did not exist in that year (29 Feb) and JS rolled into March: use 28 Feb, as Python does.
    if (new Date(r).getUTCMonth() !== m) r = Date.UTC(y, m, 28);
    return r;
  }
  /* Timestamp -> "YYYY-MM-DD". Matches Python's date.isoformat(), so dates inside explanation sentences are identical. */
  const iso = (t) => new Date(t).toISOString().slice(0, 10);

  /**
   * Whether a rule is in force on a date. Computed by code from dates, never written by the model.
   * @param {string} legalState what the law is: "enacted", "pending" (a bill) or "failed"
   * @param {string|null} effectiveDate rule start date, "YYYY", "YYYY-MM" or "YYYY-MM-DD"
   * @param {string} asOf the date being asked about
   * @returns {"failed"|"pending"|"not_yet_effective"|"in_force"}
   */
  function statusAt(legalState, effectiveDate, asOf) {
    // The legal state wins over the dates: a failed measure is never in force, and a bill's effective date is only a hope.
    if (legalState === "failed") return "failed";
    if (legalState === "pending") return "pending";
    const eff = parseDate(effectiveDate), asof = parseDate(asOf);
    // An enacted rule with a missing or unreadable effective date counts as already in force; only a readable date
    // after the as-of date holds it back.
    if (eff !== null && asof !== null && asof < eff) return "not_yet_effective";
    return "in_force";
  }

  /* Three-valued AND / OR / NOT over true, false and null (unknown).
     A definite answer beats an unknown one: AND with any false is false, OR with any true is true, even if other tests
     are unknown. Otherwise one unknown makes the whole answer unknown, so a missing fact is never silently read as yes
     or no. An empty AND is true and an empty OR is false. */
  const tAnd = (v) => (v.some((x) => x === false) ? false : v.some((x) => x === null) ? null : true);
  const tOr = (v) => (v.some((x) => x === true) ? true : v.some((x) => x === null) ? null : false);
  const tNot = (v) => (v === null ? null : !v);

  /**
   * Compare a building's year built with a cut-off date. We only know the year, not the day, so the building could
   * have been first occupied any time from 1 January to 31 December of that year.
   * @param {"on_or_before"|"before"|"after"|"on_or_after"} op how the building's date must relate to the cut-off
   * @param {number} y year built
   * @param {number} T cut-off, UTC-midnight timestamp
   * @returns {true|false|null} true or false only if the whole year is on one side of the cut-off; null if the
   *   cut-off falls inside that year (the certificate-of-occupancy date would be needed) or op is not recognised
   */
  function cmpDateYear(op, y, T) {
    const lo = Date.UTC(y, 0, 1), hi = Date.UTC(y, 11, 31);
    if (op === "on_or_before") return hi <= T ? true : lo > T ? false : null;
    if (op === "before") return hi < T ? true : lo >= T ? false : null;
    if (op === "after") return lo > T ? true : hi <= T ? false : null;
    if (op === "on_or_after") return lo >= T ? true : hi < T ? false : null;
    return null;
  }
  /**
   * Compare a building's unit count with a number. The count is often only a range (for example "five or more").
   * @param {"<="|"<"|">="|">"|"=="|"!="} op
   * @param {number|null} lo fewest units the building can have (null is read as 1)
   * @param {number|null} hi most units it can have; null means no upper bound
   * @param {number} v the number in the rule
   * @returns {true|false|null} true or false only if every count in the range gives the same answer; null if the
   *   range straddles the threshold or op is not recognised
   */
  function cmpUnits(op, lo, hi, v) {
    if (lo === null) lo = 1;
    if (op === "<=") return hi !== null && hi <= v ? true : lo > v ? false : null;
    if (op === "<") return hi !== null && hi < v ? true : lo >= v ? false : null;
    if (op === ">=") return lo >= v ? true : hi !== null && hi < v ? false : null;
    if (op === ">") return lo > v ? true : hi !== null && hi <= v ? false : null;
    if (op === "==") {
      if (lo === hi && hi === v) return true;
      return v < lo || (hi !== null && v > hi) ? false : null;
    }
    if (op === "!=") return tNot(cmpUnits("==", lo, hi, v));
    return null;
  }
  /* How each date operator is worded inside explanation sentences. An operator not listed is printed as it is. */
  const OP_WORDS = { on_or_before: "on or before", before: "before", after: "after", on_or_after: "on or after" };

  /**
   * Test one coverage condition (or one condition of an exemption) against the building's facts.
   * @param {{fact: string, op: string, value: *, years_before_as_of?: number, text?: string}} c the condition
   * @param {object} facts building facts (parcel facts, possibly overridden by what-if facts)
   * @param {string} asOf date being asked about, used by rolling "N years before" tests
   * @param {boolean} inExemption true when the condition belongs to an exemption rather than to the coverage test;
   *   an exemption we cannot check is assumed not to apply, while an unchecked coverage test stays unknown
   * @param {function} ref ref(ruleId) gives another rule's coverage value (true/false/null); ref.title(ruleId) names it
   * @returns {[true|false|null, "fact"|"status"|"caveat"|"note", string]} [value, kind, phrase]. kind says how the
   *   phrase is used: "fact" is a building fact that decided the test or is missing; "status" is a special status
   *   (deed-restricted, subsidised ...) the parcel data can never show; "caveat" is an exemption we assumed away and only
   *   list as "not checked"; "note" is information that does not change the answer.
   */
  function evalCond(c, facts, asOf, inExemption, ref) {
    const fact = c.fact, op = c.op, val = String(c.value == null ? "" : c.value);
    if (fact === "first_occupancy_date") {
      // A rolling test ("at least N years old") moves with the as-of date; otherwise the cut-off is the fixed date in the rule.
      const yrs = parseInt(c.years_before_as_of || 0, 10);
      const T = yrs > 0 ? minusYears(parseDate(asOf), yrs) : parseDate(val);
      if (T === null) return [null, "fact", "a construction-date test could not be read"];
      const need = `first occupied ${OP_WORDS[op] || op} ${iso(T)}`;
      const y = facts.year_built;
      // The phrase says what was needed, so the app can tell the person which fact would settle it.
      if (y === null || y === undefined) return [null, "fact", `${facts.year_basis || "year built is missing in the parcel data"} (needed: ${need})`];
      const v = cmpDateYear(op, y, T);
      // Year built is not a certificate-of-occupancy date: when the cut-off falls inside the build year we cannot tell.
      if (v === null) return [null, "fact", `built ${y}, the same year as the ${iso(T)} cut-off, and the certificate-of-occupancy date is not in the data (needed: ${need})`];
      return [v, "fact", `built ${y}: ${v ? "meets" : "does not meet"} the test (${need})`];
    }
    if (fact === "units") {
      let lo = facts.units_lo, hi = facts.units_hi;
      // A missing key is read as "not known", the same as null (Python's facts always carry the keys).
      if (lo === undefined) lo = null;
      if (hi === undefined) hi = null;
      const n = /^\d+$/.test(val) ? parseInt(val, 10) : null;
      if (n === null) return [null, "fact", "a unit-count test could not be read"];
      const need = `units ${op} ${n}`;
      // units_basis says where the count came from (parcel column, use description, or "entered by you"), so it is quoted.
      if (lo === null) return [null, "fact", `${facts.units_basis || "unit count is missing in the parcel data"} (needed: ${need})`];
      const v = cmpUnits(op, lo, hi, n);
      const have = lo === hi ? `${lo} units` : hi === null ? `${lo} or more units` : `${lo} to ${hi} units`;
      if (v === null) return [null, "fact", `${have} (${facts.units_basis}) is not enough to decide the test ${need}`];
      return [v, "fact", `${have} (${facts.units_basis}): ${v ? "meets" : "does not meet"} the test (${need})`];
    }
    if (fact === "owner_occupied") {
      const oo = facts.owner_occupied;                      // only set when a person types it in (what-if); parcel data never has it
      if (oo === undefined || oo === null) return [null, "fact", "whether an owner lives in the building is not in the parcel data"];
      // A rule value of "false" asks for a building with no owner living in it; any other value asks for one with an owner.
      const want = val.trim().toLowerCase() !== "false";
      const v = op === "is" ? oo === want : oo !== want;
      // Parcel data never records owner-occupancy, so this fact can only come from the person's own what-if input.
      // The wording says "entered by you" so the reader knows the answer rests on what they typed, not on a public record.
      return [v, "fact", `${oo ? "an owner lives" : "no owner lives"} in the building (entered by you): ${v ? "meets" : "does not meet"} the test (owner-occupied)`];
    }
    if (fact === "use_type") {
      // Look for any long word (5+ letters) of the rule's wording inside the parcel's own use description and code.
      const words = new Set(((`${val} ${c.text || ""}`).toLowerCase().match(/[a-z]{5,}/g)) || []);
      const have = `${facts.use_description} ${facts.use_code}`.toLowerCase();
      // A word match is a hint, not proof, so it gives unknown (a person should check), never true.
      for (const w of words) if (have.includes(w)) return [null, "fact", `the parcel's use description ('${facts.use_description}') may match: ${val}`];
      // No match: the sample parcels are assessor-classified housing, so an exemption such as "hotel" or "dormitory" is
      // assumed not to apply and listed as not checked. As a coverage condition the same gap stays unknown.
      if (inExemption) return [false, "caveat", `the building is not a ${val}`];
      return [null, "fact", `whether the building is a ${val} is not in the parcel data`];
    }
    if (fact === "status_not_in_data") {
      // Special status (deed restriction, subsidy, Section 8 ...) cannot be seen in parcel data. As an exemption it is
      // assumed not to apply and listed as not checked, so it never blocks an answer. As a coverage condition it is
      // unknown, but kind "status" tells evalCoverage this is not a missing building fact (see its "hard" flag).
      if (inExemption) return [false, "caveat", `${val || c.text || ""}`];
      return [null, "status", `requires ${val || c.text || ""}, which is not in the parcel data`];
    }
    if (fact === "tenancy") {
      // This depends on the lease, not the building. As a coverage condition it is only a note shown to the reader and
      // does not change the answer (true, kind "note"); as an exemption it is assumed away and listed as not checked.
      if (inExemption) return [false, "caveat", `${val || c.text || ""} (depends on the tenancy)`];
      return [true, "note", `applies to tenancies where: ${val || c.text || ""}`];
    }
    if (fact === "rule_coverage") {
      // "Covered only if another rule covers (or does not cover) this building." The other rule's value is looked up
      // through ref, which is memoised and guards against rules that refer to each other in a circle.
      const other = ref(val);
      const v = op === "is" ? other : tNot(other);
      const title = ref.title(val);
      if (v === null) return [null, "fact", `depends on whether ${title} covers this building, which is not certain`];
      return [v, "fact", `${other ? "covered" : "not covered"} by ${title}`];
    }
    // A condition type this engine does not know is unknown, never guessed.
    return [null, "fact", "an unreadable test"];
  }

  /**
   * Decide whether a rule covers the building: all of its coverage conditions must be true and no exemption may be
   * fully true.
   * @param {{scope?: string, conditions?: object[], exemptions?: {label?: string, conditions?: object[]}[]}} cov
   *   scope "undefined" means the source never says which buildings the rule covers
   * @param {object} facts building facts
   * @param {string} asOf date being asked about
   * @param {function} ref see evalCond
   * @returns {{value: true|false|null, true_facts: string[], false_facts: string[], blockers: string[], caveats: string[],
   *   notes: string[], exempt_by: string|null, ruled_out: string[], hard: boolean}}
   *   value is the coverage answer. The string lists feed the explanation: tests that were met, tests that were not,
   *   what is missing (blockers), exemptions assumed away and not checked (caveats), side notes, the label of the
   *   exemption that applies (exempt_by) and exemptions that known facts rule out (ruled_out). hard is true when an
   *   unknown hinges on a building fact (or an unreadable test) rather than on a special status the data can never show.
   */
  function evalCoverage(cov, facts, asOf, ref) {
    const out = { value: null, true_facts: [], false_facts: [], blockers: [], caveats: [], notes: [], exempt_by: null, ruled_out: [], hard: false };
    const scope = cov.scope || "conditional";
    // The source does not say who is covered, so there is nothing to test: value stays null (unknown).
    if (scope === "undefined") {
      out.blockers.push("the source does not say which buildings this rule covers");
      out.hard = true;
      return out;
    }
    const cvals = [];
    for (const c of cov.conditions || []) {
      const [v, kind, ph] = evalCond(c, facts, asOf, false, ref);
      if (kind === "note") { out.notes.push(ph); continue; }
      cvals.push(v);
      // A missing building fact is "hard": lookupAddress uses it to decide whether another rule's uncertainty can flip an
      // answer. A special status the data cannot show (kind "status") is not hard.
      if (v === null && kind !== "status") out.hard = true;
      (v === true ? out.true_facts : v === false ? out.false_facts : out.blockers).push(ph);
    }
    // All coverage conditions must hold (three-valued AND). No conditions at all means the rule covers every building.
    const covered = cvals.length ? tAnd(cvals) : true;
    // Each exemption is itself an AND of its conditions; the exemptions are then OR-ed (any one fully true exempts).
    const evals = [];
    for (const ex of cov.exemptions || []) {
      const label = ex.label || "an exemption";
      const ev = [], trues = [], falses = [], blocks = [], cav = [];
      const conds = ex.conditions || [];
      // An exemption with no stated test cannot be ruled out, so it stays unknown rather than being ignored.
      if (!conds.length) { evals.push([null, label, [], [], [`${label}: its test is not stated`], []]); out.hard = true; continue; }
      for (const c of conds) {
        const [v, kind, ph] = evalCond(c, facts, asOf, true, ref);
        if (kind === "note") continue;
        ev.push(v);
        if (v === true) trues.push(ph);
        else if (v === false && kind === "caveat") cav.push(ph);
        else if (v === false) falses.push(ph);
        else blocks.push(ph);
      }
      evals.push([ev.length ? tAnd(ev) : null, label, trues, falses, blocks, cav]);
    }
    const exempt = evals.length ? tOr(evals.map((e) => e[0])) : false;
    for (const [v, label, trues, falses, blocks, cav] of evals) {
      if (v === true) {
        out.exempt_by = label;
        out.true_facts.push(...trues);
      } else if (v === false) {
        // An exemption that a known fact rules out is worth saying; one that is only assumed away is a "not checked" caveat.
        if (falses.length) out.ruled_out.push(label);
        if (!falses.length) out.caveats.push(...cav);
      } else {
        if (blocks.length) out.blockers.push(...blocks.map((b) => `${label}: ${b}`));
        else out.blockers.push(label);
        out.caveats.push(...cav);
        out.hard = true;
      }
    }
    // Covered AND NOT exempt. An unknown on either side keeps the answer unknown unless the other side already settles it.
    out.value = tAnd([covered, tNot(exempt)]);
    return out;
  }

  /**
   * Shorten text for use inside a sentence: collapse whitespace, then cut to n characters with an ellipsis.
   * @param {string} s
   * @param {number} [n=60] longest result in characters
   * @returns {string}
   */
  function short(s, n) {
    n = n === undefined ? 60 : n;
    s = String(s || "").replace(/\s+/g, " ").trim();
    return s.length <= n ? s : s.slice(0, n - 1) + "…";
  }
  /* Capitalise the first letter. The phrases are written to sit mid-sentence, so they start in lower case. */
  const cap1 = (s) => s.slice(0, 1).toUpperCase() + s.slice(1);
  /**
   * Join the first few non-empty phrases with "; ". The cap keeps each explanation to a few lines; the full detail
   * stays available in the app's detail cards.
   * @param {string[]} items phrases (empty ones are skipped)
   * @param {number} [n=3] how many phrases to keep
   * @param {number} [width=140] longest single phrase, in characters
   * @returns {string}
   */
  function join(items, n, width) {
    n = n === undefined ? 3 : n;
    width = width === undefined ? 140 : width;
    return items.filter((i) => i).map((i) => short(i, width)).slice(0, n).join("; ");
  }

  /**
   * What the parcel data says about this building, in a few words ("built 1975, at least 5 units"). Empty if nothing is known.
   * @param {object} f building facts
   * @returns {string}
   */
  function factsLine(f) {
    const bits = [];
    if (f.year_built) bits.push(`built ${f.year_built}`);
    const lo = f.units_lo === undefined ? null : f.units_lo, hi = f.units_hi === undefined ? null : f.units_hi;
    if (lo !== null) bits.push(lo === hi ? `${lo} units` : hi === null ? `at least ${lo} units` : `${lo} to ${hi} units`);
    return bits.join(", ");
  }

  /**
   * Overlay facts a person typed in ("what if I know more about this building") on the parcel facts.
   * @param {object} facts parcel facts
   * @param {{year_built?: *, units?: *, owner_occupied?: boolean}|null} w the typed facts; missing, null, blank or
   *   invalid keys leave the parcel fact as it is
   * @returns {object} a new facts object; the parcel facts passed in are never changed
   */
  function applyWhatIf(facts, w) {
    // Work on a copy so the caller can run the engine twice (parcel facts, then typed facts) and show what changed.
    const f = Object.assign({}, facts);
    if (!w) return f;
    // Whole numbers only. Anything else (blank, "abc", "12.5") is ignored instead of throwing, so a half-typed field is harmless.
    const toInt = (v) => (v === null || v === undefined || v === "" || !/^-?\d+$/.test(String(v).trim()) ? null : parseInt(v, 10));
    const y = toInt(w.year_built);
    // Typed values replace the parcel value for the whole run; the range check rejects typos such as 197 or 19750.
    if (y !== null && y >= 1700 && y <= 2100) f.year_built = y;
    const n = toInt(w.units);
    // An exact count replaces any range. units_basis becomes "entered by you" so the explanation credits the person's input.
    if (n !== null && n > 0) { f.units_lo = n; f.units_hi = n; f.units_basis = "entered by you"; }
    // Only a real true or false counts; "yes", 1 or an empty box do not set owner-occupancy.
    if (w.owner_occupied === true || w.owner_occupied === false) f.owner_occupied = w.owner_occupied;
    return f;
  }

  /**
   * Work out which rules apply at one address on one date. This is the main entry point.
   * @param {{address_id: *, state: string, facts: object, city: string|null, basis: string, unverified: string|null}} addr
   *   city is the legal city (null if none); basis says how it was found ("census_geocoder", "city_dataset" or
   *   "unresolved"); unverified is a city named by the parcel data that the geocoder could not confirm
   * @param {object[]} rules bundle rules, each with its coverage test in .cov
   * @param {string} [asOf] date to answer for; defaults to QUERY_DATE
   * @param {object} [whatIf] facts typed in by a person, see applyWhatIf
   * @returns {{address_id: *, as_of: string, city: string|null, city_basis: string, entries: object[]}} one entry per
   *   rule that reaches the address (see makeEntry), sorted by rule id
   */
  function lookupAddress(addr, rules, asOf, whatIf) {
    asOf = asOf || QUERY_DATE;
    // What-if facts are applied once, up front, so every rule (including rules that refer to another rule's coverage)
    // is judged against the same facts.
    const facts = applyWhatIf(addr.facts, whatIf), state = String(addr.state).trim();
    const city = addr.city || null, basis = addr.basis, unverified = addr.unverified || null;
    const byId = new Map(rules.map((r) => [r.team_rule_id, r]));
    // Candidates: statewide rules, rules of the legal city, and rules of the unverified city (in-force ones become unknown in step 1).
    const cands = rules.filter((r) => r.jurisdiction === state || (city && r.jurisdiction === city) || (unverified && r.jurisdiction === unverified));
    const memo = new Map(), stack = new Set();
    // A conflict listed on one rule is recorded for both rules, so each one is flagged.
    const partnersOf = new Map();
    const addP = (a, b) => { if (!partnersOf.has(a)) partnersOf.set(a, new Set()); partnersOf.get(a).add(b); };
    for (const r of rules) for (const o of r._conflicts_with || []) { addP(r.team_rule_id, o); addP(o, r.team_rule_id); }

    /* Coverage value of any rule by id, for conditions of type rule_coverage. Each rule is evaluated once (memo). The
       stack stops circular references: a rule that depends on itself, directly or through others, is unknown (null). */
    function covValue(rid) {
      if (memo.has(rid)) return memo.get(rid).value;
      if (stack.has(rid) || !byId.has(rid)) return null;
      stack.add(rid);
      const r = byId.get(rid);
      const here = r.jurisdiction === state || (city && r.jurisdiction === city);
      // A rule of some other place never covers this address (note the unverified city is not "here": it is not confirmed).
      // ref is defined just below; it is only called after that point.
      memo.set(rid, here ? evalCoverage(r.cov, facts, asOf, ref) : { value: false });
      stack.delete(rid);
      return memo.get(rid).value;
    }
    const ref = (rid) => covValue(rid);
    ref.title = (rid) => { const r = byId.get(rid); return r ? `${r.citation || r.title} (${rid})` : rid; };

    // Step 1: each candidate rule's own result, before any rule gives way to another.
    const base = new Map();
    for (const r of cands) {
      const rid = r.team_rule_id;
      const st = statusAt(r.legal_state, r.effective_date, asOf);
      // A failed measure never appears: it is not law and was never going to be.
      if (st === "failed") continue;
      const unverifiedCity = !!(unverified && r.jurisdiction === unverified);
      // A pending bill is not law, so which buildings it would cover is moot and is not evaluated.
      const ev = st !== "pending" ? evalCoverage(r.cov, facts, asOf, ref) : null;
      let result;
      // A rule of a city the geocoder could not confirm: if it is in force we cannot say it applies, so it is unknown.
      // Pending and not-yet-effective keep their label because those do not depend on the address being in that city.
      if (unverifiedCity) result = st === "in_force" ? "unknown" : st === "not_yet_effective" ? "not_yet_effective" : "pending";
      else if (st === "pending") result = "pending";
      // Not yet effective but certainly not covering this building: leave it out. Otherwise show it, covered or not certain.
      else if (st === "not_yet_effective") { if (ev.value === false) continue; result = "not_yet_effective"; }
      // In force: not covered is dropped, covered applies, and anything uncertain is unknown (null never becomes "applies").
      else { if (ev.value === false) continue; result = ev.value === true ? "applies" : "unknown"; }
      base.set(rid, { rule: r, status: st, result, ev, unverified_city: unverifiedCity, by: null });
    }
    // Step 2: stricter rules displace the rules that list them in `overrides`. Every rule is judged against the results
    // from step 1 (orig), not against answers already changed here, so the outcome does not depend on the order of the loop.
    const orig = new Map([...base].map(([k, b]) => [k, b.result]));
    for (const [rid, b] of base) {
      // Only a rule that is, or may be, in force can be displaced; pending and not-yet-effective rules have nothing to give up.
      if (b.result !== "applies" && b.result !== "unknown") continue;
      for (const oid of b.rule.overrides || []) {
        if (!base.has(oid)) continue;
        // The overriding rule definitely applies here: this one is superseded and points to it. The first such rule wins.
        if (orig.get(oid) === "applies") { b.result = "superseded"; b.by = oid; break; }
        // The overriding rule might apply. We cannot keep saying "applies" unless the doubt is only about something the data can never show.
        if (orig.get(oid) === "unknown" && b.result === "applies") {
          const o = base.get(oid);
          // "hard" doubt (a missing building fact, an unverified city, or no coverage result) makes ours unknown too.
          // If the other rule is not explicitly hard=false, assume it is.
          const hard = !o.ev || o.unverified_city || o.ev.hard !== false;
          if (hard) { b.result = "unknown"; b.by = oid; }
          // The other rule hinges only on a special status the data cannot show: keep "applies" and say it may yield.
          else (b.may_yield = b.may_yield || []).push(oid);
        }
      }
    }
    const entries = [];
    // Sorted by rule id so the output order is stable and identical to the Python engine's.
    for (const rid of [...base.keys()].sort()) {
      const b = base.get(rid), r = b.rule;
      const partners = [...(partnersOf.get(rid) || [])].filter((p) => base.has(p)).sort();
      // Flag for human review (we never decide preemption ourselves): a conflicting rule is also present at this address,
      // or the rule carries its own conflict flag but names no partner at all. If its named partners are absent here, no flag.
      const flag = partners.length > 0 || (!!r.conflict_flag && !(partnersOf.get(rid) && partnersOf.get(rid).size));
      entries.push(makeEntry(r, b, base, partners, flag, asOf, basis, facts));
    }
    return { address_id: addr.address_id, as_of: asOf, city, city_basis: basis, entries };
  }

  /**
   * How a rule is named inside an explanation: its plain-English summary followed by the jurisdiction and citation.
   * @param {object} r rule
   * @returns {string} "<summary> (Statewide rule: <citation>)" or "<summary> (<jurisdiction> rule: <citation>)"; without
   *   a summary just "Statewide rule (<citation>)" or "<jurisdiction> rule (<citation>)". The citation falls back to the title.
   */
  function headOf(r) {
    const cite = r.citation || r.title;
    const where = r.level === "state" ? "Statewide rule" : `${r.jurisdiction} rule`;
    // Trailing full stops and spaces are removed so the sentence that embeds this can add its own punctuation.
    const plain = String(r.plain_en || "").replace(/\s+/g, " ").trim().replace(/[. ]+$/, "");
    return plain ? `${plain} (${where}: ${cite})` : `${where} (${cite})`;
  }

  /**
   * Build the answer for one rule at one address: the result, the explanation sentence, and the flags the app shows.
   * The explanation wording must match src/engine.py character for character (src/parity_test.py compares it).
   * @param {object} r the rule
   * @param {{result: string, ev: object|null, by: string|null, unverified_city: boolean, may_yield?: string[]}} b this
   *   rule's working record from lookupAddress (ev is null for a pending rule, by is the rule it gives way to)
   * @param {Map<string, object>} base working records of every rule that reaches this address, by rule id
   * @param {string[]} partners rules in conflict with this one that are also present at this address
   * @param {boolean} flag true if a person should review a possible conflict
   * @param {string} asOf date answered for
   * @param {string} basis how the city was found; "city_dataset" means it came from the parcel data, not the geocoder
   * @param {object} facts building facts used (parcel facts, possibly with what-if facts applied)
   * @returns {{team_rule_id: string, result: string, explanation: string, conflict_flag: boolean,
   *   confidence: "high"|"medium"|"low", caveats: string[], partners: string[], superseded_by: string|null,
   *   may_yield: string[]}}
   */
  function makeEntry(r, b, base, partners, flag, asOf, basis, facts) {
    const rid = r.team_rule_id, res = b.result, ev = b.ev;
    const where = headOf(r);
    const caveats = ev ? ev.caveats.slice() : [];
    let text;
    // One sentence group per result, always starting with the result word so the answer is clear at a glance.
    if (res === "applies") {
      // Lead with the facts that decided the test, at most two; a rule with no building test says so plainly.
      const why = join(ev.true_facts.concat(ev.false_facts), 2);
      text = `Applies. ${where}. `;
      if (why) text += cap1(why) + ".";
      else if (!ev.ruled_out.length) text += "No building-based coverage test applies.";
      if (ev.ruled_out.length) {
        const fl = factsLine(facts);
        text += (fl ? ` Parcel data: ${fl}.` : "") + " Exemptions ruled out by that data: " + join(ev.ruled_out, 3, 80) + ".";
      }
    } else if (res === "superseded") {
      const o = base.get(b.by).rule;
      text = `Superseded. ${where}. Here it gives way to ${o.citation || o.title} (${o.team_rule_id}), which applies at this address.`;
    } else if (res === "not_yet_effective") {
      text = `Not yet effective. ${where}. It takes effect ${r.effective_date || "on a date not stated"}; the as-of date is ${asOf}.`;
      if (ev && ev.value === null) text += " Coverage would depend on: " + join(ev.blockers, 2) + ".";
    } else if (res === "pending") {
      text = `Pending. ${where}. It has not been enacted, so it is not in force.`;
    } else if (b.unverified_city) {
      // Unknown has three different reasons, each worded differently: unconfirmed city, a possibly-displacing rule, or a missing fact.
      text = `Unknown. ${where}. This address could not be placed in ${r.jurisdiction} by the geocoder, so this city rule cannot be confirmed.`;
    } else if (b.by) {
      const o = base.get(b.by).rule;
      text = `Unknown. ${where}. It would apply unless ${o.citation || o.title} (${o.team_rule_id}) does, and that is not certain here.`;
      const ob = base.get(b.by).ev;
      if (ob && ob.blockers.length) text += " " + cap1(join(ob.blockers, 2)) + ".";
    } else {
      text = `Unknown. ${where}. Coverage depends on: ${join(ev.blockers, 3)}.`;
      if (ev.ruled_out.length) text += " Exemptions ruled out by the parcel data: " + join(ev.ruled_out, 3, 80) + ".";
    }
    // Assumptions are never hidden: an "applies" that rests on an exemption we assumed away says so, and gets medium confidence below.
    if (res === "applies" && caveats.length) text += " Not checked from parcel data: " + join(caveats, 3) + ".";
    // Still "applies", but another rule could displace it and the only doubt is a status the data cannot show.
    if (res === "applies" && b.may_yield) {
      for (const oid of b.may_yield) {
        const o = base.get(oid);
        const ob = o.ev ? o.ev.blockers : [];
        text += ` Could yield to ${o.rule.citation || o.rule.title} (${oid}), which cannot be checked here: ${join(ob, 1, 160)}.`;
      }
    }
    // Side notes (for example a tenancy condition) are shown for live answers only; only the first one, to keep the text short.
    if (ev && ev.notes.length && (res === "applies" || res === "unknown")) text += " " + cap1(ev.notes[0]) + ".";
    // Say so when the city came from the parcel dataset instead of the Census geocoder, since that is a weaker basis.
    if (basis === "city_dataset" && r.level === "city") text += " City taken from the parcel dataset (not geocoded).";
    // Possible preemption or conflict is flagged for a person to review, never decided here.
    if (flag) {
      text += " Flagged: possible conflict with " +
        (partners.length ? partners.map((p) => `${base.get(p).rule.citation || base.get(p).rule.title} (${p})`).join(", ") : "another rule") +
        "; needs human review.";
    }
    // Confidence in the answer: high if nothing was assumed, medium if an assumption or a possible override is involved,
    // low for unknown. Dates and legal status are computed by code, so the other results are high.
    let conf = res === "applies" ? (caveats.length || b.may_yield ? "medium" : "high") : res === "unknown" ? "low" : "high";
    // A rule the model extracted with low confidence (under 0.7) cannot give a "high" answer; no stated confidence is not penalised.
    const ec = r.confidence === null || r.confidence === undefined ? 1 : r.confidence;
    if (ec < 0.7 && conf === "high") conf = "medium";
    // superseded_by is set only when another rule displaces this one (superseded) or may do so (unknown).
    return { team_rule_id: rid, result: res, explanation: text, conflict_flag: flag, confidence: conf, caveats, partners, superseded_by: res === "superseded" || res === "unknown" ? b.by : null, may_yield: b.may_yield || [] };
  }

  /* Public API. In the browser it is the global NavEngine (the app uses lookupAddress, applyWhatIf and parseDate); under Node it is
     module.exports, which is how src/parity_test.py loads this file. The IIFE keeps every helper above private. */
  const api = { QUERY_DATE, RESULT_ORDER, parseDate, statusAt, lookupAddress, evalCoverage, applyWhatIf };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.NavEngine = api;
})(typeof self !== "undefined" ? self : this);

35Z","quoted_span":"Starting July 1, 2024, many landlords may only charge one month's rent for unfurnished and furnished units"}],"cov":{"scope":"universal","conditions":[],"exemptions":[],"support":"own text coverage_text","reasoning":"Applies to security for any residential rental in California with no building test."}},{"team_rule_id":"r-0004","jurisdiction":"CA","level":"state","category":"application_screening_fees","legal_state":"enacted","status":"in_force","title":"California application screening fee limits","requirement":"A landlord may charge an application screening fee only up to actual out-of-pocket costs and the reasonable value of time spent, never more than $30 per applicant (adjustable annually with CPI since 1998), and may not charge it when no unit is or will soon be available. The landlord must either consider applications in order and approve the first qualified applicant (charging only when an application is actually considered), or refund the full fee within 7 days of selecting a tenant or 30 days of application, whichever is first; an itemized receipt is required.","key_value":"$30 per applicant, CPI-adjusted; itemized receipt required","plain_en":"Landlords can charge only actual screening costs, never over $30 (adjusted for inflation), and must give an itemized receipt.","citation":"Cal. Civ. Code § 1950.6","effective_date":"2026-01-01","source_doc_id":"D026","source_url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1950.6","quoted_span":"In no case shall the amount of the application screening fee charged by the landlord or their agent be greater than thirty dollars ($30) per applicant.","retrieved_at":"2026-10-01T22:35Z","confidence":0.95,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Applies to any landlord (owner of residential rental property) or their agent who charges an applicant a screening fee for a residential rental.","exemptions":null,"interaction":"Applies notwithstanding Civ. Code § 1950.5, and the fee is not treated as security under that section. It does not preempt rules on deposits and fees under federal or state housing assistance programs.","supporting_sources":[{"doc_id":"D005","source_url":"https://rentboard.berkeleyca.gov/laws-regulations/city-berkeley-ordinances-affecting-rental-properties/tenant-screening-and","retrieved_at":"2026-10-01T22:35Z","quoted_span":"The landlord cannot charge a prospective tenant a screening fee if no rental unit is actually available."}],"cov":{"scope":"universal","conditions":[],"exemptions":[],"support":"own text coverage_text","reasoning":"Applies to any landlord charging a screening fee for a residential rental."}},{"team_rule_id":"r-0005","jurisdiction":"CA","level":"state","category":"screening_restrictions","legal_state":"enacted","status":"in_force","title":"California FEHA housing screening limits","requirement":"Owners may not discriminate against or harass a person because of source of income (including Section 8 and HUD-VASH vouchers and other public assistance). Where a government rent subsidy applies, income standards must be based on the tenant's share of rent, and applicants must be allowed to offer alternative evidence of ability to pay instead of credit history; owners may still ask about the level or source of income.","key_value":"Source of income protected; subsidy-based income test uses tenant's portion of rent","plain_en":"Landlords cannot discriminate against applicants or tenants because of their income source, including housing vouchers.","citation":"California Fair Employment and Housing Act (FEHA); Cal. Gov. Code § 12955","effective_date":"2024-01-01","source_doc_id":"D027","source_url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=12955","quoted_span":"For the owner of any housing accommodation to discriminate against or harass any person because of the race, color, religion, sex, gender, gender identity, gender expression, sexual orientation, marital status, national origin, ancestry, familial status, source of income,","retrieved_at":"2026-10-01T22:35Z","confidence":0.8,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Applies to owners of any housing accommodation in California, with no stated size, age or owner-type limits.","exemptions":null,"interaction":null,"supporting_sources":[{"doc_id":"D016","source_url":"https://calcivilrights.ca.gov/housing/","retrieved_at":"2026-10-01T22:35Z","quoted_span":"California law protects tenants from discrimination based on how a tenant will be paying rent (“source of income”)."},{"doc_id":"D016","source_url":"https://calcivilrights.ca.gov/housing/","retrieved_at":"2026-10-01T22:35Z","quoted_span":"Housing providers are also prohibited from having “blanket bans” of all people with a criminal history."}],"cov":{"scope":"universal","conditions":[],"exemptions":[],"support":"own text coverage_text","reasoning":"Applies to owners of any housing accommodation in California with no limits."}},{"team_rule_id":"r-0006","jurisdiction":"CA","level":"state","category":"algorithmic_rent_setting","legal_state":"enacted","status":"in_force","title":"California common pricing algorithm ban","requirement":"It is unlawful to use or distribute a common pricing algorithm, meaning software or other technology used by two or more persons that uses competitor data to recommend, align, set or influence a price, as part of a conspiracy to restrain trade, or to coerce another person to adopt the algorithm's recommended price or term. The text is general and does not name rental housing.","key_value":null,"plain_en":"It is illegal to use or sell shared pricing software built on competitors' data to coordinate prices or force others to follow its prices.","citation":"Cal. Bus. & Prof. Code § 16729","effective_date":"2026-01-01","source_doc_id":"D022","source_url":"https://leginfo.legislature.ca.gov/faces/billNavClient.xhtml?bill_id=202520260AB325","quoted_span":"It shall be unlawful for a person to use or distribute a common pricing algorithm as part of a contract, combination in the form of a trust, or conspiracy to restrain trade or commerce in violation of this chapter.","retrieved_at":"2026-10-01T22:35Z","confidence":0.7,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Applies to any person using or distributing a common pricing algorithm in California; the text does not limit it to residential rentals or specific building types.","exemptions":"The end consumer of a product or service is excluded from the definition of 'person'.","interaction":"Section 16729(c) states that nothing in the section impairs or limits the applicability of antitrust laws. Statute does not limit antitrust laws; nothing about local rules.","supporting_sources":[],"cov":{"scope":"universal","conditions":[],"exemptions":[],"support":"own text coverage_text","reasoning":"The text applies to any person in California and sets no building tests."}},{"team_rule_id":"r-0007","jurisdiction":"NJ","level":"state","category":"rent_increase_limits","legal_state":"enacted","status":"in_force","title":"NJ no state rent control; municipalities may adopt rent control","requirement":"The State of New Jersey has no laws that establish, govern or control rents, but municipalities may pass rent control or rent leveling ordinances enforced by local boards. Landlords may raise rent only by proper lease termination and written notice, the increase must not be unconscionable, and it must comply with any municipal rent control ordinance. Newly constructed multiple dwellings are exempt from local rent control for 30 years after completion of construction.","key_value":"No state cap; local rent control permitted; new multiple dwellings exempt 30 years","plain_en":"New Jersey has no statewide rent control, but towns may adopt their own, and rent increases need proper written notice and cannot be unconscionable.","citation":"N.J.S.A. 2A:18-61.1 et seq.; N.J.S.A. 2A:42-84.5","effective_date":null,"source_doc_id":"D067","source_url":"https://www.nj.gov/dca/codes/publications/pdf_lti/t_i_r.pdf","quoted_span":"The State of New Jersey has no laws that establish, govern or control rents. Municipalities \nmay pass an ordinance establishing rent control or rent leveling.","retrieved_at":"2026-10-01T22:37Z","confidence":0.85,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Statewide rent increase notice and unconscionability rules apply to residential rentals generally; whether a unit is subject to a rent cap depends on the municipality's rent control ordinance.","exemptions":"Newly constructed multiple dwellings are exempt from local rent control for 30 years after completion; governmentally subsidized rents, HUD-owned or subsidized developments, and NJHMFA-financed projects may be exempt from local rent control ordinances.","interaction":"State law sets no rent cap and leaves rent control to municipal ordinances; rent increases must comply with any municipal ordinance, and the Newly Constructed Multiple Dwellings Law exempts new buildings from local rent control for 30 years. State sets no cap and delegates rent control to municipalities; delegation, not yielding.","supporting_sources":[],"cov":{"scope":"universal","conditions":[],"exemptions":[],"support":"own text requirement and coverage_text; new-building exemption applies to local rent control, not this rule","reasoning":"The record states the state has no rent control and applies to rentals generally, so universal with no exemptions."}},{"team_rule_id":"r-0008","jurisdiction":"NJ","level":"state","category":"just_cause_eviction","legal_state":"enacted","status":"in_force","title":"NJ Anti-Eviction Act","requirement":"A residential landlord may remove a tenant or refuse to renew a lease only for a statutory good cause and through a court judgment for possession. Each cause except nonpayment requires a written Notice to Quit with a cause-specific period (3 days to 3 years), some causes need a prior Notice to Cease, and removal for substantial health and safety violations requires relocation assistance first.","key_value":"Good cause required; Notice to Quit periods from 3 days up to 3 years depending on cause; relocation assistance of 6 times monthly rent for illegal occupancy evictions","plain_en":"Landlords can evict or refuse to renew a lease only for specific legal reasons and with a court order, after giving the required written notice.","citation":"N.J.S.A. 2A:18-61.1 to 61.12","effective_date":null,"source_doc_id":"D067","source_url":"https://www.nj.gov/dca/codes/publications/pdf_lti/t_i_r.pdf","quoted_span":"No residential landlord may evict or fail to renew a \nlease, whether it is a written or an oral lease without good cause.","retrieved_at":"2026-10-01T22:37Z","confidence":0.9,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Applies to most residential rental properties, including single-family homes, mobile homes and mobile home park land, apartment buildings and complexes, and rooming and boarding houses.","exemptions":"Not applicable to two- or three-unit owner-occupied premises with two or fewer rental units, hotel/motel/guest-house transient or seasonal guests (unless the occupant has no alternate residence and resides there continually), or a unit held in trust for a developmentally disabled immediate family member who permanently occupies it.","interaction":"Rent increases underlying a nonpayment-of-increase eviction must comply with other laws and municipal ordinances, including rent control. Condominium/cooperative conversion evictions must also comply with the conversion regulations and the Senior Citizens and Disabled Protected Tenancy Act.","supporting_sources":[{"doc_id":"D067","source_url":"https://www.nj.gov/dca/codes/publications/pdf_lti/t_i_r.pdf","retrieved_at":"2026-10-01T22:37Z","quoted_span":"Tenants of landlord-occupied two- and three-family dwellings can be removed only when \na court issues an order for eviction."}],"cov":{"scope":"universal","conditions":[],"exemptions":[{"label":"Owner-occupied premises with two or fewer rental units","conditions":[{"fact":"owner_occupied","op":"is","value":"true","years_before_as_of":0,"text":"two- or three-unit owner-occupied premises"},{"fact":"units","op":"<=","value":"3","years_before_as_of":0,"text":"two- or three-unit premises with two or fewer rental units"}]},{"label":"Hotel, motel or guest house transient guests","conditions":[{"fact":"use_type","op":"is","value":"hotel or motel","years_before_as_of":0,"text":"hotel, motel, guest-house transient or seasonal guests"}]},{"label":"Unit held in trust for developmentally disabled family member","conditions":[{"fact":"status_not_in_data","op":"is","value":"unit held in trust for developmentally disabled family member","years_before_as_of":0,"text":"a unit held in trust for a developmentally disabled immediate family member who permanently occupies it"}]}],"support":"own text coverage_text and exemptions_text","reasoning":"Covers most residential rentals statewide with listed exemptions."}},{"team_rule_id":"r-0009","jurisdiction":"NJ","level":"state","category":"security_deposits","legal_state":"enacted","status":"in_force","title":"NJ Security Deposit Law","requirement":"A landlord may not collect a security deposit of more than one and one-half times one month's rent, and any yearly increase in the deposit may not exceed 10% of the current deposit. Prepaid rent held as security, including last month's rent, counts toward the cap, and a pet deposit cannot push the total above the cap.","key_value":"1.5 x monthly rent; annual increase max 10% of current deposit","plain_en":"Landlords cannot collect a security deposit above one and a half months' rent, and yearly increases to the deposit are capped at 10%.","citation":"N.J.S.A. 46:8-21.2; N.J.S.A. 46:8-19; N.J.S.A. 46:8-21.1","effective_date":null,"source_doc_id":"D067","source_url":"https://www.nj.gov/dca/codes/publications/pdf_lti/t_i_r.pdf","quoted_span":"The maximum-security deposit to be collected by the landlord cannot be more than \none and one-half times one month’s rent ( N.J.S.A. 46:8-21.2 ).","retrieved_at":"2026-10-01T22:37Z","confidence":0.9,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Applies to most residential rental properties in New Jersey, including mobile homes.","exemptions":"Owner-occupied two- or three-family dwellings are exempt, but a tenant there can make the law apply by sending the landlord a written request, effective 30 days later.","interaction":null,"supporting_sources":[{"doc_id":"D067","source_url":"https://www.nj.gov/dca/codes/publications/pdf_lti/t_i_r.pdf","retrieved_at":"2026-10-01T22:37Z","quoted_span":"Within 30 days after the termination of a tenancy, a landlord must return the security \ndeposit, plus interest earned less deductions, to the tenant ( N.J.S.A. 46:8-21.1)."}],"cov":{"scope":"universal","conditions":[],"exemptions":[{"label":"Owner-occupied two- or three-family dwelling","conditions":[{"fact":"owner_occupied","op":"is","value":"true","years_before_as_of":0,"text":"Owner-occupied"},{"fact":"units","op":"<=","value":"3","years_before_as_of":0,"text":"two- or three-family dwellings"}]}],"support":"own text coverage_text and exemptions_text","reasoning":"Applies to most NJ residential rentals except owner-occupied two- or three-family dwellings."}},{"team_rule_id":"r-0010","jurisdiction":"NJ","level":"state","category":"application_screening_fees","legal_state":"enacted","status":"in_force","title":"NJ rental application fee cap","requirement":"A landlord or agent may not require an application or similar fee to apply to lease or sublease a residential rental property that exceeds $50, adjusted annually for CPI increases. Violators face penalties of up to $500 (first), $750 (second) and $1,000 (subsequent offenses), and the amount wrongfully charged is remitted to the applicant.","key_value":"$50 cap (CPI-adjusted annually)","plain_en":"Landlords cannot charge more than $50 (adjusted for inflation) to apply for a rental, except in one- or two-family homes.","citation":"N.J.S.A. 46:8-18.1","effective_date":"2026-05-01","source_doc_id":"D066","source_url":"https://pub.njleg.gov/bills/2024/PL25/405_.HTM","quoted_span":"A landlord, or\nagent thereof, shall not require an application or other similar fee to apply\nto lease or sublease a residential rental property for dwelling purposes, which\nexceeds $50.","retrieved_at":"2026-10-01T22:37Z","confidence":0.95,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Applies to residential rental properties for dwelling purposes, except one- and two-family dwellings and non-landlord real estate licensees.","exemptions":"Exempts units in one- or two-family dwellings offered for rent, and NJ Real Estate Commission licensees unless the licensee is the landlord.","interaction":null,"supporting_sources":[],"cov":{"scope":"universal","conditions":[],"exemptions":[{"label":"One- or two-family dwelling","conditions":[{"fact":"units","op":"<=","value":"2","years_before_as_of":0,"text":"a dwelling unit in a one-family or two-family dwelling"}]},{"label":"Real estate licensee who is not the landlord","conditions":[{"fact":"tenancy","op":"is","value":"real estate licensee who is not the landlord","years_before_as_of":0,"text":"NJ Real Estate Commission licensee unless the licensee is the landlord"}]}],"support":"own text coverage_text and exemptions_text","reasoning":"Applies to residential rentals except one- and two-family dwellings and non-landlord licensees."}},{"team_rule_id":"r-0011","jurisdiction":"NJ","level":"state","category":"screening_restrictions","legal_state":"enacted","status":"in_force","title":"NJ Fair Chance in Housing Act","requirement":"Housing providers may not ask about or consider an applicant's criminal record before making a conditional offer. After a conditional offer, only certain convictions within set look-back periods may be considered, subject to an individualized assessment, written notice of withdrawal, and an appeal opportunity. Providers also may not require drug or alcohol tests of applicants.","key_value":"No criminal-record inquiry before conditional offer; look-back 6 years (1st degree), 4 years (2nd/3rd degree), 1 year (4th degree); serious listed offenses and lifetime sex-offender registration have no look-back limit","plain_en":"Landlords cannot ask about or use an applicant's criminal record until after a conditional offer, and then only limited convictions with an individual review.","citation":"N.J.S.A. 46:8-52 et seq.","effective_date":"2022-01-01","source_doc_id":"D065","source_url":"https://pub.njleg.gov/bills/2020/PL21/110_.HTM","quoted_span":"A housing\nprovider\nshall not make any oral or written inquiry\nregarding an applicant’s criminal record prior to making a conditional offer.","retrieved_at":"2026-10-01T22:37Z","confidence":0.95,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Covers rental dwelling units offered for rent by housing providers, other than units in owner-occupied premises of not more than four dwelling units.","exemptions":"A dwelling unit in an owner-occupied premises of not more than four dwelling units is not a covered rental dwelling unit.","interaction":"Does not bar or affect independent rights or actions, including under the Law Against Discrimination (P.L.1945, c.169). Enforcement is through the Division on Civil Rights rather than court actions.","supporting_sources":[],"cov":{"scope":"universal","conditions":[],"exemptions":[{"label":"Owner-occupied premises of not more than four units","conditions":[{"fact":"owner_occupied","op":"is","value":"true","years_before_as_of":0,"text":"owner-occupied premises"},{"fact":"units","op":"<=","value":"4","years_before_as_of":0,"text":"not more than four dwelling units"}]}],"support":"own text coverage_text and exemptions_text","reasoning":"Covers rental units except those in owner-occupied premises of four units or fewer."}},{"team_rule_id":"r-0012","jurisdiction":"NJ","level":"state","category":"screening_restrictions","legal_state":"enacted","status":"in_force","title":"NJ Law Against Discrimination source-of-income ban","requirement":"The New Jersey Law Against Discrimination requires equal treatment in renting housing regardless of listed characteristics, including source of lawful income. A landlord may still refuse to rent for insufficient income or poor credit history.","key_value":"Source of lawful income is a protected class","plain_en":"Landlords cannot refuse to rent because of an applicant's lawful income source, but may still turn down applicants for too little income or bad credit.","citation":"N.J.S.A. 10:5-12; New Jersey Law Against Discrimination (N.J.S.A. 10:5-1 et seq.)","effective_date":null,"source_doc_id":"D067","source_url":"https://www.nj.gov/dca/codes/publications/pdf_lti/t_i_r.pdf","quoted_span":"prohibits discrimination when selling or renting property and requires \nequal treatment in the sale or rental of housing regardless of race, creed, color, national origin,","retrieved_at":"2026-10-01T22:37Z","confidence":0.75,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Applies to all landlord-tenant relationships in New Jersey except two-family owner-occupied dwellings and rooms in an owner- or resident-occupied single home (and certain sex-exclusive or age-restricted housing as it pertains to familial status).","exemptions":"Excludes two-family owner-occupied dwellings, rooms in an owner- or resident-occupied single home, and residences planned exclusively for and occupied by one sex or age-restricted housing as it pertains to familial status.","interaction":"A landlord may still refuse to rent for insufficient income or poor credit history under the federal provisions the guide cites (42 U.S.C.A. § 3601 to -3610).","supporting_sources":[{"doc_id":"D068","source_url":"https://www.nj.gov/oag/dcr/downloads/kyrhousing02.pdf","retrieved_at":"2026-10-01T22:37Z","quoted_span":"The LAD also prohibits housing discrimination  based\non the source of lawful income or source of lawful rent\nor mortgage payment a tenant or purchaser uses."}],"cov":{"scope":"universal","conditions":[],"exemptions":[{"label":"Two-family owner-occupied dwelling","conditions":[{"fact":"units","op":"==","value":"2","years_before_as_of":0,"text":"two-family owner occupied dwellings"},{"fact":"owner_occupied","op":"is","value":"true","years_before_as_of":0,"text":"owner occupied"}]},{"label":"Room in owner- or resident-occupied single home","conditions":[{"fact":"units","op":"==","value":"1","years_before_as_of":0,"text":"rooms in an owner or resident-occupied single home"},{"fact":"owner_occupied","op":"is","value":"true","years_before_as_of":0,"text":"owner or resident-occupied"}]}],"support":"own text coverage_text and exemptions_text","reasoning":"Applies to all landlord-tenant relationships except the listed small owner-occupied cases."}},{"team_rule_id":"r-0013","jurisdiction":"NJ","level":"state","category":"algorithmic_rent_setting","legal_state":"enacted","status":"not_yet_effective","title":"NJ FAIR Act algorithmic rent-setting ban","requirement":"It is unlawful for rental property owners to pay for or use a coordinator's services, for coordinators to perform a coordinating function or facilitate agreements restricting competition, and for any persons to engage in or facilitate parallel pricing coordination through algorithmic pricing. Violations are treated as violations of the New Jersey Antitrust Act, and municipalities may not enact conflicting ordinances.","key_value":"Bans use or operation of algorithmic rent-setting that pools competitively sensitive information or sets parallel prices","plain_en":"Rental owners and software coordinators cannot use algorithms that pool competitors' data to coordinate rent prices, and breaking this counts as an antitrust violation.","citation":"P.L. 2026, c.43 (C.56:9-20 to 56:9-26)","effective_date":"2027-07-01","source_doc_id":"D069","source_url":"https://pub.njleg.state.nj.us/Bills/2026/AL26/43_.HTM","quoted_span":"a rental property owner, or any agent,\nrepresentative, or subcontractor thereof, to receive, subscribe to, contract\nfor, or otherwise exchange any form of consideration in return for the use of,\nthe services of a coordinator;","retrieved_at":"2026-10-01T22:56Z","confidence":0.93,"overrides":[],"_conflicts_with":["r-0043","r-0046"],"conflict_flag":true,"conflict_note":"Possible conflict with Jersey City Code § 218-12 (r-0043); needs human review. Possible conflict with Hoboken City Code § 158-2 (Ord. No. B-781) (r-0046); needs human review.","coverage_conditions":"Applies to rental property owners (anyone owning one or more residential rental units in NJ), their agents, and coordinators operating algorithmic revenue management software or algorithmic devices.","exemptions":"Excludes research/statistical use not used to set rents, free public rent estimates, equal-terms real estate brokerage databases that do not set or recommend rents, and government-set rents under affordability controls; residential dwelling units exclude inpatient medical care, licensed long-term care, and detention or correctional facilities.","interaction":"Supplements and does not limit the New Jersey Antitrust Act (P.L.1970, c.73), whose enforcement provisions in sections 6 through 17 apply to violations. Municipalities cannot enact ordinances conflicting with the act except those explicitly authorized or required by other law. Municipalities may not enact ordinances conflicting with the act, so local algorithm bans in Jersey City and Hoboken may be preempted.","supporting_sources":[],"cov":{"scope":"universal","conditions":[],"exemptions":[],"support":"own text coverage_text; exclusions concern facility types and tools, not tested here","reasoning":"Applies to rental property owners, agents and coordinators statewide with no building test."}},{"team_rule_id":"r-0014","jurisdiction":"MA","level":"state","category":"rent_increase_limits","legal_state":"enacted","status":"in_force","title":"Massachusetts prohibition on local rent control","requirement":"No Massachusetts city or town may enact, maintain or enforce rent control of any kind. A municipality that accepts the chapter may adopt only a voluntary, compensated form of rent control, which cannot cover units of owners with fewer than ten rental units or units with fair market rent above $400.","key_value":"Local rent control prohibited; narrow voluntary exception","plain_en":"Massachusetts cities and towns cannot adopt rent control, apart from a narrow voluntary and compensated form.","citation":"G.L. c. 40P § 4","effective_date":null,"source_doc_id":"D048","source_url":"https://malegislature.gov/Laws/GeneralLaws/PartI/TitleVII/Chapter40P/Section4","quoted_span":"No city or town may enact, maintain or enforce rent control of any kind, except that any city or town that accepts this chapter may adopt rent control regulation that provides:","retrieved_at":"2026-10-01T22:36Z","confidence":0.9,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Applies to all Massachusetts cities and towns that might adopt local rent control, and thereby to residential rental units statewide.","exemptions":"A city or town that accepts the chapter may adopt rent control only if compliance is voluntary after six months, it excludes units owned by persons or entities owning fewer than ten rental units or with fair market rent over $400, it does not regulate occupancy, services, evictions, condominium conversion or removal from regulation, and the municipality compensates owners for the difference between fair market rent and the controlled rent.","interaction":"Displaces any local rent control ordinance in Massachusetts cities such as Boston and Cambridge, except the narrow voluntary, compensated form the statute permits. Displaces local rent control in MA; no local rent-cap groups present.","supporting_sources":[],"cov":{"scope":"universal","conditions":[],"exemptions":[],"support":"own text coverage_text","reasoning":"Applies to all Massachusetts cities and towns and thus rentals statewide."}},{"team_rule_id":"r-0015","jurisdiction":"MA","level":"state","category":"rent_increase_limits","legal_state":"failed","status":"failed","title":"Statewide rent control ballot initiative","requirement":"The proposed ballot initiative would have limited annual rent increases for residences statewide, with exemptions for certain unit types including units operated solely for religious purposes. The Supreme Judicial Court ruled it cannot go on the November 2026 ballot.","key_value":null,"plain_en":"A ballot question that was struck down and never became law, which would have capped yearly rent increases statewide.","citation":"Massachusetts rent control ballot initiative petition (2026)","effective_date":null,"source_doc_id":"D059","source_url":"https://www.wbur.org/news/2026/06/23/massachusetts-high-court-rent-control-ballot-question-struck","quoted_span":"The proposal limits annual rent increases for residences, but it carved out exemptions for several types of units,","retrieved_at":"2026-10-03","confidence":0.5,"overrides":[],"_conflicts_with":[],"conflict_flag":false,"conflict_note":null,"coverage_conditions":"Residences generally, with exemptions for several unit types; the article does not give the full coverage terms.","exemptions":"Exempted several types of units, in
