# Runs on every push and pull request. It never calls the Claude API or the Census geocoder:
# the tests use a fake model client and the answers already saved in outputs/ and cache/.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Node is only needed to prove that the browser engine (web/engine.js) gives the same answers as src/engine.py.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes

      - name: Static check (unused imports, undefined names)
        run: python -m pyflakes src tests

      - name: Unit tests and Python/JavaScript parity
        run: python -m unittest discover -s tests -t . -v

      - name: Self-check of the saved outputs
        run: python src/selfcheck.py
